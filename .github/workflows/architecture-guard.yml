name: Architecture Guard

# The layer rules, run through the tools that own them (chat test_layering,
# depguard in every Go module, dependency-cruiser for the TypeScript tree), and
# the self-test that proves each of them still refuses a known violation
# (modules/tools/gate-fixtures). A second job checks that every `make X` the
# agent docs name is a real target.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: arch-guard-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: v2.12.2
  # A gate whose tool is missing fails the self-test instead of being skipped.
  GATE_FIXTURES_REQUIRE_ALL: "1"

jobs:
  check-architecture:
    name: Layer Boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: modules/services/auth/go.mod

      - name: install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" "$GOLANGCI_LINT_VERSION"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: install mobile dependencies
        working-directory: modules/apps/mobile
        run: npm ci

      - name: make check-architecture
        run: make check-architecture

  doc-make-targets:
    name: Doc make targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: make check-doc-make-targets
        run: make check-doc-make-targets

      - name: make check-jwt-audience-tests
        run: make check-jwt-audience-tests
