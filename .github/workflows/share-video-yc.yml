name: Services / Share-Video / Yandex Cloud

# Auth flow:
#   - LECTORIUM_YC_SA_KEY_JSON (Service-Account authorized JSON key) is
#     exchanged for a short-lived IAM token via yc-actions/yc-iam-token.
#   - LECTORIUM_YC_ACCESS_KEY_ID/SECRET (akds-service-user static keys)
#     are passed as AWS_ACCESS_KEY_ID/SECRET so the YC plugin can upload
#     the deploy artifact to YC Object Storage.
# Function runtime envs:
#   - YC_RUNTIME_* — YC static keys (lectorium-share-audio SA) the function
#     uses to read/write its OWN YC bucket via @aws-sdk/client-s3.
#   - SPEECHKIT_API_KEY — Yandex SpeechKit API key (OpenAI is geo-blocked
#     from YC, so we don't pass any OpenAI creds here).

on:
  push:
    branches: [main]
    paths:
      - modules/services/share-video/**
      - .github/workflows/share-video-yc.yml
  pull_request:
    branches: [main]
    paths:
      - modules/services/share-video/**
      - .github/workflows/share-video-yc.yml
  workflow_dispatch:

concurrency:
  group: share-video-yc-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: modules/services/share-video

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      # YC plugin reads ~/.config/yandex-cloud/config.yaml unconditionally at
      # plugin-init time, even for `serverless print`. Stub it so the plugin
      # can initialise; we never actually call YC APIs in validate.
      - name: Stub YC config (plugin init only)
        run: |
          mkdir -p ~/.config/yandex-cloud
          printf 'current: default\nprofiles:\n  default:\n    token: placeholder\n    cloud-id: placeholder\n    folder-id: placeholder\n' \
            > ~/.config/yandex-cloud/config.yaml
      - run: npx serverless print --config serverless-yc.yml
        env:
          SPEECHKIT_API_KEY: placeholder
          YC_RUNTIME_ACCESS_KEY_ID: placeholder
          YC_RUNTIME_SECRET_ACCESS_KEY: placeholder
          YC_SERVICE_ACCOUNT_ID: placeholder

  deploy:
    name: deploy
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch ffmpeg + ffprobe static binaries
        run: |
          mkdir -p layers/ffmpeg/bin
          curl -sSL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz \
            | tar -xJ --strip-components=1 -C layers/ffmpeg/bin --wildcards '*/ffmpeg' '*/ffprobe'
          chmod +x layers/ffmpeg/bin/ffmpeg layers/ffmpeg/bin/ffprobe
      - run: npm ci
      - run: npm run build
      - name: Exchange SA key for short-lived IAM token
        id: yc-iam
        uses: yc-actions/yc-iam-token@v1
        with:
          yc-sa-json-credentials: ${{ secrets.LECTORIUM_YC_SA_KEY_JSON }}
      - name: Deploy to Yandex Cloud
        run: npx serverless deploy --config serverless-yc.yml
        env:
          YC_IAM_TOKEN: ${{ steps.yc-iam.outputs.token }}
          YC_CLOUD_ID: b1gjad74ff5i9opem2aj
          YC_FOLDER_ID: ${{ vars.LECTORIUM_YC_FOLDER_ID }}
          YC_SERVICE_ACCOUNT_ID: ${{ secrets.LECTORIUM_YC_SERVICE_ACCOUNT_ID }}
          # YC plugin uses AWS SDK to upload artifact to YC Object Storage.
          AWS_ACCESS_KEY_ID: ${{ secrets.LECTORIUM_YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.LECTORIUM_YC_SECRET_ACCESS_KEY }}
          # Function-runtime envs: workflow translates cloud-prefixed secret → generic in-function name.
          YC_RUNTIME_ACCESS_KEY_ID: ${{ secrets.LECTORIUM_YC_RUNTIME_ACCESS_KEY_ID }}
          YC_RUNTIME_SECRET_ACCESS_KEY: ${{ secrets.LECTORIUM_YC_RUNTIME_SECRET_ACCESS_KEY }}
          SPEECHKIT_API_KEY: ${{ secrets.LECTORIUM_YC_SPEECHKIT_API_KEY }}
