name: Services / Share-Audio / Yandex Cloud

# Auth flow:
#   - SHRUTI_YC_SA_KEY_JSON (Service-Account authorized JSON key) is
#     exchanged for a short-lived IAM token via yc-actions/yc-iam-token.
#   - SHRUTI_YC_ACCESS_KEY_ID/SECRET (akds-service-user static keys)
#     are passed as AWS_ACCESS_KEY_ID/SECRET so the YC plugin can upload
#     the deploy artifact to YC Object Storage.
# Function runtime envs:
#   - YC_RUNTIME_* — YC static keys (shruti-share-audio SA) the function
#     uses to read/write its OWN YC bucket via boto3 (S3_ENDPOINT_URL =
#     YC). Excerpts land at https://cdn-ru.shruti.local
#     for russia-region clients (no more cross-cloud writes to AWS).

on:
  push:
    branches: [main]
    paths:
      - modules/services/share-audio/**
      - .github/workflows/share-audio-yc.yml
  pull_request:
    branches: [main]
    paths:
      - modules/services/share-audio/**
      - .github/workflows/share-audio-yc.yml
  workflow_dispatch:

concurrency:
  group: share-audio-yc-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: modules/services/share-audio

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      # YC plugin reads ~/.config/yandex-cloud/config.yaml unconditionally at
      # plugin-init time, even for `serverless print`. Stub it so the plugin
      # can initialise; we never actually call YC APIs in validate.
      - name: Stub YC config (plugin init only)
        run: |
          mkdir -p ~/.config/yandex-cloud
          printf 'current: default\nprofiles:\n  default:\n    token: placeholder\n    cloud-id: placeholder\n    folder-id: placeholder\n' \
            > ~/.config/yandex-cloud/config.yaml
      - run: npx serverless print --config serverless-yc.yml
        env:
          YC_RUNTIME_ACCESS_KEY_ID: placeholder
          YC_RUNTIME_SECRET_ACCESS_KEY: placeholder
          YC_SERVICE_ACCOUNT_ID: placeholder

  deploy:
    name: deploy
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch ffmpeg static binary
        run: |
          mkdir -p layers/ffmpeg/bin
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors \
            -o layers/ffmpeg/bin/ffmpeg \
            https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-linux-x64
          chmod +x layers/ffmpeg/bin/ffmpeg
      - run: npm ci
      - name: Exchange SA key for short-lived IAM token
        id: yc-iam
        uses: yc-actions/yc-iam-token@v1
        with:
          yc-sa-json-credentials: ${{ secrets.SHRUTI_YC_SA_KEY_JSON }}
      - name: Deploy to Yandex Cloud
        run: npx serverless deploy --config serverless-yc.yml
        env:
          YC_IAM_TOKEN: ${{ steps.yc-iam.outputs.token }}
          YC_CLOUD_ID: b1gjad74ff5i9opem2aj
          YC_FOLDER_ID: ${{ vars.SHRUTI_YC_FOLDER_ID }}
          YC_SERVICE_ACCOUNT_ID: ${{ secrets.SHRUTI_YC_SERVICE_ACCOUNT_ID }}
          # YC plugin uses AWS SDK to upload artifact to YC Object Storage.
          AWS_ACCESS_KEY_ID: ${{ secrets.SHRUTI_YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SHRUTI_YC_SECRET_ACCESS_KEY }}
          # Function-runtime envs — same YC static keys share-video YC uses.
          YC_RUNTIME_ACCESS_KEY_ID: ${{ secrets.SHRUTI_YC_RUNTIME_ACCESS_KEY_ID }}
          YC_RUNTIME_SECRET_ACCESS_KEY: ${{ secrets.SHRUTI_YC_RUNTIME_SECRET_ACCESS_KEY }}
