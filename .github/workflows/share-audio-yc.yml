name: Services / Share-Audio / Yandex Cloud

# Manual dispatch only — YC deploys run on demand, not on every push.
# Auth: SHRUTI_YC_SA_KEY_JSON (Service-Account authorized JSON key)
# is exchanged for a short-lived IAM token via yc-actions/yc-iam-token.
# The deployed function runs under SHRUTI_YC_SERVICE_ACCOUNT_ID.
# AWS_RUNTIME_* are a dedicated AWS IAM user (s3 rw on shruti-engine
# only) used by boto3 inside the YC function — YC service accounts can't
# sign AWS S3 requests.

on:
  workflow_dispatch:

concurrency:
  group: share-audio-yc-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: modules/services/share-audio

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch ffmpeg static binary
        run: |
          mkdir -p layers/ffmpeg/bin
          curl -sSL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz \
            | tar -xJ --strip-components=1 -C layers/ffmpeg/bin --wildcards '*/ffmpeg'
          chmod +x layers/ffmpeg/bin/ffmpeg
      - run: npm ci
      - name: Exchange SA key for short-lived IAM token
        id: yc-iam
        uses: yc-actions/yc-iam-token@v1
        with:
          yc-sa-json-credentials: ${{ secrets.SHRUTI_YC_SA_KEY_JSON }}
      - name: Deploy to Yandex Cloud
        run: npx serverless deploy --config serverless-yc.yml
        env:
          # Plugin picks YC_IAM_TOKEN / YC_CLOUD_ID / YC_FOLDER_ID from env;
          # no ~/.config/yandex-cloud/config.yaml needed.
          YC_IAM_TOKEN: ${{ steps.yc-iam.outputs.token }}
          YC_CLOUD_ID: b1gjad74ff5i9opem2aj
          YC_FOLDER_ID: ${{ vars.SHRUTI_YC_FOLDER_ID }}
          # YC S3-compatible static keys used by the plugin's AWS SDK to
          # upload the >3.5MB package to YC Object Storage.
          AWS_ACCESS_KEY_ID: ${{ secrets.SHRUTI_YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SHRUTI_YC_SECRET_ACCESS_KEY }}
          YC_SERVICE_ACCOUNT_ID: ${{ secrets.SHRUTI_YC_SERVICE_ACCOUNT_ID }}
          # Real AWS S3 creds — projected into the FUNCTION env via
          # serverless-yc.yml so boto3 in the YC runtime can hit
          # shruti-engine on AWS.
          AWS_RUNTIME_ACCESS_KEY_ID: ${{ secrets.SHRUTI_AWS_RUNTIME_ACCESS_KEY_ID }}
          AWS_RUNTIME_SECRET_ACCESS_KEY: ${{ secrets.SHRUTI_AWS_RUNTIME_SECRET_ACCESS_KEY }}
          AWS_RUNTIME_REGION: ${{ vars.SHRUTI_AWS_RUNTIME_REGION }}
