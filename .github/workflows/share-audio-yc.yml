name: Services / Share-Audio / Yandex Cloud

# Manual dispatch only — YC deploys run on demand, not on every push.
# Auth: LECTORIUM_YC_OAUTH_TOKEN deploys; LECTORIUM_YC_SERVICE_ACCOUNT_ID
# is what the function executes under. AWS_RUNTIME_* are a dedicated AWS
# IAM user (s3 rw on akds-lectorium only) used by boto3 inside the YC
# function — YC service accounts can't sign AWS S3 requests.

on:
  workflow_dispatch:

concurrency:
  group: share-audio-yc-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: modules/services/share-audio

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch ffmpeg static binary
        run: |
          mkdir -p layers/ffmpeg/bin
          curl -sSL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz \
            | tar -xJ --strip-components=1 -C layers/ffmpeg/bin --wildcards '*/ffmpeg'
          chmod +x layers/ffmpeg/bin/ffmpeg
      - run: npm ci
      - name: Write yc config (plugin reads ~/.config/yandex-cloud/config.yaml)
        env:
          YC_OAUTH_TOKEN: ${{ secrets.LECTORIUM_YC_OAUTH_TOKEN }}
          YC_FOLDER_ID: ${{ vars.LECTORIUM_YC_FOLDER_ID }}
        run: |
          mkdir -p ~/.config/yandex-cloud
          cat > ~/.config/yandex-cloud/config.yaml <<EOF
          current: default
          profiles:
            default:
              token: ${YC_OAUTH_TOKEN}
              cloud-id: b1gjad74ff5i9opem2aj
              folder-id: ${YC_FOLDER_ID}
          EOF
      - name: Deploy to Yandex Cloud
        run: npx serverless deploy --config serverless-yc.yml
        env:
          # YC S3-compatible keys used by the plugin's AWS SDK to upload
          # the >3.5MB package to YC Object Storage.
          AWS_ACCESS_KEY_ID: ${{ secrets.LECTORIUM_YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.LECTORIUM_YC_SECRET_ACCESS_KEY }}
          YC_SERVICE_ACCOUNT_ID: ${{ secrets.LECTORIUM_YC_SERVICE_ACCOUNT_ID }}
          # Real AWS S3 creds — projected into the FUNCTION env via
          # serverless-yc.yml so boto3 in the YC runtime can hit
          # akds-lectorium on AWS.
          AWS_RUNTIME_ACCESS_KEY_ID: ${{ secrets.LECTORIUM_AWS_RUNTIME_ACCESS_KEY_ID }}
          AWS_RUNTIME_SECRET_ACCESS_KEY: ${{ secrets.LECTORIUM_AWS_RUNTIME_SECRET_ACCESS_KEY }}
          AWS_RUNTIME_REGION: ${{ vars.LECTORIUM_AWS_RUNTIME_REGION }}
