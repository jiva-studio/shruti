name: Services / build images

# Build container images for the self-hosted stack and push them to
# ghcr.io. Production VPS pulls them via Watchtower (label opt-in) on
# every push to main.
#
# Triggers:
#   - push to main with paths under modules/services/<svc>/ or
#     infra/compose/caddy/ → tags :latest + :main-<sha>
#   - workflow_dispatch on any branch → tag :branch-<ref> (slashes in
#     branch names are sanitized by docker/metadata-action)
#
# Visibility: packages are public after first push (operator changes
# in Settings → Packages → Change visibility). Public = Watchtower
# doesn't need credentials in ~/.docker/config.json.

on:
  push:
    branches: [main]
    paths:
      - 'modules/services/auth/**'
      - 'modules/services/chat/**'
      - 'modules/services/share-audio/**'
      - 'modules/services/share-video/**'
      - 'modules/docs/help/**'              # chat COPYs the help corpus
      - 'modules/.dockerignore'             # affects every service build
      - 'infra/compose/caddy/Dockerfile'    # custom Caddy with caddy-ratelimit
      - 'infra/db/migrations/**'            # migrator image is upstream, but
                                            # rebuilding services on schema
                                            # changes catches assertion drift early
      - '.github/workflows/services-ghcr.yml'
  workflow_dispatch:
    inputs:
      services:
        description: 'Which images to build'
        type: choice
        options: [all, auth, chat, share-audio, share-video, caddy]
        default: all

concurrency:
  group: services-ghcr-${{ github.ref }}
  # PR-style cancellation makes sense for dispatch (re-trigger replaces);
  # push to main always runs to completion so :latest doesn't lag.
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

permissions:
  contents: read
  packages: write           # push to ghcr.io/<org>/lectorium-<svc>

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `include:` lets each entry have its own build context + Dockerfile
        # path. App images all build from ./modules; caddy builds from its
        # own dir under infra/.
        include:
          - service: auth
            context: ./modules
            dockerfile: ./modules/services/auth/Dockerfile
          - service: chat
            context: ./modules
            dockerfile: ./modules/services/chat/Dockerfile
          - service: share-audio
            context: ./modules
            dockerfile: ./modules/services/share-audio/Dockerfile
          - service: share-video
            context: ./modules
            dockerfile: ./modules/services/share-video/Dockerfile
          - service: caddy
            context: ./infra/compose/caddy
            dockerfile: ./infra/compose/caddy/Dockerfile
    steps:
      - uses: actions/checkout@v5

      # workflow_dispatch input filter: skip services not chosen.
      - name: Filter by chosen service
        if: github.event_name == 'workflow_dispatch'
        run: |
          chosen='${{ github.event.inputs.services }}'
          if [ "$chosen" != "all" ] && [ "$chosen" != "${{ matrix.service }}" ]; then
            echo "::notice::Skipping ${{ matrix.service }} (dispatch chose $chosen)"
            echo "SKIP=true" >> "$GITHUB_ENV"
          fi

      - uses: docker/setup-buildx-action@v3
        if: env.SKIP != 'true'

      - uses: docker/login-action@v3
        if: env.SKIP != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        if: env.SKIP != 'true'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/lectorium-${{ matrix.service }}
          # Adds `org.opencontainers.image.source` automatically — that
          # label links the ghcr package to this repo so it shows up in
          # the repo's Packages tab and inherits repo permissions.
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=raw,value=main-${{ github.sha }},enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=ref,event=branch,enable=${{ github.event_name == 'workflow_dispatch' }},prefix=branch-

      - name: Build image (load locally for Trivy scan)
        if: env.SKIP != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          # Build but don't push yet — we want Trivy to gate the push.
          load: true
          tags: lectorium-${{ matrix.service }}:scan
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      # Fail the build on HIGH or CRITICAL vulnerabilities before any
      # pushable tag lands in ghcr.io. Trivy DB ships with the action.
      - name: Trivy vulnerability scan
        if: env.SKIP != 'true'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: lectorium-${{ matrix.service }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Push image
        if: env.SKIP != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Re-use cache from the scan build — second build is ~5s.
          cache-from: type=gha,scope=${{ matrix.service }}
