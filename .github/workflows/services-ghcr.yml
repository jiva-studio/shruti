name: Services / build images

# Build container images for the self-hosted stack and push them to
# ghcr.io. Production VPS pulls them via Watchtower (label opt-in) on
# every push to main.
#
# Triggers:
#   - push to main → build only the services whose own subtree (or a
#     shared trigger path) actually changed in this push. The matrix
#     is computed dynamically from `dorny/paths-filter` so a touch on
#     e.g. modules/services/share-audio/ does NOT rebuild auth + chat
#     + caddy alongside it.
#   - workflow_dispatch on any branch → user picks which images to
#     build (input `services`); tags `branch-<ref>`.
#
# Visibility: packages are public after first push (operator changes
# in Settings → Packages → Change visibility). Public = Watchtower
# doesn't need credentials in ~/.docker/config.json.

on:
  push:
    branches: [main]
    paths:
      - 'modules/services/auth/**'
      - 'modules/services/billing/**'
      - 'modules/services/chat/**'
      - 'modules/services/cleanup-worker/**'
      - 'modules/services/share-audio/**'
      - 'modules/services/share-video/**'
      - 'modules/services/share-transcript/**'
      - 'modules/services/storage-sync/**'
      - 'modules/services/shruti-corpus-mcp/**'
      - 'modules/docs/help/**'              # chat COPYs the help corpus
      - 'modules/.dockerignore'             # affects every service build
      - 'infra/app/compose/caddy/**'            # shared Caddy image (used by app + obs)
      - 'infra/app/db/migrations/**'            # services assert schema at boot
      - '.github/workflows/services-ghcr.yml'
  workflow_dispatch:
    inputs:
      services:
        description: 'Which images to build'
        type: choice
        options: [all, auth, billing, chat, cleanup-worker, share-audio, share-video, share-transcript, storage-sync, corpus-mcp, caddy, migrator]
        default: all

concurrency:
  group: services-ghcr-${{ github.ref }}
  # PR-style cancellation makes sense for dispatch (re-trigger replaces);
  # push to main always runs to completion so :latest doesn't lag.
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

permissions:
  contents: read
  packages: write           # push to ghcr.io/<org>/shruti-<svc>

jobs:
  # ------------------------------------------------------------------
  # detect: figure out which services need rebuilding for THIS event.
  # ------------------------------------------------------------------
  detect:
    name: detect changed services
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      build_any: ${{ steps.matrix.outputs.build_any }}
    steps:
      - uses: actions/checkout@v5

      # Per-service filter. dorny/paths-filter does the git diff against
      # the push's `before` SHA, so it sees exactly what landed in the
      # commits being processed — no cross-PR or branch-life confusion.
      # On workflow_dispatch this step still runs but its output is
      # ignored by the matrix below (dispatch uses the input instead).
      - id: filter
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            auth:
              - 'modules/services/auth/**'
              - 'modules/.dockerignore'
              - 'infra/app/db/migrations/**'
              - '.github/workflows/services-ghcr.yml'
            billing:
              - 'modules/services/billing/**'
              - 'modules/.dockerignore'
              - 'infra/app/db/migrations/**'
              - '.github/workflows/services-ghcr.yml'
            chat:
              - 'modules/services/chat/**'
              - 'modules/docs/help/**'
              - 'modules/.dockerignore'
              - 'infra/app/db/migrations/**'
              - '.github/workflows/services-ghcr.yml'
            cleanup-worker:
              - 'modules/services/cleanup-worker/**'
              - 'modules/.dockerignore'
              - 'infra/app/db/migrations/**'
              - '.github/workflows/services-ghcr.yml'
            share-audio:
              - 'modules/services/share-audio/**'
              - 'modules/.dockerignore'
              - '.github/workflows/services-ghcr.yml'
            share-video:
              - 'modules/services/share-video/**'
              - 'modules/.dockerignore'
              - 'infra/app/db/migrations/**'
              - '.github/workflows/services-ghcr.yml'
            share-transcript:
              - 'modules/services/share-transcript/**'
              - 'modules/.dockerignore'
              - '.github/workflows/services-ghcr.yml'
            storage-sync:
              - 'modules/services/storage-sync/**'
              - 'modules/.dockerignore'
              - '.github/workflows/services-ghcr.yml'
            corpus-mcp:
              - 'modules/services/shruti-corpus-mcp/**'
              - 'modules/.dockerignore'
              - '.github/workflows/services-ghcr.yml'
            caddy:
              - 'infra/app/compose/caddy/**'
              - '.github/workflows/services-ghcr.yml'
            migrator:
              - 'infra/app/db/**'
              - '.github/workflows/services-ghcr.yml'

      # Compose the matrix: for each service the build job knows about,
      # emit its full entry (context + dockerfile) iff this event wants
      # it built. Pushed as a JSON array via $GITHUB_OUTPUT.
      - id: matrix
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_CHOICE: ${{ github.event.inputs.services }}
          F_AUTH: ${{ steps.filter.outputs.auth }}
          F_BILLING: ${{ steps.filter.outputs.billing }}
          F_CHAT: ${{ steps.filter.outputs.chat }}
          F_CLEANUP_WORKER: ${{ steps.filter.outputs.cleanup-worker }}
          F_SHARE_AUDIO: ${{ steps.filter.outputs.share-audio }}
          F_SHARE_VIDEO: ${{ steps.filter.outputs.share-video }}
          F_SHARE_TRANSCRIPT: ${{ steps.filter.outputs.share-transcript }}
          F_STORAGE_SYNC: ${{ steps.filter.outputs.storage-sync }}
          F_CORPUS_MCP: ${{ steps.filter.outputs.corpus-mcp }}
          F_CADDY: ${{ steps.filter.outputs.caddy }}
          F_MIGRATOR: ${{ steps.filter.outputs.migrator }}
        run: |
          # Service catalogue. Keep in sync with the dorny filters above.
          declare -A CTX=(
            [auth]=./modules
            [billing]=./modules
            [chat]=./modules
            [cleanup-worker]=./modules
            [share-audio]=./modules
            [share-video]=./modules
            [share-transcript]=./modules
            [storage-sync]=./modules
            [corpus-mcp]=./modules
            [caddy]=./infra/app/compose/caddy
            [migrator]=./infra/app/db
          )
          declare -A DOCKERFILE=(
            [auth]=./modules/services/auth/Dockerfile
            [billing]=./modules/services/billing/Dockerfile
            [chat]=./modules/services/chat/Dockerfile
            [cleanup-worker]=./modules/services/cleanup-worker/Dockerfile
            [share-audio]=./modules/services/share-audio/Dockerfile
            [share-video]=./modules/services/share-video/Dockerfile
            [share-transcript]=./modules/services/share-transcript/Dockerfile
            [storage-sync]=./modules/services/storage-sync/Dockerfile
            [corpus-mcp]=./modules/services/shruti-corpus-mcp/Dockerfile
            [caddy]=./infra/app/compose/caddy/Dockerfile
            [migrator]=./infra/app/db/Dockerfile
          )

          wants() {
            local svc="$1"
            case "$EVENT" in
              workflow_dispatch)
                [ "$DISPATCH_CHOICE" = "all" ] || [ "$DISPATCH_CHOICE" = "$svc" ]
                ;;
              push)
                local var
                # bash doesn't allow `-` in variable names — translate.
                var="F_$(echo "$svc" | tr 'a-z-' 'A-Z_')"
                [ "${!var}" = "true" ]
                ;;
              *)
                return 1
                ;;
            esac
          }

          entries=()
          for svc in auth billing chat cleanup-worker share-audio share-video share-transcript storage-sync corpus-mcp caddy migrator; do
            if wants "$svc"; then
              entries+=("$(jq -nc --arg s "$svc" --arg c "${CTX[$svc]}" --arg d "${DOCKERFILE[$svc]}" \
                '{service:$s, context:$c, dockerfile:$d}')")
            fi
          done

          if [ "${#entries[@]}" -eq 0 ]; then
            echo "build_any=false" >> "$GITHUB_OUTPUT"
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            echo "::notice::No services need rebuilding for this event"
          else
            printf -v joined '%s,' "${entries[@]}"
            echo "build_any=true" >> "$GITHUB_OUTPUT"
            echo "matrix=[${joined%,}]" >> "$GITHUB_OUTPUT"
            echo "::notice::Will build: $(printf '%s ' "${entries[@]}" | jq -rs 'map(.service) | join(", ")')"
          fi

  # ------------------------------------------------------------------
  # build: per-service image. Matrix is the JSON array from `detect`,
  # so the job only spawns for services that actually changed.
  # ------------------------------------------------------------------
  build:
    needs: detect
    if: needs.detect.outputs.build_any == 'true'
    name: build / ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build stamps baked into every image so /healthz can show which
      # commit a running container was built from. Operator hits the
      # endpoint after a push to confirm Watchtower rolled the new image.
      - id: buildstamp
        run: |
          echo "sha=${GITHUB_SHA::10}" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/shruti-${{ matrix.service }}
          # Adds `org.opencontainers.image.source` automatically — that
          # label links the ghcr package to this repo so it shows up in
          # the repo's Packages tab and inherits repo permissions.
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=raw,value=main-${{ github.sha }},enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=ref,event=branch,enable=${{ github.event_name == 'workflow_dispatch' }},prefix=branch-

      - name: Build image (load locally for Trivy scan)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          # Build but don't push yet — we want Trivy to gate the push.
          load: true
          tags: shruti-${{ matrix.service }}:scan
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
          build-args: |
            SHRUTI_BUILD_SHA=${{ steps.buildstamp.outputs.sha }}
            SHRUTI_BUILD_TIME=${{ steps.buildstamp.outputs.time }}

      # Scan for HIGH / CRITICAL CVEs and post the findings to the run
      # log. INFORMATIONAL — step is `continue-on-error: true`, so a
      # failure shows red in the UI but the push still proceeds. We
      # accept the current backlog of transitive-dep CVEs (starlette
      # via fastapi, grpc + otel via pgx, cross-spawn/glob/etc. via
      # node tooling) and address them as their own follow-ups.
      #
      # Flip back to a hard gate (`exit-code: '1'` + remove
      # continue-on-error) once the dep tree is clean — Trivy itself
      # already runs at every push so the report stays current.
      - name: Trivy vulnerability scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: shruti-${{ matrix.service }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Re-use cache from the scan build — second build is ~5s.
          cache-from: type=gha,scope=${{ matrix.service }}
          build-args: |
            SHRUTI_BUILD_SHA=${{ steps.buildstamp.outputs.sha }}
            SHRUTI_BUILD_TIME=${{ steps.buildstamp.outputs.time }}
