name: Go Test

# go vet and go test -race for every Go module under modules/, and a deadcode
# check against modules/.deadcode-allowlist.
#
# One job looping over the modules, like Go Lint: the work per module takes
# seconds and a matrix would pay for a checkout and a toolchain install each.
# The loop names each module in its own log group and lists every failing
# module at the end.
#
# Tests that need a database read its URL from the environment; in CI they fail
# without it. This job starts the production Postgres images, read from the app
# compose file: discovery's own on port 5433, the shared one on 5432 for every
# other module. Each module gets a database of its own.

on:
  pull_request:
    paths:
      - 'modules/**/*.go'
      - 'modules/**/*.sql'
      - 'modules/**/testdata/**'
      - 'modules/services/discovery/**'
      - 'infra/app/db/migrations/**'
      - 'modules/**/go.mod'
      - 'modules/**/go.sum'
      - 'modules/.deadcode-allowlist'
      - 'modules/scripts/deadcode-check.sh'
      - 'modules/.tool-versions'
      - 'scripts/go-newest-version.sh'
      - '.github/workflows/modules-go-test.yml'
      - 'infra/app/compose/docker-compose.yml'
  push:
    branches: [main]
    paths:
      - 'modules/**/*.go'
      - 'modules/**/*.sql'
      - 'modules/**/testdata/**'
      - 'modules/services/discovery/**'
      - 'infra/app/db/migrations/**'
      - 'modules/**/go.mod'
      - 'modules/**/go.sum'
      - 'modules/.deadcode-allowlist'
      - 'modules/scripts/deadcode-check.sh'
      - 'modules/.tool-versions'
      - 'scripts/go-newest-version.sh'
      - '.github/workflows/modules-go-test.yml'
      - 'infra/app/compose/docker-compose.yml'

concurrency:
  group: modules-go-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  postgres-image:
    name: postgres image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.read.outputs.postgres }}
      discovery-image: ${{ steps.read.outputs.discovery-postgres }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: infra/app/compose

      - name: read the app's Postgres images
        id: read
        run: |
          for svc in postgres discovery-postgres; do
            image="$(yq -r ".services[\"$svc\"].image" infra/app/compose/docker-compose.yml)"
            if [ -z "$image" ] || [ "$image" = null ]; then
              echo "::error::no services.$svc.image in infra/app/compose/docker-compose.yml"
              exit 1
            fi
            echo "$svc=$image" >> "$GITHUB_OUTPUT"
          done

  test:
    name: go vet + go test
    needs: postgres-image
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ${{ needs.postgres-image.outputs.image }}
        env:
          POSTGRES_USER: shruti
          POSTGRES_PASSWORD: shruti
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shruti"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      discovery-postgres:
        image: ${{ needs.postgres-image.outputs.discovery-image }}
        env:
          POSTGRES_USER: shruti
          POSTGRES_PASSWORD: shruti
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U shruti"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5

      - name: newest Go version the modules ask for
        id: go
        run: echo "version=$(scripts/go-newest-version.sh)" >> "$GITHUB_OUTPUT"

      # Every module builds under the newest go directive among them.
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache-dependency-path: modules/**/go.sum

      - name: vet and test every module
        env:
          # -race needs cgo, and the SQLite driver is cgo too.
          CGO_ENABLED: '1'
          PG: postgresql://shruti:shruti@localhost:5432
          DISCOVERY_PG: postgresql://shruti:shruti@localhost:5433
        run: |
          set -uo pipefail
          failed=()
          while IFS= read -r mod; do
            dir="$(dirname "$mod")"
            db="test_$(basename "$dir" | tr - _)"
            pg="$PG"
            [ "$dir" = modules/services/discovery ] && pg="$DISCOVERY_PG"
            psql "$pg/postgres" -qc "CREATE DATABASE $db"
            url="$pg/$db?sslmode=disable"
            echo "::group::$dir"
            if ! (cd "$dir" && go vet ./... && \
                TEST_DATABASE_URL="$url" \
                SHRUTI_PUBLISH_TEST_DATABASE_URL="$url" \
                SHRUTI_DISCOVERY_TEST_DATABASE_URL="$url" \
                go test -race -count=1 -p 1 -timeout 5m ./...); then
              failed+=("$dir")
            fi
            echo "::endgroup::"
          done < <(find modules -name go.mod -not -path '*/node_modules/*' | sort)

          if [ ${#failed[@]} -ne 0 ]; then
            echo "::error::go vet / go test failed in: ${failed[*]}"
            exit 1
          fi
          echo "all modules pass"

  deadcode:
    name: deadcode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: newest Go version the modules ask for
        id: go
        run: echo "version=$(scripts/go-newest-version.sh)" >> "$GITHUB_OUTPUT"

      # Every module builds under the newest go directive among them.
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache-dependency-path: modules/**/go.sum

      - name: install deadcode
        run: |
          go install "golang.org/x/tools/cmd/deadcode@v$(awk '$1=="deadcode"{print $2}' modules/.tool-versions)"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: unreachable functions match the allowlist
        run: modules/scripts/deadcode-check.sh
