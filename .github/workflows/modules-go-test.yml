name: Go Test

# go vet and go test -race for every Go module under modules/, and a deadcode
# check against modules/.deadcode-allowlist.
#
# One job looping over the modules, like Go Lint: the work per module takes
# seconds and a matrix would pay for a checkout and a toolchain install each.
# The loop names each module in its own log group and lists every failing
# module at the end.
#
# Tests that need a database read its URL from the environment and skip
# without it. This job starts the production Postgres image, read from the app
# compose file, and hands its URL to the publish-service suite; the discovery
# suite runs against Postgres in its own workflow.

on:
  pull_request:
    paths:
      - 'modules/**/*.go'
      - 'modules/**/go.mod'
      - 'modules/**/go.sum'
      - 'modules/.deadcode-allowlist'
      - 'modules/scripts/deadcode-check.sh'
      - '.github/workflows/modules-go-test.yml'
      - 'infra/app/compose/docker-compose.yml'
  push:
    branches: [main]
    paths:
      - 'modules/**/*.go'
      - 'modules/**/go.mod'
      - 'modules/**/go.sum'
      - 'modules/.deadcode-allowlist'
      - 'modules/scripts/deadcode-check.sh'
      - '.github/workflows/modules-go-test.yml'
      - 'infra/app/compose/docker-compose.yml'

concurrency:
  group: modules-go-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  postgres-image:
    name: postgres image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.read.outputs.image }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: infra/app/compose

      - name: read the app's Postgres image
        id: read
        run: |
          image="$(yq -r '.services.postgres.image' infra/app/compose/docker-compose.yml)"
          if [ -z "$image" ] || [ "$image" = null ]; then
            echo "::error::no services.postgres.image in infra/app/compose/docker-compose.yml"
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

  test:
    name: go vet + go test
    needs: postgres-image
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ${{ needs.postgres-image.outputs.image }}
        env:
          POSTGRES_USER: shruti
          POSTGRES_PASSWORD: shruti
          POSTGRES_DB: publish
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shruti"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5

      # The newest go directive among the modules; older ones run under it.
      - uses: actions/setup-go@v5
        with:
          go-version-file: modules/services/discovery/go.mod
          cache-dependency-path: modules/**/go.sum

      - name: vet and test every module
        env:
          # -race needs cgo, and the SQLite driver is cgo too.
          CGO_ENABLED: '1'
          SHRUTI_PUBLISH_TEST_DATABASE_URL: postgresql://shruti:shruti@localhost:5432/publish?sslmode=disable
        run: |
          set -uo pipefail
          failed=()
          while IFS= read -r mod; do
            dir="$(dirname "$mod")"
            echo "::group::$dir"
            if ! (cd "$dir" && go vet ./... && go test -race -count=1 ./...); then
              failed+=("$dir")
            fi
            echo "::endgroup::"
          done < <(find modules -name go.mod -not -path '*/node_modules/*' | sort)

          if [ ${#failed[@]} -ne 0 ]; then
            echo "::error::go vet / go test failed in: ${failed[*]}"
            exit 1
          fi
          echo "all modules pass"

  deadcode:
    name: deadcode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: modules/services/discovery/go.mod
          cache-dependency-path: modules/**/go.sum

      - name: install deadcode
        run: |
          go install "golang.org/x/tools/cmd/deadcode@v$(awk '$1=="deadcode"{print $2}' modules/.tool-versions)"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: unreachable functions match the allowlist
        run: modules/scripts/deadcode-check.sh
