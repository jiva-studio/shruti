name: PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  lint-pr-title:
    name: validate
    runs-on: [self-hosted, macos, mac-host]
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Match the types enabled in release-please config.
          types: |
            feat
            fix
            perf
            refactor
            revert
            docs
            style
            chore
            test
            ci
            build
          # Scope is optional but should be kebab-case when present (can include
          # colons for hierarchical scopes like mobile:welcome, content-manager:audio).
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject of the PR title must start with a lowercase letter.
