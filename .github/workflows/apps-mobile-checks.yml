name: Mobile / Checks

# `npm run lint` and the unit suite, neither of which ran anywhere. The build
# workflow covers `vue-tsc` on its way to a bundle, so the gap was the linter —
# which is where the craft rules live — and 4600 tests that were only ever run
# by hand.
#
# `npm run lint` and not `eslint .`: the shared libraries are symlinks, and
# `eslint .` does not follow them. That is how two of them went unlinted for
# months while the command reported clean.

on:
  pull_request:
    paths:
      - 'modules/apps/mobile/**'
      - 'modules/libs/**'
      - 'modules/plugins/**'
      - '.github/workflows/apps-mobile-checks.yml'
  push:
    branches: [main]
    paths:
      - 'modules/apps/mobile/**'
      - 'modules/libs/**'
      - 'modules/plugins/**'
      - '.github/workflows/apps-mobile-checks.yml'

concurrency:
  group: apps-mobile-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.KIT_DEPLOY_KEY }}
      - uses: actions/checkout@v5
      # The app compiles kit from source through the `@kit` alias, so the
      # suite does not run without it.
      - name: fetch kit submodule (ssh)
        run: git -c core.sshCommand="ssh -o StrictHostKeyChecking=accept-new" submodule update --init --recursive

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: modules/apps/mobile/package-lock.json

      # `vitest.config.ts` resolves both in-house plugins to their built ESM
      # entry, not their package directory, so an unbuilt plugin is a failed
      # import rather than a skipped test.
      - uses: ./.github/actions/build-audio-player
      - uses: ./.github/actions/build-media-downloader

      - run: cd modules/apps/mobile && npm ci --prefer-offline --no-audit

      - name: lint
        run: cd modules/apps/mobile && npm run lint

      - name: unit tests
        run: cd modules/apps/mobile && npm run test
