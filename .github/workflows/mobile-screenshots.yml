name: Mobile / Store listing

# Manual-only: capture store screenshots from the Vite dev server via the
# Playwright pipeline in `modules/tools/screenshots/`. With `deploy=true` it
# updates the chosen store(s) end to end — uploading both the framed
# screenshots and the listing copy (titles/descriptions) from
# fastlane/metadata/, for every locale in the registry. The upload is gated:
# it stages an edit but never submits for review; you confirm in the console.
#
# Locales come from the store registry (modules/apps/mobile/store-locales.json):
# leave `locales` empty to run every configured locale.
#
# Triggered from the Actions tab → "mobile / screenshots" → "Run workflow".
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Store'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - android
          - ios
      locales:
        description: 'Locales (empty = all)'
        required: false
        default: ''
        type: string
      deploy:
        description: 'Upload to store (off = build only)'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Validate only'
        required: false
        default: false
        type: boolean

concurrency:
  group: mobile-screenshots-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Expand the `platform` choice input into a JSON list the matrix can consume.
  # `matrix` isn't available in job-level `if:`, so we filter at matrix-build
  # time instead of per-job. Runs on ubuntu-latest — cheap and only emits JSON.
  prepare:
    name: prepare matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          case "${{ inputs.platform }}" in
            android) echo 'matrix=["android"]' >> "$GITHUB_OUTPUT" ;;
            ios)     echo 'matrix=["ios"]'     >> "$GITHUB_OUTPUT" ;;
            *)       echo 'matrix=["android","ios"]' >> "$GITHUB_OUTPUT" ;;
          esac

  screenshots:
    name: capture + upload (${{ matrix.platform }})
    needs: prepare
    runs-on: macos-latest
    strategy:
      # Serialize matrix entries — both jobs use the Playwright `webServer`
      # config's fixed port (11099), so running them in parallel triggers
      #   "Error: http://localhost:11099 is already used".
      max-parallel: 1
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      # The `kit` submodule carries db-sync.sh and the vite aliases the dev
      # server needs, and it's a private repo — fetch it over SSH exactly like
      # apps-mobile.yml does. Without this the "sync content DB" step (and later
      # the capture's vite.config) fail with a missing modules/kit/* file.
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.KIT_DEPLOY_KEY }}
      - uses: actions/checkout@v5
      - name: fetch kit submodule (ssh)
        run: git -c core.sshCommand="ssh -o StrictHostKeyChecking=accept-new" submodule update --init --recursive

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: modules/apps/mobile/package-lock.json

      # The mobile app's package.json depends on two in-house Capacitor
      # plugins via `file:` paths. Their dist/ is gitignored, so vite's
      # pre-transform fails with `Failed to resolve import
      # "@shruti/plugin-{audio-player,media-downloader}"` unless each
      # plugin is built first. Same actions every other mobile CI job
      # calls before `npm ci`.
      - uses: ./.github/actions/build-audio-player
      - uses: ./.github/actions/build-media-downloader

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: modules/apps/mobile

      - name: bundle install
        run: cd modules/apps/mobile && bundle install --jobs 4 --retry 3

      - name: install mobile app deps
        run: cd modules/apps/mobile && npm ci --prefer-offline --no-audit

      - name: install screenshots tool deps
        run: cd modules/tools/screenshots && npm install --no-audit --no-fund

      - name: install playwright chromium
        run: cd modules/tools/screenshots && npx playwright install chromium

      # Pull the latest published content DB matching the supported scheme.
      # `db-sync.sh e2e` writes it to modules/tests/e2e/fixtures/public/db/,
      # which the screenshots tool consumes from fixtures/content.db.
      - name: sync content DB from S3
        run: bash modules/db-sync.sh e2e

      - name: stage content.db for screenshots tool
        run: |
          set -euo pipefail
          src=$(ls -t modules/tests/e2e/fixtures/public/db/shruti.*.db | head -1)
          mkdir -p modules/tools/screenshots/fixtures
          cp "$src" modules/tools/screenshots/fixtures/content.db
          echo "Staged $src → modules/tools/screenshots/fixtures/content.db"

      - name: run fastlane ${{ matrix.platform }} screenshots
        env:
          # Android: org-level service-account JSON at jiva-studio/.
          # Same key the `deploy-android` lane uses to upload AABs.
          GOOGLE_PLAY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
          # iOS: App Store Connect API key (issuer, key id, base64-encoded
          # .p8). Same secrets the `deploy-ios` lane uses.
          APPLE_STORE_CONNECT_API_KEY: ${{ secrets.APPLE_STORE_CONNECT_API_KEY }}
          APPLE_STORE_CONNECT_API_KEY_ID: ${{ secrets.APPLE_STORE_CONNECT_API_KEY_ID }}
          APPLE_STORE_CONNECT_API_KEY_ISSUER: ${{ secrets.APPLE_STORE_CONNECT_API_KEY_ISSUER }}
          # Force Playwright's bundled chromium — on this runner the system
          # chrome is sometimes missing dependencies after macOS updates.
          CHROME_PATH: ''
        # Fastlane parses `key:value` CLI args as strings; even
        # `skip_upload:false` lands as a non-nil (truthy) string in
        # `options[:skip_upload]`. So we have to OMIT the flag instead
        # of passing it as false. Same trick for `dry_run`.
        run: |
          set -euo pipefail
          ARGS=""
          # Empty `locales` → omit the flag → the lane falls back to every
          # registry locale (capture_locales).
          if [ -n "${{ inputs.locales }}" ]; then ARGS="locales:${{ inputs.locales }}"; fi
          if [ "${{ inputs.deploy }}" != "true" ]; then ARGS="$ARGS skip_upload:true"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS dry_run:true"; fi
          cd modules/apps/mobile && bundle exec fastlane ${{ matrix.platform }} screenshots $ARGS

      # Same deploy run also pushes the listing copy (titles/descriptions) so a
      # single "deploy" updates everything. Gated lane — stages, never submits.
      - name: run fastlane ${{ matrix.platform }} metadata
        if: ${{ inputs.deploy }}
        env:
          GOOGLE_PLAY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
          APPLE_STORE_CONNECT_API_KEY: ${{ secrets.APPLE_STORE_CONNECT_API_KEY }}
          APPLE_STORE_CONNECT_API_KEY_ID: ${{ secrets.APPLE_STORE_CONNECT_API_KEY_ID }}
          APPLE_STORE_CONNECT_API_KEY_ISSUER: ${{ secrets.APPLE_STORE_CONNECT_API_KEY_ISSUER }}
        run: |
          set -euo pipefail
          ARGS=""
          # Only the android metadata lane takes dry_run (supply validate-only).
          if [ "${{ inputs.dry_run }}" = "true" ] && [ "${{ matrix.platform }}" = "android" ]; then ARGS="dry_run:true"; fi
          cd modules/apps/mobile && bundle exec fastlane ${{ matrix.platform }} metadata $ARGS

      - name: upload framed PNGs as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: store-screenshots-${{ matrix.platform }}
          path: modules/tools/screenshots/out/framed/
          retention-days: 14
