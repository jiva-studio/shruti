name: Mobile / Build

on:
  push:
    branches: [main]
    paths:
      - modules/apps/mobile/**
      - modules/plugins/**
      - modules/libs/**
      - modules/tests/e2e/**
      - modules/db-scheme.json
      - modules/db-sync.sh
      - .github/workflows/apps-mobile.yml
      - .github/actions/build-audio-player/**
      - .github/actions/build-media-downloader/**
      - .gitmodules
      - modules/kit/**
  pull_request:
    branches: [main]
    paths:
      - modules/apps/mobile/**
      - modules/plugins/**
      - modules/libs/**
      - modules/tests/e2e/**
      - modules/db-scheme.json
      - modules/db-sync.sh
      - .github/workflows/apps-mobile.yml
      - .github/actions/build-audio-player/**
      - .github/actions/build-media-downloader/**
      - .gitmodules
      - modules/kit/**
  workflow_dispatch:

concurrency:
  group: apps-mobile-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # build-web stays app-local: it bakes app-specific compile-time config into
  # the bundle (RevenueCat keys via fixed Vite env names) and builds the
  # in-house Capacitor plugins. It uploads the mobile-web-dist artifact the
  # reusable ci workflow's e2e/deploy jobs consume.
  build-web:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.KIT_DEPLOY_KEY }}
      - uses: actions/checkout@v5
      - name: fetch kit submodule (ssh)
        run: git -c core.sshCommand="ssh -o StrictHostKeyChecking=accept-new" submodule update --init --recursive
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: modules/apps/mobile/package-lock.json
      - uses: ./.github/actions/build-audio-player
      - uses: ./.github/actions/build-media-downloader
      - run: cd modules/apps/mobile && npm ci --prefer-offline --no-audit
      - name: build web bundle
        # Vite reads BUILD_ID via process.env and inlines it as __BUILD_ID__
        # (shown in Settings → About). Version comes from package.json.
        # RevenueCat SDK keys (public, platform-scoped) are baked into the
        # bundle as compile-time defines; absent keys → IAP UI hides itself.
        env:
          BUILD_ID: ${{ github.run_number }}
          # Vite reads these generic names (same as kit's native-binary build).
          REVENUECAT_IOS_KEY: ${{ secrets.SHRUTI_APPLE_REVENUE_CAT_KEY }}
          REVENUECAT_ANDROID_KEY: ${{ secrets.SHRUTI_GOOGLE_REVENUE_CAT_KEY }}
        run: cd modules/apps/mobile && npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: mobile-web-dist
          path: modules/apps/mobile/dist
          retention-days: 3

  # Shared web CI: lint, unit test, e2e, Cloudflare Pages preview + production.
  # Runs after build-web so its e2e/deploy jobs find the mobile-web-dist
  # artifact. `plugins` are built generically by the reusable before npm ci.
  ci:
    needs: [build-web]
    uses: akdasa-studios/kit/.github/workflows/mobile-ci.yml@main
    with:
      pages_project: shruti-preview
      plugins: '["audio-player", "media-downloader"]'
    secrets: inherit
