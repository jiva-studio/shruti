name: Mobile / Build

on:
  push:
    branches: [main]
    paths:
      - modules/apps/mobile/**
      - modules/plugins/**
      - modules/libs/**
      - modules/tests/e2e/**
      - modules/db-scheme.json
      - modules/db-sync.sh
      - .github/workflows/apps-mobile.yml
      - .github/actions/build-audio-player/**
      - .github/actions/build-media-downloader/**
      - .github/actions/mobile-android-setup/**
      - .github/actions/mobile-ios-setup/**
  pull_request:
    branches: [main]
    paths:
      - modules/apps/mobile/**
      - modules/plugins/**
      - modules/libs/**
      - modules/tests/e2e/**
      - modules/db-scheme.json
      - modules/db-sync.sh
      - .github/workflows/apps-mobile.yml
      - .github/actions/build-audio-player/**
      - .github/actions/build-media-downloader/**
      - .github/actions/mobile-android-setup/**
      - .github/actions/mobile-ios-setup/**
  workflow_dispatch:

concurrency:
  group: apps-mobile-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # -------------------------------------------------------------------------- #
  # Path-based gate for native builds. PRs that only touch web code don't need
  # to spend ~15 min running Gradle + Xcode on mac-host. Outputs are consumed
  # by build-android / build-ios via `needs:`. On push/dispatch this job is
  # skipped (the gate-using jobs ignore the outputs in that case anyway).
  # -------------------------------------------------------------------------- #
  detect-changes:
    name: detect changes
    runs-on: [self-hosted, macos, mac-host]
    if: github.event_name == 'pull_request'
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v5
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          # `package.json` / `package-lock.json` and capacitor.config.ts are
          # in *both* buckets: a Capacitor plugin bump (or any @capacitor/* /
          # cordova-* version change) requires re-linking native projects on
          # both sides. fastlane/** and the workflow file too — a broken
          # pipeline change shouldn't silently skip the thing it broke.
          filters: |
            shared: &shared
              - 'modules/apps/mobile/package.json'
              - 'modules/apps/mobile/package-lock.json'
              - 'modules/apps/mobile/capacitor.config.ts'
              - 'modules/apps/mobile/fastlane/**'
              - '.github/workflows/apps-mobile.yml'
            ios:
              - *shared
              - 'modules/apps/mobile/ios/**'
              - 'modules/plugins/**/ios/**'
              - '.github/actions/mobile-ios-setup/**'
            android:
              - *shared
              - 'modules/apps/mobile/android/**'
              - 'modules/plugins/**/android/**'
              - '.github/actions/mobile-android-setup/**'

  # -------------------------------------------------------------------------- #
  lint:
    name: lint
    runs-on: [self-hosted, macos, mac-host]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: ./.github/actions/build-audio-player
      - uses: ./.github/actions/build-media-downloader
      - run: cd modules/apps/mobile && npm ci --prefer-offline --no-audit
      - run: cd modules/apps/mobile && npm run lint

  test:
    name: test / unit
    runs-on: [self-hosted, macos, mac-host]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: ./.github/actions/build-audio-player
      - uses: ./.github/actions/build-media-downloader
      - run: cd modules/apps/mobile && npm ci --prefer-offline --no-audit
      - run: cd modules/apps/mobile && npm test

  build-web:
    name: build
    runs-on: [self-hosted, macos, mac-host]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: ./.github/actions/build-audio-player
      - uses: ./.github/actions/build-media-downloader
      - run: cd modules/apps/mobile && npm ci --prefer-offline --no-audit
      - name: build web bundle
        # Vite reads BUILD_ID via process.env and inlines it as __BUILD_ID__
        # (shown in Settings → About). Version comes from package.json.
        env:
          BUILD_ID: ${{ github.run_number }}
        run: cd modules/apps/mobile && npm run build
      - uses: actions/upload-artifact@v5
        with:
          name: mobile-web-dist
          path: modules/apps/mobile/dist
          retention-days: 3

  # The e2e suite isn't committed yet. Probe at runtime so the job no-ops
  # cleanly until `modules/tests/e2e/` lands; deploy jobs don't depend on
  # this one, so absence doesn't block releases (a failing suite still does).
  e2e:
    name: test / e2e
    needs: [build-web]
    runs-on: [self-hosted, macos, mac-host]
    steps:
      - uses: actions/checkout@v5
      - name: detect e2e suite
        id: check_e2e
        run: |
          if [ -f modules/tests/e2e/package-lock.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::modules/tests/e2e/ not present yet — skipping Playwright."
          fi
      - if: steps.check_e2e.outputs.present == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - if: steps.check_e2e.outputs.present == 'true'
        uses: actions/download-artifact@v5
        with:
          name: mobile-web-dist
          path: modules/apps/mobile/dist
      - if: steps.check_e2e.outputs.present == 'true'
        run: cd modules/tests/e2e && npm ci --prefer-offline --no-audit
      # `playwright install` is a no-op when the requested browser is already
      # in $HOME/Library/Caches/ms-playwright, which persists on the
      # self-hosted runner across ephemeral cycles.
      - if: steps.check_e2e.outputs.present == 'true'
        run: cd modules/tests/e2e && npx playwright install chromium
      # Self-hosted runners share localhost — a fixed port collides between
      # parallel jobs and with stale dev-server processes from prior runs.
      # Pick a random ephemeral port; playwright.config.ts reads E2E_PORT.
      - if: steps.check_e2e.outputs.present == 'true'
        name: pick e2e port
        run: echo "E2E_PORT=$((20000 + RANDOM % 40000))" >> "$GITHUB_ENV"
      - if: steps.check_e2e.outputs.present == 'true'
        name: run playwright
        env:
          E2E_USE_BUNDLE: "1"
        run: cd modules/tests/e2e && npx playwright test
      - if: always() && steps.check_e2e.outputs.present == 'true'
        name: upload playwright report
        uses: actions/upload-artifact@v5
        with:
          name: e2e-playwright-report
          path: modules/tests/e2e/playwright-report/
          retention-days: 30

  # -------------------------------------------------------------------------- #
  # Cloudflare Pages: PR preview and production web deploy.
  # Both jobs no-op when CF secrets are absent so CI passes on repos that
  # haven't wired up the shruti-preview Pages project yet.
  # -------------------------------------------------------------------------- #
  deploy-preview:
    name: web / pr
    needs: [lint, test, build-web]
    # Dependabot PR contexts get an empty `secrets` map, so wrangler would fail
    # with "CLOUDFLARE_API_TOKEN must be set". Skip preview for those PRs.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: [self-hosted, macos, mac-host]
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    concurrency:
      group: preview-pr-${{ github.event.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: mobile-web-dist
          path: dist
      - id: deploy
        if: env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != ''
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=shruti-preview --branch=pr-${{ github.event.number }}
      - if: steps.deploy.outputs.deployment-url != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview
          message: |
            ### 🚀 Preview deploy ready
            - **Stable alias (follows this PR):** https://pr-${{ github.event.number }}.shruti-preview.pages.dev
            - **This exact build:** ${{ steps.deploy.outputs.deployment-url }}
            - **Commit:** `${{ github.event.pull_request.head.sha }}`

  deploy-production:
    name: web / main
    needs: [lint, test, build-web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macos, mac-host]
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: production-main
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: mobile-web-dist
          path: dist
      - id: deploy
        if: env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != ''
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=shruti-preview --branch=main
      - if: steps.deploy.outputs.deployment-url != ''
        run: |
          echo "Production: https://shruti-preview.pages.dev"
          echo "This build: ${{ steps.deploy.outputs.deployment-url }}"

  # -------------------------------------------------------------------------- #
  # Android — single build job produces debug APK + signed release AAB.
  # -------------------------------------------------------------------------- #
  build-android:
    name: android / build
    needs: [build-web, detect-changes]
    # Dependabot PR contexts get no secrets, so the signing keystore is empty
    # and fastlane fails with "KEYSTORE_BASE64 env var is required".
    # On PRs, also skip if the diff doesn't touch anything that affects the
    # Android binary (see detect-changes for the path set).
    # `!cancelled() && needs.build-web.result == 'success'` is needed because
    # `detect-changes` is *skipped* on push/dispatch, and a skipped need
    # otherwise propagates as a skip to the downstream job.
    if: >-
      !cancelled() &&
      needs.build-web.result == 'success' &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       needs.detect-changes.outputs.android == 'true')
    runs-on: [self-hosted, macos, mac-host]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/mobile-android-setup
      - name: build apk + aab
        env:
          KEYSTORE_BASE64: ${{ secrets.GOOGLE_PLAY_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.GOOGLE_PLAY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GOOGLE_PLAY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GOOGLE_PLAY_KEY_PASSWORD }}
        run: cd modules/apps/mobile && bundle exec fastlane android build_all
      - uses: actions/upload-artifact@v5
        with:
          name: app-debug
          path: modules/apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - uses: actions/upload-artifact@v5
        with:
          name: app-release-aab
          path: modules/apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

  deploy-android:
    name: android / deploy
    needs: [lint, test, build-web, build-android]
    # `!cancelled() && needs.build-android.result == 'success'` mirrors the
    # guard on build-android: `detect-changes` is *skipped* on push/dispatch
    # and the skip otherwise propagates down the whole chain (build-android
    # → deploy-android), so a plain `if: push && main` here is silently
    # skipped on every release push. See the comment on build-android.
    if: >-
      !cancelled() &&
      needs.build-android.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macos, mac-host]
    steps:
      - uses: actions/checkout@v5
        with:
          # Need full history + tags so release notes can diff against the
          # previous mobile-v* tag (otherwise we fall back to last 30 commits).
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false
          working-directory: modules/apps/mobile
      - shell: bash
        run: cd modules/apps/mobile && bundle install --jobs 4 --retry 3
      - uses: actions/download-artifact@v5
        with:
          name: app-release-aab
          path: /tmp/aab
      - name: upload aab to play
        env:
          # Org-level service-account JSON at jiva-studio/ (visibility: all).
          # One service account uploads to every jiva-studio Play app as long
          # as it's been granted Release Manager on each in Play Console.
          GOOGLE_PLAY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
          # Used by ReleaseNotes to call Bedrock (Claude) for marketing-style
          # "What's new" text. Org-level secrets at jiva-studio/.
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: cd modules/apps/mobile && bundle exec fastlane android upload aab:/tmp/aab/app-release.aab

  # -------------------------------------------------------------------------- #
  # iOS — build signed IPA, upload to TestFlight on main.
  # The ios/ folder may not yet exist (needs `npx cap add ios` on a Mac) — in
  # that case the build step is skipped via the check_ios guard below.
  # -------------------------------------------------------------------------- #
  build-ios:
    name: ios / build
    needs: [build-web, detect-changes]
    # Same reason as build-android — dependabot PRs get empty secrets, so the
    # APPLE_CERTIFICATES zip is empty and unzip fails. Also skip on PRs whose
    # diff doesn't affect the iOS binary (see detect-changes). The
    # !cancelled / needs.build-web.result guard works around the skipped
    # detect-changes on push/dispatch propagating as a skip downstream.
    if: >-
      !cancelled() &&
      needs.build-web.result == 'success' &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       needs.detect-changes.outputs.ios == 'true')
    runs-on: [self-hosted, macos, mac-host]
    steps:
      - uses: actions/checkout@v5
      - name: check ios project
        id: check_ios
        shell: bash
        run: |
          if [ -d "modules/apps/mobile/ios/App" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::modules/apps/mobile/ios/ not present yet — run 'npx cap add ios' on a Mac and commit the project. Skipping iOS build."
          fi
      - if: steps.check_ios.outputs.present == 'true'
        uses: ./.github/actions/mobile-ios-setup
      - name: build ipa
        if: steps.check_ios.outputs.present == 'true'
        env:
          APPLE_CERTIFICATES: ${{ secrets.SHRUTI_APPLE_CERTIFICATES }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_STORE_TEAM_ID: ${{ secrets.APPLE_STORE_TEAM_ID }}
          APPLE_STORE_CONNECT_API_KEY: ${{ secrets.APPLE_STORE_CONNECT_API_KEY }}
          APPLE_STORE_CONNECT_API_KEY_ID: ${{ secrets.APPLE_STORE_CONNECT_API_KEY_ID }}
          APPLE_STORE_CONNECT_API_KEY_ISSUER: ${{ secrets.APPLE_STORE_CONNECT_API_KEY_ISSUER }}
          # `xcodebuild -showBuildSettings` evaluates the SPM graph; with our
          # 18+ packages the default 3 s timeout (with ×2 backoff up to 4
          # tries → 45 s total) blew past on the runner. 60 s base, 6 tries
          # gives us ~7.5 min of headroom which has been ample on other
          # similarly-sized projects. See fastlane-action docs.
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "60"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "6"
        run: cd modules/apps/mobile && bundle exec fastlane ios build
      - name: dump gym log on failure
        if: failure() && steps.check_ios.outputs.present == 'true'
        shell: bash
        run: |
          # Fastlane's gym writes the full unfiltered xcodebuild output here,
          # including codesign and linker errors xcpretty would hide.
          log="$HOME/Library/Logs/gym/App-App.log"
          if [ -f "$log" ]; then
            echo "::group::~/Library/Logs/gym/App-App.log"
            cat "$log"
            echo "::endgroup::"
          else
            echo "::warning::gym log not found at $log"
          fi
      - if: steps.check_ios.outputs.present == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: app-release-ipa
          path: modules/apps/mobile/ios/App/build/App.ipa
          retention-days: 14

  deploy-ios:
    name: ios / deploy
    needs: [lint, test, build-web, build-ios]
    # Same guard as deploy-android — see the comment there. `detect-changes`
    # is skipped on push/dispatch and the skip propagates through build-ios
    # into this job unless we explicitly check build-ios's own result.
    if: >-
      !cancelled() &&
      needs.build-ios.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macos, mac-host]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: check ipa artifact
        id: check_ipa
        uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          name: app-release-ipa
          path: /tmp/ipa
      - if: steps.check_ipa.outcome == 'success'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false
          working-directory: modules/apps/mobile
      - if: steps.check_ipa.outcome == 'success'
        shell: bash
        run: cd modules/apps/mobile && bundle install --jobs 4 --retry 3
      - name: upload ipa to testflight
        if: steps.check_ipa.outcome == 'success'
        env:
          APPLE_STORE_CONNECT_API_KEY: ${{ secrets.APPLE_STORE_CONNECT_API_KEY }}
          APPLE_STORE_CONNECT_API_KEY_ID: ${{ secrets.APPLE_STORE_CONNECT_API_KEY_ID }}
          APPLE_STORE_CONNECT_API_KEY_ISSUER: ${{ secrets.APPLE_STORE_CONNECT_API_KEY_ISSUER }}
          # Org-level secrets at jiva-studio/ (visibility: all) — shared with grammoria.
          BETA_FEEDBACK_EMAIL: ${{ secrets.BETA_FEEDBACK_EMAIL }}
          BETA_CONTACT_FIRST_NAME: ${{ secrets.BETA_CONTACT_FIRST_NAME }}
          BETA_CONTACT_LAST_NAME: ${{ secrets.BETA_CONTACT_LAST_NAME }}
          BETA_CONTACT_PHONE_NUMBER: ${{ secrets.BETA_CONTACT_PHONE_NUMBER }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: cd modules/apps/mobile && bundle exec fastlane ios upload ipa:/tmp/ipa/App.ipa
