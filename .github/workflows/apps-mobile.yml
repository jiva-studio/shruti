name: Apps / Mobile

on:
  push:
    branches: [main]
    paths:
      - modules/apps/mobile/**
      - modules/libs/**
      - modules/tests/e2e/**
      - modules/db-scheme.json
      - modules/db-sync.sh
      - .github/workflows/apps-mobile.yml
      - .github/actions/mobile-android-setup/**
      - .github/actions/mobile-ios-setup/**
  pull_request:
    branches: [main]
    paths:
      - modules/apps/mobile/**
      - modules/libs/**
      - modules/tests/e2e/**
      - modules/db-scheme.json
      - modules/db-sync.sh
      - .github/workflows/apps-mobile.yml
      - .github/actions/mobile-android-setup/**
      - .github/actions/mobile-ios-setup/**
  workflow_dispatch:

concurrency:
  group: apps-mobile-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # -------------------------------------------------------------------------- #
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: modules/apps/mobile/package-lock.json
      - run: cd modules/apps/mobile && npm ci
      - run: cd modules/apps/mobile && npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: modules/apps/mobile/package-lock.json
      - run: cd modules/apps/mobile && npm ci
      - run: cd modules/apps/mobile && npm test

  build-web:
    name: Build Web Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: modules/apps/mobile/package-lock.json
      - run: cd modules/apps/mobile && npm ci
      - name: Build web bundle
        # Vite reads BUILD_ID via process.env and inlines it as __BUILD_ID__
        # (shown in Settings → About). Version comes from package.json.
        env:
          BUILD_ID: ${{ github.run_number }}
        run: cd modules/apps/mobile && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-web-dist
          path: modules/apps/mobile/dist
          retention-days: 3

  # Playwright suite runs only if the e2e package has been committed.
  # We can't use `hashFiles(...)` at job-level `if:` — GitHub rejects
  # the whole workflow with a 0-second no-op run because `hashFiles`
  # requires GITHUB_WORKSPACE (which doesn't exist before checkout).
  # Instead we always start the job, do a cheap filesystem probe in
  # the first step, and skip every later step when the suite isn't
  # present. Deploy jobs below don't depend on e2e, so a missing
  # suite doesn't block releases — a failing suite still fails CI.
  e2e:
    name: E2E Tests
    needs: [build-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect e2e suite
        id: check_e2e
        run: |
          if [ -f modules/tests/e2e/package-lock.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::modules/tests/e2e/ is not present yet — skipping Playwright."
          fi
      - if: steps.check_e2e.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: modules/tests/e2e/package-lock.json
      - if: steps.check_e2e.outputs.present == 'true'
        name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('modules/tests/e2e/package-lock.json') }}
      - if: steps.check_e2e.outputs.present == 'true'
        uses: actions/download-artifact@v4
        with:
          name: mobile-web-dist
          path: modules/apps/mobile/dist
      - if: steps.check_e2e.outputs.present == 'true'
        run: cd modules/tests/e2e && npm ci
      - if: steps.check_e2e.outputs.present == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd modules/tests/e2e && npx playwright install --with-deps chromium
      - if: steps.check_e2e.outputs.present == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: cd modules/tests/e2e && npx playwright install-deps chromium
      - if: steps.check_e2e.outputs.present == 'true'
        name: Run Playwright against built bundle
        env:
          E2E_USE_BUNDLE: "1"
        run: cd modules/tests/e2e && npx playwright test
      - if: always() && steps.check_e2e.outputs.present == 'true'
        name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        with:
          name: e2e-playwright-report
          path: modules/tests/e2e/playwright-report/
          retention-days: 30

  # -------------------------------------------------------------------------- #
  # Cloudflare Pages: PR preview and production web deploy
  # -------------------------------------------------------------------------- #
  deploy-preview:
    name: Deploy PR Preview
    needs: [lint, test, build-web]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    concurrency:
      group: preview-pr-${{ github.event.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mobile-web-dist
          path: dist
      - id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=shruti-preview --branch=pr-${{ github.event.number }}
      - uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview
          message: |
            ### 🚀 Preview deploy ready
            - **Stable alias (follows this PR):** https://pr-${{ github.event.number }}.shruti-preview.pages.dev
            - **This exact build:** ${{ steps.deploy.outputs.deployment-url }}
            - **Commit:** `${{ github.event.pull_request.head.sha }}`

  deploy-production:
    name: Deploy Production (Web)
    needs: [lint, test, build-web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: production-main
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mobile-web-dist
          path: dist
      - id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=shruti-preview --branch=main
      - run: |
          echo "Production: https://shruti-preview.pages.dev"
          echo "This build: ${{ steps.deploy.outputs.deployment-url }}"

  # -------------------------------------------------------------------------- #
  # Android — single build job produces debug APK + signed release AAB
  # deploy-android is a thin uploader (no java/sdk/gradle setup)
  # -------------------------------------------------------------------------- #
  build-android:
    name: Android — Build (debug + signed release)
    needs: [build-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mobile-android-setup
      - name: Build debug APK + signed release AAB
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_ALIAS_PASSWORD }}
        run: cd modules/apps/mobile && bundle exec fastlane android build_all
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: modules/apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: modules/apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

  deploy-android:
    name: Android — Deploy to Google Play (internal)
    needs: [lint, test, build-web, build-android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history + tags so release notes can diff against the
          # previous mobile-v* tag (otherwise we fall back to last 30 commits).
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: modules/apps/mobile
      - uses: actions/download-artifact@v4
        with:
          name: app-release-aab
          path: /tmp/aab
      - name: Upload AAB to Google Play
        env:
          GOOGLE_PLAY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
        run: cd modules/apps/mobile && bundle exec fastlane android upload aab:/tmp/aab/app-release.aab

  # -------------------------------------------------------------------------- #
  # iOS — build signed IPA on macos-14, upload to TestFlight on main.
  # Skipped entirely until ios/ folder exists (needs `npx cap add ios` on a Mac).
  # -------------------------------------------------------------------------- #
  build-ios:
    name: iOS — Build (signed release IPA)
    needs: [build-web]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Check iOS project present
        id: check_ios
        shell: bash
        run: |
          if [ -d "modules/apps/mobile/ios/App" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::modules/apps/mobile/ios/ not present yet — run 'npx cap add ios' on a Mac and commit the project. Skipping iOS build."
          fi
      - if: steps.check_ios.outputs.present == 'true'
        uses: ./.github/actions/mobile-ios-setup
      - name: Build signed release IPA
        if: steps.check_ios.outputs.present == 'true'
        env:
          # Certificate bundle + match password — repo-level secrets.
          APPLE_CERTIFICATES: ${{ secrets.APPLE_CERTIFICATES }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          # Apple Store + ASC API — org-level secrets (akdasa-studios).
          APPLE_STORE_TEAM_ID: ${{ secrets.APPLE_STORE_TEAM_ID }}
          APPLE_STORE_CONNECT_API_KEY: ${{ secrets.APPLE_STORE_CONNECT_API_KEY }}
          APPLE_STORE_CONNECT_API_KEY_ID: ${{ secrets.APPLE_STORE_CONNECT_API_KEY_ID }}
          APPLE_STORE_CONNECT_API_KEY_ISSUER: ${{ secrets.APPLE_STORE_CONNECT_API_KEY_ISSUER }}
        run: cd modules/apps/mobile && bundle exec fastlane ios build
      - if: steps.check_ios.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-ipa
          path: modules/apps/mobile/ios/App/build/App.ipa
          retention-days: 14

  deploy-ios:
    name: iOS — Deploy to TestFlight
    needs: [lint, test, build-web, build-ios]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Upload-only job — no Xcode compilation needed. Using macos-15 because
    # Ruby 3.3's bundled OpenSSL on macos-26 (arm64) fails to parse the
    # App Store Connect EC .p8 key with "invalid curve name".
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history + tags so release notes can diff against the
          # previous mobile-v* tag (otherwise we fall back to last 30 commits).
          fetch-depth: 0
      - name: Check artifact exists
        id: check_ipa
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: app-release-ipa
          path: /tmp/ipa
      - if: steps.check_ipa.outcome == 'success'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: modules/apps/mobile
      - name: Upload IPA to TestFlight
        if: steps.check_ipa.outcome == 'success'
        env:
          APPLE_STORE_CONNECT_API_KEY: ${{ secrets.APPLE_STORE_CONNECT_API_KEY }}
          APPLE_STORE_CONNECT_API_KEY_ID: ${{ secrets.APPLE_STORE_CONNECT_API_KEY_ID }}
          APPLE_STORE_CONNECT_API_KEY_ISSUER: ${{ secrets.APPLE_STORE_CONNECT_API_KEY_ISSUER }}
          BETA_FEEDBACK_EMAIL: ${{ secrets.BETA_FEEDBACK_EMAIL }}
          BETA_CONTACT_FIRST_NAME: ${{ secrets.BETA_CONTACT_FIRST_NAME }}
          BETA_CONTACT_LAST_NAME: ${{ secrets.BETA_CONTACT_LAST_NAME }}
          BETA_CONTACT_PHONE_NUMBER: ${{ secrets.BETA_CONTACT_PHONE_NUMBER }}
        run: cd modules/apps/mobile && bundle exec fastlane ios upload ipa:/tmp/ipa/App.ipa
