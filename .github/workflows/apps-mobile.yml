name: Mobile / Build

on:
  push:
    branches: [main]
    paths:
      - modules/apps/mobile/**
      - modules/plugins/**
      - modules/libs/**
      - tests/e2e/mobile/**
      - modules/db-scheme.json
      - modules/db-sync.sh
      - .github/workflows/apps-mobile.yml
      - .github/actions/build-audio-player/**
      - .github/actions/build-media-downloader/**
      - .gitmodules
      - modules/kit/**
  pull_request:
    branches: [main]
    paths:
      - modules/apps/mobile/**
      - modules/plugins/**
      - modules/libs/**
      - tests/e2e/mobile/**
      - modules/db-scheme.json
      - modules/db-sync.sh
      - .github/workflows/apps-mobile.yml
      - .github/actions/build-audio-player/**
      - .github/actions/build-media-downloader/**
      - .gitmodules
      - modules/kit/**
  workflow_dispatch:

concurrency:
  group: apps-mobile-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # build-web stays app-local: it bakes app-specific compile-time config into
  # the bundle (RevenueCat keys via fixed Vite env names) and builds the
  # in-house Capacitor plugins. It uploads the mobile-web-dist artifact the
  # reusable ci workflow's e2e/deploy jobs consume.
  build-web:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: modules/apps/mobile/package-lock.json
      - uses: ./.github/actions/build-audio-player
      - uses: ./.github/actions/build-media-downloader
      - run: cd modules/apps/mobile && npm ci --prefer-offline --no-audit
      - name: build web bundle
        # Vite reads BUILD_ID via process.env and inlines it as __BUILD_ID__
        # (shown in Settings → About). Version comes from package.json.
        # RevenueCat SDK keys (public, platform-scoped) are baked into the
        # bundle as compile-time defines; absent keys → IAP UI hides itself.
        env:
          BUILD_ID: ${{ github.run_number }}
          # Short hash shown next to the build id in Settings → About so we know
          # which commit a build came from. Vite truncates to 7 chars.
          COMMIT_SHA: ${{ github.sha }}
          # Vite reads these generic names (same as kit's native-binary build).
          REVENUECAT_IOS_KEY: ${{ secrets.SHRUTI_APPLE_REVENUE_CAT_KEY }}
          REVENUECAT_ANDROID_KEY: ${{ secrets.SHRUTI_GOOGLE_REVENUE_CAT_KEY }}
          # Present only here (a secret) → @sentry/vite-plugin uploads JS source
          # maps for this build's release (shruti@<version>+<sha>, from
          # COMMIT_SHA above) and strips the .map files from dist afterwards.
          # Absent (forks / PRs without the secret) → plugin is skipped, build
          # unchanged. Org/project default in vite.config (akdasa-studio/shruti).
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: cd modules/apps/mobile && npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: mobile-web-dist
          path: modules/apps/mobile/dist
          retention-days: 3

  # The workflow-level `paths:` filter also fires on e2e / libs / db-scheme
  # changes that cannot affect the native sources, and android-native is a
  # multi-minute Gradle run. Gate it on a real diff of the native trees.
  # workflow_dispatch has no diff to compute, so the lane runs unconditionally
  # there (see android-native's `if`).
  detect-native:
    name: detect native changes
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@v5
      - id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            native:
              - 'modules/plugins/*/android/**'
              - 'modules/apps/mobile/android/**'
              - 'modules/apps/mobile/package-lock.json'
              - '.github/workflows/apps-mobile.yml'

  # The whole Android native lane: compile the app module, run the plugin unit
  # tests, then Android Lint over both in-house Capacitor plugins. Every step
  # is fatal.
  #
  # Nothing else in CI touches the native halves, so an API-level mistake (a
  # java.nio.file call at minSdk 23 — issue #1721) reached main and only died
  # on real Android 6/7 devices. `NewApi` catches exactly that, and both
  # modules set `lint { abortOnError true }`.
  #
  # The lane used to lint the two plugin modules and nothing else. The `app`
  # module — MainActivity + BundledDatabaseHelper, the code that runs before
  # the first frame — was never compiled by any job, which is how the
  # Integer.parseInt on a 14-digit catalog version in #1877 shipped through a
  # green pipeline (#1878). The plugins' own JVM unit tests were never run
  # either (#1898).
  #
  # iOS stays uncovered: see the comment at the end of this job.
  android-native:
    name: build + test (android native)
    needs: [detect-native]
    if: needs.detect-native.outputs.native == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: modules/apps/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        # Same pin as kit's mobile-android-setup: compileSdk 36 per
        # modules/apps/mobile/android/variables.gradle. No emulator/system
        # images — lint runs nothing, and the unit tests are plain JVM tests
        # (testDebugUnitTest, not androidTest/connectedCheck).
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: ./.github/actions/build-audio-player
      - uses: ./.github/actions/build-media-downloader
      - run: cd modules/apps/mobile && npm ci --prefer-offline --no-audit
      # The plugins are not standalone Gradle builds — they are included by the
      # app project via capacitor.settings.gradle. `cap update` regenerates the
      # gitignored capacitor-cordova-android-plugins module that app/build.gradle
      # `apply from:`s; without it the root project fails to configure. Unlike
      # `cap sync` it does not copy web assets, so no dist/ is needed here.
      - name: generate native capacitor project files
        # `cap sync` writes the gitignored pieces the app project needs to
        # configure: capacitor-cordova-android-plugins/ (which app/build.gradle
        # `apply from:`s) and app/src/main/assets/capacitor.plugins.json.
        # It insists on a webDir, but neither lint nor javac nor the JVM unit
        # tests read the web bundle — so a stub index.html, not the real
        # mobile-web-dist artifact, which would serialise this lane behind
        # build-web for no extra coverage.
        run: |
          cd modules/apps/mobile
          mkdir -p dist android/app/src/main/assets
          [ -f dist/index.html ] || echo '<!doctype html>' > dist/index.html
          npx cap sync android
      - name: compile the app module
        # The cheapest signal that MainActivity/BundledDatabaseHelper still
        # build, and it runs before lint because it is the faster of the two.
        # compileDebugJavaWithJavac, not assembleDebug: it compiles every
        # source file in the module (plus the plugin modules it depends on)
        # without paying for packaging, dexing and signing.
        run: |
          cd modules/apps/mobile/android
          ./gradlew --no-daemon :app:compileDebugJavaWithJavac
      - name: run native unit tests
        # --continue for the same reason as lint below: one run reports every
        # offending module instead of one per push.
        # audio-player has no src/test yet, so its task is NO-SOURCE today —
        # named anyway so tests added there are picked up without a CI edit.
        # The guard below is what keeps that from being silently vacuous.
        run: |
          cd modules/apps/mobile/android
          ./gradlew --no-daemon --continue \
            :shruti-plugin-audio-player:testDebugUnitTest \
            :shruti-plugin-media-downloader:testDebugUnitTest
      - name: assert unit tests actually ran
        # A Gradle test task with no sources passes. If the test source sets
        # ever stop being compiled or discovered, the step above stays green
        # having run nothing — exactly the failure mode this lane exists to
        # end. Count the JUnit XML and fail on zero.
        run: |
          set -u
          total=0
          for module in audio-player media-downloader; do
            dir="modules/plugins/$module/android/build/test-results/testDebugUnitTest"
            count=$(grep -ho 'tests="[0-9]*"' "$dir"/*.xml 2>/dev/null \
              | grep -o '[0-9]*' | awk '{ s += $1 } END { print s + 0 }')
            count=${count:-0}
            echo "$module: $count test(s)"
            total=$((total + count))
          done
          if [ "$total" -eq 0 ]; then
            echo "::error::no unit tests ran in any plugin module"
            exit 1
          fi
      - name: upload unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-test-reports
          path: modules/plugins/*/android/build/reports/tests/**
          retention-days: 7
          if-no-files-found: ignore
      - name: lint native plugin modules
        # Gradle project names come from capacitor.settings.gradle — the
        # `shruti-plugin-` prefix is Capacitor's, not the npm dir name.
        # --continue so a failure in the first module still lints the second:
        # one run reports every offender instead of one per push.
        run: |
          cd modules/apps/mobile/android
          ./gradlew --no-daemon --continue \
            :shruti-plugin-audio-player:lintRelease \
            :shruti-plugin-media-downloader:lintRelease
      - name: assert lint reports carry no errors
        # Belt and braces: if abortOnError is ever reverted (or the flag stops
        # applying), the Gradle step above goes green with errors in the report.
        # This step re-reads the XML so silencing lint cannot silence the lane.
        run: |
          set -u
          fail=0
          for module in audio-player media-downloader; do
            dir="modules/plugins/$module/android/build/reports"
            reports=$(find "$dir" -name 'lint-results*.xml' 2>/dev/null || true)
            if [ -z "$reports" ]; then
              echo "::error::no lint report under $dir — did lintRelease run?"
              fail=1
              continue
            fi
            for report in $reports; do
              if grep -qE 'severity="(Error|Fatal)"' "$report"; then
                echo "::error::lint errors in $module ($report)"
                grep -E 'id=|severity="(Error|Fatal)"|message=' "$report" | head -60
                fail=1
              fi
            done
          done
          exit $fail
      - name: upload lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-lint-reports
          path: modules/plugins/*/android/build/reports/lint-results*
          retention-days: 7
          if-no-files-found: ignore

  # ── Not covered: the iOS half ──────────────────────────────────────────────
  # There is deliberately no Swift lane, and that leaves real tests unrun:
  # AudioPlayerPluginTests / PlaybackPolicyTests and MediaDownloaderPluginTests
  # (part of #1898). Nothing on any machine checks the iOS sources today.
  #
  # Why not: both plugin packages declare `platforms: [.iOS(.v14)]` and link
  # capacitor-swift-pm, so they cannot be built on a Linux runner — `swift
  # test` needs UIKit and an iOS Simulator destination, i.e. a macOS runner.
  # macOS minutes here are billed (the org's included allowance is spent every
  # month: 1072 macOS minutes in June 2026), at ~10x the Linux rate, and this
  # lane fires on every PR that touches native code — whereas every existing
  # macOS job in this repo (binaries, store screenshots) is workflow_dispatch
  # only, on purpose.
  #
  # Adding a blocking lane on that budget is a call for a human to make, and it
  # should be made with one measured dispatch run in hand — the Swift tests
  # have never executed anywhere, so their current pass/fail state is unknown.
  # Until then, treat every iOS change as untested and exercise it on a device.

  # Shared web CI: lint, unit test, e2e, Cloudflare Pages preview + production.
  # Runs after build-web so its e2e/deploy jobs find the mobile-web-dist
  # artifact. `plugins` are built generically by the reusable before npm ci.
  ci:
    needs: [build-web]
    uses: ./.github/workflows/mobile-ci-reusable.yml
    with:
      pages_project: shruti-preview
      plugins: '["audio-player", "media-downloader"]'
      # Our Playwright suite is at tests/e2e/mobile, not the path the reusable
      # job probes, so it was reporting a green check having run nothing. It is
      # also a ~15-minute browser suite: worth running deliberately (the `e2e
      # (manual)` workflow) rather than on every push.
      run_e2e: false
    # Explicit, not `inherit`: the callee declares exactly these three, and
    # `inherit` would hand a workflow in another repository the whole secret
    # set, including the store-signing material.
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
