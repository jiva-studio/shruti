name: Services / Share-Video / AWS

on:
  push:
    branches: [main]
    paths:
      - modules/services/share-video/**
      - .github/workflows/share-video-aws.yml
  pull_request:
    branches: [main]
    paths:
      - modules/services/share-video/**
      - .github/workflows/share-video-aws.yml
  workflow_dispatch:

concurrency:
  group: share-video-aws-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: modules/services/share-video

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npx serverless print --config serverless-aws.yml
        env:
          AWS_REGION: us-east-1
          OPENAI_API_KEY: placeholder

  deploy:
    name: deploy
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch ffmpeg + ffprobe static binaries
        run: |
          mkdir -p layers/ffmpeg/bin
          curl -sSL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz \
            | tar -xJ --strip-components=1 -C layers/ffmpeg/bin --wildcards '*/ffmpeg' '*/ffprobe'
          chmod +x layers/ffmpeg/bin/ffmpeg layers/ffmpeg/bin/ffprobe
      - run: npm ci
      - run: npm run build
      - name: Deploy to AWS Lambda
        run: npx serverless deploy --config serverless-aws.yml
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.LECTORIUM_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.LECTORIUM_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          # Workflow translates cloud-prefixed GH secret → generic in-function env name.
          OPENAI_API_KEY: ${{ secrets.LECTORIUM_OPENAI_API_KEY }}
