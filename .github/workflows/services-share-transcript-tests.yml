name: Share-transcript Tests

on:
  pull_request:
    paths:
      - 'modules/services/share-transcript/**'
      - '.github/workflows/services-share-transcript-tests.yml'
  push:
    branches: [main]
    paths:
      - 'modules/services/share-transcript/**'
      - '.github/workflows/services-share-transcript-tests.yml'

concurrency:
  group: services-share-transcript-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pytest:
    name: Pytest + ruff
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/services/share-transcript/app
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          version-file: modules/services/share-transcript/app/pyproject.toml

      - name: Install share-transcript + dev deps
        run: uv sync --locked --extra dev

      - name: Ruff
        run: uv run --no-sync ruff check .

      - name: Run tests
        run: uv run --no-sync python -m pytest tests -q
