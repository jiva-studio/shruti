name: Share-transcript Tests

on:
  pull_request:
    paths:
      - 'modules/services/share-transcript/**'
      - '.github/workflows/services-share-transcript-tests.yml'
  push:
    branches: [main]
    paths:
      - 'modules/services/share-transcript/**'
      - '.github/workflows/services-share-transcript-tests.yml'

concurrency:
  group: services-share-transcript-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pytest:
    name: Pytest + ruff
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/services/share-transcript/app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install share-transcript + dev deps
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests -q

      - name: Ruff
        run: ruff check .
