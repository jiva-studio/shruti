name: Security / Secret Scan

# Catches accidental `git add .env` / inline credentials before they
# reach origin. `.env` is gitignored today, but a slip past that
# (different filename, copy-pasted token in a comment) would still
# land — gitleaks scans the actual content.
#
# Two passes. The working-tree pass is the gate on what the next push
# adds. The history pass exists because a secret deleted in a later
# commit is still served by `git show` forever, and a public repository
# makes that a one-command retrieval — the tree being clean says
# nothing about the history being clean.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history — the history pass below needs every commit.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.30.1
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar xz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan working tree
        run: |
          # --no-git scans the working tree, not history — keeps the
          # gate focused on what would land on the next push instead of
          # tripping on deleted-but-historical files.
          # --redact masks the secret in the public log on a find.
          gitleaks detect \
            --source . \
            --no-git \
            --config .gitleaks.toml \
            --no-banner \
            --redact \
            --verbose \
            --exit-code 1

      - name: Scan history
        run: |
          # Old key material is allowlisted by commit SHA in .gitleaks.toml.
          gitleaks git \
            --log-opts="--all" \
            --config .gitleaks.toml \
            --no-banner \
            --redact \
            --verbose \
            --exit-code 1
