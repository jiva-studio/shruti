name: Mobile / Binaries

# STRICTLY manual native-binary builds — no auto-build on push/PR/release tag.
# Per-push CI (apps-mobile.yml) stays web-only; native binaries and store
# uploads happen on demand from here. Delegates to the kit reusable workflow.
# Every dispatch builds AND deploys — there is intentionally no build-only mode
# (a build that never ships just burns a build number).
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which platform(s) to build + deploy
        type: choice
        options: [both, android, ios]
        default: both
      track:
        description: Play track for android deploy
        type: choice
        options: [internal, beta, production]
        default: internal

concurrency:
  group: apps-mobile-binaries-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  binaries:
    # Pin: kit reusable workflow. Bump to a tag/SHA once kit is released.
    uses: jiva-studio/kit/.github/workflows/mobile-binaries.yml@441060d194dd150c0c71fc73e266b5dde05ab71b # main
    with:
      platform: ${{ inputs.platform }}
      action: build-and-deploy
      track: ${{ inputs.track }}
      # In-house Capacitor plugins: built (npm ci && npm run build) before the
      # app's npm ci so vue-tsc resolves their dist/ type declarations.
      plugins: '["audio-player","media-downloader"]'
    # Explicit mapping: this app's iOS cert is stored as SHRUTI_APPLE_CERTIFICATES
    # but kit's reusable workflow expects the generic APPLE_CERTIFICATES.
    secrets:
      KIT_DEPLOY_KEY: ${{ secrets.KIT_DEPLOY_KEY }}
      # Public RevenueCat SDK keys, baked into the web bundle kit builds for
      # the native binaries. Without these the shipped app gets empty keys →
      # purchases `available: false` → no prices, subscription unrecognized.
      REVENUECAT_IOS_KEY: ${{ secrets.SHRUTI_APPLE_REVENUE_CAT_KEY }}
      REVENUECAT_ANDROID_KEY: ${{ secrets.SHRUTI_GOOGLE_REVENUE_CAT_KEY }}
      # Lets @sentry/vite-plugin upload JS source maps for the shipped native
      # build so minified crash stacks de-obfuscate. Org/project default in
      # vite.config (jiva-studio/shruti). Requires the matching
      # SENTRY_AUTH_TOKEN passthrough in kit's mobile-binaries.yml.
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      GOOGLE_PLAY_KEYSTORE_BASE64: ${{ secrets.GOOGLE_PLAY_KEYSTORE_BASE64 }}
      GOOGLE_PLAY_KEYSTORE_PASSWORD: ${{ secrets.GOOGLE_PLAY_KEYSTORE_PASSWORD }}
      GOOGLE_PLAY_KEY_ALIAS: ${{ secrets.GOOGLE_PLAY_KEY_ALIAS }}
      GOOGLE_PLAY_KEY_PASSWORD: ${{ secrets.GOOGLE_PLAY_KEY_PASSWORD }}
      GOOGLE_PLAY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
      APPLE_CERTIFICATES: ${{ secrets.SHRUTI_APPLE_CERTIFICATES }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_STORE_TEAM_ID: ${{ secrets.APPLE_STORE_TEAM_ID }}
      APPLE_STORE_CONNECT_API_KEY: ${{ secrets.APPLE_STORE_CONNECT_API_KEY }}
      APPLE_STORE_CONNECT_API_KEY_ID: ${{ secrets.APPLE_STORE_CONNECT_API_KEY_ID }}
      APPLE_STORE_CONNECT_API_KEY_ISSUER: ${{ secrets.APPLE_STORE_CONNECT_API_KEY_ISSUER }}
      BETA_FEEDBACK_EMAIL: ${{ secrets.BETA_FEEDBACK_EMAIL }}
      BETA_CONTACT_FIRST_NAME: ${{ secrets.BETA_CONTACT_FIRST_NAME }}
      BETA_CONTACT_LAST_NAME: ${{ secrets.BETA_CONTACT_LAST_NAME }}
      BETA_CONTACT_PHONE_NUMBER: ${{ secrets.BETA_CONTACT_PHONE_NUMBER }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
