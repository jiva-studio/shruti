name: Go Lint

# golangci-lint with modules/.golangci.yml over every Go module under modules/.
#
# One job looping over the modules rather than a matrix: the work per module
# takes seconds and a matrix would pay for a checkout and a toolchain install
# each. The loop names each module in its own log group and lists every
# failing module at the end.

on:
  pull_request:
    paths:
      - 'modules/**/*.go'
      - 'modules/**/go.mod'
      - 'modules/**/go.sum'
      - 'modules/.golangci.yml'
      - 'modules/.tool-versions'
      - 'scripts/go-newest-version.sh'
      - 'scripts/check-go-lint-exclusions.sh'
      - '.github/workflows/modules-go-lint.yml'
  push:
    branches: [main]
    paths:
      - 'modules/**/*.go'
      - 'modules/**/go.mod'
      - 'modules/**/go.sum'
      - 'modules/.golangci.yml'
      - 'modules/.tool-versions'
      - 'scripts/go-newest-version.sh'
      - 'scripts/check-go-lint-exclusions.sh'
      - '.github/workflows/modules-go-lint.yml'

concurrency:
  group: modules-go-lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: newest Go version the modules ask for
        id: go
        run: echo "version=$(scripts/go-newest-version.sh)" >> "$GITHUB_OUTPUT"

      # Every module builds under the newest go directive among them.
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go.outputs.version }}

      - name: install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" "v$(awk '$1=="golangci-lint"{print $2}' modules/.tool-versions)"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: lint every module
        run: |
          set -uo pipefail
          failed=()
          while IFS= read -r mod; do
            dir="$(dirname "$mod")"
            echo "::group::$dir"
            if ! (cd "$dir" && golangci-lint run ./... 2> >(grep -v 'Skipped 0 issues by rules' >&2)); then
              failed+=("$dir")
            fi
            echo "::endgroup::"
          done < <(find modules -name go.mod -not -path '*/node_modules/*' | sort)

          if [ ${#failed[@]} -ne 0 ]; then
            echo "::error::golangci-lint failed in: ${failed[*]}"
            exit 1
          fi
          echo "all modules clean"

      - name: every exclusion rule is still used
        run: scripts/check-go-lint-exclusions.sh
