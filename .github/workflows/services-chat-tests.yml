name: Chat Tests

# Runs the chat-service pytest suite on every PR that touches the chat
# subtree, so a broken turn fails CI before merge, and on push to main so
# the result is recorded there too.
#
# This workflow is the fast feedback path, not the deploy gate.
# `services-ghcr.yml` triggers independently on the same push, so it runs
# the same suite itself before pushing the chat image; otherwise it could
# publish :latest from a red commit. Keep the two in sync.

on:
  pull_request:
    paths:
      - 'modules/services/chat/**'
      - '.github/workflows/services-chat-tests.yml'
  push:
    branches: [main]
    paths:
      - 'modules/services/chat/**'
      - '.github/workflows/services-chat-tests.yml'

concurrency:
  group: services-chat-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        # The package + tests live under app/; pyproject's editable
        # install puts `src/shruti_chat` on the path and pytest's
        # rootdir (app) makes the `tests.*` packages importable.
        working-directory: modules/services/chat/app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # The same uv release and the same lock the image builds with
      # (modules/services/chat/Dockerfile), so the suite, ruff and mypy run
      # against the dependency tree that ships. `--locked` fails when uv.lock
      # has drifted from pyproject.toml. UV_PYTHON_DOWNLOADS=never keeps uv on
      # the 3.12 setup-python just installed.
      - name: Install chat + dev deps (locked)
        env:
          UV_PYTHON_DOWNLOADS: never
        run: |
          pip install "uv==0.11.29"
          uv sync --locked --extra dev

      - name: Ruff
        run: uv run --no-sync ruff check src tests

      # Only references to names that do not exist fail the step
      # (attr-defined, name-defined, import-not-found); see the script.
      - name: Mypy (missing names)
        run: uv run --no-sync python scripts/check_mypy.py

      - name: Run tests
        run: uv run --no-sync python -m pytest tests -q
