name: Services / chat tests

# Runs the chat-service pytest suite on every PR that touches the chat
# subtree, so a broken turn fails CI before merge, and on push to main so
# the result is recorded there too.
#
# This workflow is the FAST feedback path, not the deploy gate. It used to
# be the only place the suite ran, and because `services-ghcr.yml` triggers
# independently on the same push, the build raced it and could publish
# :latest from a red commit (the «Перескажи текущую лекцию» empty-result
# bug, PR #1016, reached prod that way). The build now runs the same suite
# itself before pushing the chat image — keep the two in sync.

on:
  pull_request:
    paths:
      - 'modules/services/chat/**'
      - '.github/workflows/services-chat-tests.yml'
      - '.github/workflows/services-ghcr.yml'
  push:
    branches: [main]
    paths:
      - 'modules/services/chat/**'
      - '.github/workflows/services-chat-tests.yml'
      - '.github/workflows/services-ghcr.yml'
  # The image job below is the only PR-time check on the chat Dockerfile;
  # dispatch lets the author re-run it without pushing a commit.
  workflow_dispatch:

concurrency:
  group: services-chat-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        # The package + tests live under app/; pyproject's editable
        # install puts `src/lectorium_chat` on the path and pytest's
        # rootdir (app) makes the `tests.*` packages importable.
        working-directory: modules/services/chat/app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # setup-uv publishes no moving major tag — pin the exact release.
      # Action steps ignore `defaults.run.working-directory`, so the cache
      # glob is repo-relative; without it the default would hash every
      # pyproject.toml in the monorepo.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: '0.11.29'
          enable-cache: true
          cache-dependency-glob: 'modules/services/chat/app/uv.lock'

      # Same locked path the image builds with (modules/services/chat/
      # Dockerfile) — the suite must run against the dependency tree that
      # actually ships, not a fresh float of 22 bare `>=` constraints.
      #
      # `--locked` (not `--frozen`) fails when uv.lock has drifted from
      # pyproject.toml, so a dependency bump can't land half-applied and
      # leave the lock decorative again. UV_PYTHON_DOWNLOADS=never keeps
      # uv on the 3.12 setup-python just installed, matching python:3.12-slim.
      - name: Install chat + dev deps (locked)
        env:
          UV_PYTHON_DOWNLOADS: never
        run: uv sync --locked --extra dev

      - name: Run tests
        run: uv run --no-sync python -m pytest tests -q

  # ------------------------------------------------------------------
  # image: PR-time validation of the chat Dockerfile and the ghcr gate.
  #
  # `services-ghcr.yml` only runs on push to main and workflow_dispatch,
  # so until now a broken Dockerfile or a broken chat gate inside it got
  # ZERO review-time signal — it landed red on main and stopped image
  # publishing for every service in that push's matrix.
  #
  # Deliberately cheap: the build is skipped unless a file that can
  # actually change the image changed, it never pushes, and it writes no
  # GHA cache (reads main's `chat` scope, so an unchanged dependency
  # layer is a cache hit). Cost is ~0 on a source-only chat PR and one
  # `uv sync --frozen` on a dependency PR — which is exactly the PR that
  # needs proving.
  # ------------------------------------------------------------------
  image:
    name: image build (chat)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Both workflows carry hand-written shell and matrix expressions; a
      # parse error in either is a red main. Near-free, so it runs always.
      - name: Parse workflow YAML
        run: |
          python3 -c 'import sys, yaml; [yaml.safe_load(open(p)) for p in sys.argv[1:]]' \
            .github/workflows/services-chat-tests.yml \
            .github/workflows/services-ghcr.yml

      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            image:
              - 'modules/services/chat/Dockerfile'
              - 'modules/services/chat/app/pyproject.toml'
              - 'modules/services/chat/app/uv.lock'
              - 'modules/services/chat/app/.python-version'
              - 'modules/.dockerignore'
              - '.github/workflows/services-ghcr.yml'
              - '.github/workflows/services-chat-tests.yml'

      - uses: docker/setup-buildx-action@v3
        if: steps.filter.outputs.image == 'true' || github.event_name != 'pull_request'

      # Same context + dockerfile as the `chat` matrix entry in
      # services-ghcr.yml. No `push`, no `load` (nothing scans it here)
      # and no `cache-to` — a PR must not evict main's build cache.
      - uses: docker/build-push-action@v6
        if: steps.filter.outputs.image == 'true' || github.event_name != 'pull_request'
        with:
          context: ./modules
          file: ./modules/services/chat/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=chat
