name: Services / chat tests

# Runs the chat-service pytest suite on every PR that touches the chat
# subtree, so a broken turn fails CI before merge, and on push to main so
# the result is recorded there too.
#
# This workflow is the FAST feedback path, not the deploy gate. It used to
# be the only place the suite ran, and because `services-ghcr.yml` triggers
# independently on the same push, the build raced it and could publish
# :latest from a red commit (the «Перескажи текущую лекцию» empty-result
# bug, PR #1016, reached prod that way). The build now runs the same suite
# itself before pushing the chat image — keep the two in sync.

on:
  pull_request:
    paths:
      - 'modules/services/chat/**'
      - '.github/workflows/services-chat-tests.yml'
  push:
    branches: [main]
    paths:
      - 'modules/services/chat/**'
      - '.github/workflows/services-chat-tests.yml'

concurrency:
  group: services-chat-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        # The package + tests live under app/; pyproject's editable
        # install puts `src/shruti_chat` on the path and pytest's
        # rootdir (app) makes the `tests.*` packages importable.
        working-directory: modules/services/chat/app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install chat + dev deps
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests -q
