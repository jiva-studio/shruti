name: Quality Metrics

# Collects real test coverage and mutation score metrics on push to main,
# uploads reports to artifacts, and publishes Shields.io badge endpoints
# to the 'badges' branch.

on:
  push:
    branches: [main]
    paths:
      - 'modules/services/**'
      - 'modules/libs/**'
      - 'modules/apps/**'
      - 'modules/.nvmrc'
      - '.github/workflows/quality-metrics.yml'
  workflow_dispatch:

concurrency:
  group: quality-metrics-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  postgres-image:
    name: postgres image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.read.outputs.image }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: infra/app/compose

      - name: read the discovery Postgres image
        id: read
        run: |
          image="$(yq -r '.services."discovery-postgres".image' infra/app/compose/docker-compose.yml)"
          if [ -z "$image" ] || [ "$image" = null ]; then
            echo "::error::no services.discovery-postgres.image in infra/app/compose/docker-compose.yml"
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

  metrics:
    name: Collect Metrics & Badges
    needs: postgres-image
    runs-on: ubuntu-latest

    services:
      postgres:
        image: ${{ needs.postgres-image.outputs.image }}
        env:
          POSTGRES_USER: discovery
          POSTGRES_PASSWORD: discovery
          POSTGRES_DB: discovery
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U discovery"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ── 1. Python Coverage (Chat Service) ───────────────────────────
      - uses: astral-sh/setup-uv@v6
        with:
          version-file: modules/services/chat/app/pyproject.toml

      - name: Measure Chat Service Coverage
        working-directory: modules/services/chat/app
        run: |
          uv sync --locked --extra dev
          uv run --no-sync python -m pytest --cov=shruti_chat --cov-report=json:$GITHUB_WORKSPACE/coverage-chat.json -q

      # ── 2. Go Coverage (Discovery Service) ──────────────────────────
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: modules/services/discovery/go.mod
          cache-dependency-path: modules/services/discovery/go.sum

      - name: Measure Discovery Service Coverage
        working-directory: modules/services/discovery
        env:
          SHRUTI_DISCOVERY_TEST_DATABASE_URL: postgresql://discovery:discovery@localhost:5432/discovery?sslmode=disable
        run: |
          go test ./... -count=1 -p 1 -coverprofile=$GITHUB_WORKSPACE/coverage-discovery.out

      # ── 3. Mutation Testing (Incremental with Cache) ─────────────────
      - name: Restore Stryker incremental cache
        uses: actions/cache@v4
        with:
          path: |
            .stryker/incremental
            reports/mutation
          key: stryker-incremental-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            stryker-incremental-${{ runner.os }}-main-
            stryker-incremental-${{ runner.os }}-

      - name: Set up Node.js (for Stryker runner)
        uses: actions/setup-node@v4
        with:
          node-version-file: modules/.nvmrc
          cache: npm
          cache-dependency-path: modules/apps/mobile/package-lock.json

      - name: Run Incremental Mutation Testing
        working-directory: modules/apps/mobile
        run: |
          npm ci --prefer-offline --no-audit
          npx stryker run

      # ── 4. Generate Badge Endpoints & Upload to Gist ─────────────────
      - name: Compute Metrics & Update Gist Badges
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: "742b061e8fd39288b88485ae7f58c95a"
        run: |
          python3 scripts/generate_badges.py

      - name: Upload Coverage and Mutation Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-metrics-reports
          path: |
            coverage-chat.json
            coverage-discovery.out
            reports/mutation/
            build-badges/
          retention-days: 14
