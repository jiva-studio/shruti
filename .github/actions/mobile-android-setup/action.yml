name: Mobile Android setup
description: >
  Node + Java + Android SDK + Ruby + bundler + npm deps + web artifact.
  Shared setup for any job that runs Fastlane / gradle in the mobile Android project.

  GitHub-hosted runners: caching restored (npm via setup-node, gradle via
  setup-java, bundler via ruby/setup-ruby) so cold ephemeral runners stay fast.

  Paths inside the steps are relative to the repository root
  (modules/apps/mobile/...).

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: modules/apps/mobile/package-lock.json

    - uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: 21
        cache: gradle

    - uses: android-actions/setup-android@v3
      with:
        # Pin only what AAB build needs (per modules/apps/mobile/android/variables.gradle:
        # compileSdk=36, AGP 8.13.2 → build-tools 36). Skipping the action's
        # default `tools` (legacy SDK tools) and not requesting `emulator` /
        # `system-images;*` cuts ~500 MB off setup time on each cold runner.
        packages: platform-tools platforms;android-36 build-tools;36.0.0

    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: "3.3"
        bundler-cache: true
        working-directory: modules/apps/mobile

    - shell: bash
      run: cd modules/apps/mobile && npm ci --prefer-offline --no-audit

    - uses: actions/download-artifact@v5
      with:
        name: mobile-web-dist
        path: modules/apps/mobile/dist
