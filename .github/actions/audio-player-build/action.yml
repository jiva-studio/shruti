name: Audio-player build
description: >
  Install deps and build @shruti/audio-player so its dist/ (types +
  bundles) exists before the mobile app's npm ci wires it in via file:.
  The lib's dist/ is gitignored, so CI must rebuild it on every run.

runs:
  using: composite
  steps:
    - shell: bash
      run: cd modules/libs/audioPlayer && npm ci

    - shell: bash
      run: cd modules/libs/audioPlayer && npm run build
