name: Mobile iOS setup
description: >
  Xcode + Node + Ruby + bundler + npm deps + web artifact. Shared setup
  for any job that runs Fastlane / xcodebuild in the mobile iOS project.
  The project is SPM-based — no CocoaPods.

  No actions/cache for SwiftPM here — the self-hosted mac-host runner
  persists ~/Library/Developer/Xcode (DerivedData, SourcePackages) and
  ~/Library/Caches/org.swift.swiftpm across ephemeral cycles, which gives
  warm-cache behaviour without paying the GitHub upload/download cost
  (which was hanging 15+ min on the post-step).

# Xcode version pin. Capacitor 8 requires Xcode 26+ (ionic-team/capacitor#8290).
# Apple advances the App Store minimum ~yearly; check
# https://developer.apple.com/news/?id=fxu2qp7b before bumping.
inputs:
  xcode-version:
    description: Xcode version to select on the macOS runner.
    required: false
    default: "26.4"

runs:
  using: composite
  steps:
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ inputs.xcode-version }}

    - uses: actions/setup-node@v5
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: modules/apps/mobile/package-lock.json

    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: "3.3"
        bundler-cache: true
        working-directory: modules/apps/mobile

    - shell: bash
      run: cd modules/apps/mobile && npm ci --prefer-offline --no-audit

    - uses: actions/download-artifact@v5
      with:
        name: mobile-web-dist
        path: modules/apps/mobile/dist
