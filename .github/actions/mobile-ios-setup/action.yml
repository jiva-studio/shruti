name: Mobile iOS setup
description: >
  Xcode + Node + Ruby + bundler + npm deps + web artifact + Swift Package
  Manager cache. Shared setup for any job that runs Fastlane / xcodebuild
  in the mobile iOS project. The project is SPM-based — no CocoaPods.

# Xcode version pin. Capacitor 8 requires Xcode 26+ (ionic-team/capacitor#8290).
# Apple advances the App Store minimum ~yearly; check
# https://developer.apple.com/news/?id=fxu2qp7b before bumping.
inputs:
  xcode-version:
    description: Xcode version to select on the macOS runner.
    required: false
    default: "26.2"

runs:
  using: composite
  steps:
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ inputs.xcode-version }}

    - uses: actions/setup-node@v5
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: modules/apps/mobile/package-lock.json

    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: "3.3"
        bundler-cache: true
        working-directory: modules/apps/mobile

    - shell: bash
      run: cd modules/apps/mobile && npm ci --prefer-offline --no-audit

    - uses: actions/download-artifact@v5
      with:
        name: mobile-web-dist
        path: modules/apps/mobile/dist

    # Cache SwiftPM resolved dependencies so incremental CI builds skip
    # re-downloading Capacitor's swift-pm packages on every run. The key
    # rolls when CapApp-SPM/Package.swift changes (new plugin / Capacitor
    # bump), matching our cache-busting needs.
    - uses: actions/cache@v4
      with:
        path: |
          ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          ~/Library/Caches/org.swift.swiftpm
        key: ${{ runner.os }}-spm-${{ hashFiles('modules/apps/mobile/ios/App/CapApp-SPM/Package.swift') }}
        restore-keys: ${{ runner.os }}-spm-
