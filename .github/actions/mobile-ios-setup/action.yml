name: Mobile iOS setup
description: >
  Xcode + Node + Ruby + bundler + npm deps + web artifact. Shared setup
  for any job that runs Fastlane / xcodebuild in the mobile iOS project.
  The project is SPM-based — no CocoaPods.

  No GitHub Actions caching anywhere in this action — the self-hosted
  mac-host runner persists ~/Library/Developer/Xcode (DerivedData,
  SourcePackages), ~/Library/Caches/org.swift.swiftpm, ~/.npm and the
  Ruby bundle across ephemeral cycles. GHA cache upload was hanging
  15+ min post-step at ~0.6 MB/s for ~1.8 GiB, with no payoff on a
  warm runner.

# Xcode version pin. Capacitor 8 requires Xcode 26+ (ionic-team/capacitor#8290).
# Apple advances the App Store minimum ~yearly; check
# https://developer.apple.com/news/?id=fxu2qp7b before bumping.
inputs:
  xcode-version:
    description: Xcode version to select on the macOS runner.
    required: false
    default: "26.4"

runs:
  using: composite
  steps:
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ inputs.xcode-version }}

    - uses: actions/setup-node@v5
      with:
        node-version: 24

    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: "3.3"
        bundler-cache: false
        working-directory: modules/apps/mobile

    - shell: bash
      run: cd modules/apps/mobile && bundle install --jobs 4 --retry 3

    - shell: bash
      run: cd modules/apps/mobile && npm ci --prefer-offline --no-audit

    - uses: actions/download-artifact@v5
      with:
        name: mobile-web-dist
        path: modules/apps/mobile/dist
