[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shruti-chat"
version = "0.1.0"
description = "Semantic chat over Shruti lecture transcripts"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Advaita Krishna Das", email = "advaita.krishna.das@gmail.com" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sse-starlette>=2.1",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "asyncpg>=0.30",
  "pgvector>=0.3.6",
  "litellm>=1.51",
  "openai>=1.50",                       # used for embeddings via OpenRouter
  "rapidfuzz>=3.10",
  "structlog>=24.4",
  "httpx>=0.27",
  "aiofiles>=24.1",
  "tenacity>=9.0",
  "reportlab>=4.2",
  # Redis client for the KV cache (L2). The L1 in-proc tier works
  # without it; if redis_url is unset the service falls back to L1 only.
  "redis>=5.0",
  # LangGraph multi-agent orchestration. langchain-openai gives ChatOpenAI
  # which speaks OpenRouter natively via base_url override.
  "langgraph>=0.2.50",
  "langchain-core>=0.3",
  "langchain-openai>=0.2",
  # JWT verification for the Authorization: Bearer header. Public key
  # only — the auth service holds the private half. RS256 forced.
  "PyJWT[crypto]>=2.8",
  # LLM observability + hot-reload prompts. Self-hosted instance lives
  # at langfuse.obs.eu.shruti.jiva.studio (see
  # docs/architecture/observability). Major version must match the
  # server (v3.x); the SDK is wire-compatible across patch releases.
  # When LANGFUSE_HOST is unset or the host is unreachable the
  # `prompt_with_fallback` helper falls back to the `.md` files under
  # `agent/prompts/` and the hardcoded `_ROUTER_SYSTEM_PROMPT` so the
  # service still serves traffic.
  "langfuse>=3.15.0,<4.0.0",
  "langchain>=0.3.0,<0.4.0",
  # Prometheus counters / gauges for ops dashboards. The chat service
  # does not (yet) expose a /metrics endpoint — counters land in the
  # default REGISTRY and are picked up by a future PR-5 scraper. Adding
  # the dep now avoids a second dependency bump when /metrics goes in.
  "prometheus-client>=0.20",
  # Language identification for the `language_match` auto-score. Covers all
  # UI locales (ru en uk sr es pt it de fr pl hu hi bn); the previous
  # Cyrillic-vs-Latin heuristic could only tell ru from en. Seed is pinned
  # at import time (auto_scores.py) for reproducible scores.
  "langdetect>=1.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.7",
  # `[lua]` pulls lupa so fakeredis can execute the rate-limiter's Lua
  # scripts; without it those tests skip instead of covering the scripts.
  "fakeredis[lua]>=2.26",
]
# Optional tracing via LangSmith. Off unless LANGSMITH_API_KEY is set.
tracing = ["langsmith>=0.1"]
# Stage 2 (turn checkpointing) — pulled when we wire resumable SSE.
checkpoint = ["langgraph-checkpoint-sqlite>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/shruti_chat"]

[tool.ruff]
line-length = 100
target-version = "py312"

# `select` is spelled out on purpose, and the lane pins an exact ruff (see
# `.github/workflows/services-chat-tests.yml`): ruff's DEFAULT rule set has
# grown a lot across releases — on the version pinned today an unconfigured
# `ruff check` reports 560 findings, so a lane relying on the default would go
# red on a ruff release rather than on a code change.
#
# The gating set is pyflakes (real bugs: undefined names, redefinitions, dead
# locals, bad format strings) plus E9 (syntax / IO errors). It is green as of
# this commit and blocking. Everything else — import sorting, pyupgrade,
# bugbear, line length — is reported by the advisory step in the ruff lane and
# is not a gate yet; adopt those rule-by-rule as the debt is paid down.
#
# Nothing is ignored here on purpose. F401 (unused import) had 56 pre-existing
# hits; they carry a per-line `# noqa: F401` instead, because a project-wide
# `ignore` is not a baseline — it is a permanent mute that swallows every
# unused import written from now on, which is most of what the lane is for.
# The markers are a to-do list: some cover real re-exports that call sites
# depend on (`agent/graph/nodes/_worker_common.py`), others just mark dead
# imports that can be deleted outright. Drop them file by file.
[tool.ruff.lint]
select = ["E9", "F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
source_pkgs = ["shruti_chat"]
# Plain statement coverage: the per-package floors below were measured this
# way, and turning on branch coverage would move every number at once.
branch = false
relative_files = true

[tool.coverage.report]
precision = 1
show_missing = false

# Per-package floors, enforced by `scripts/check_coverage_floors.py`.
#
# A single global target is not what was missing here: overall coverage was a
# respectable 76.7% while whole packages sat near zero, because a big
# well-tested package pays for a small untested one. A floor per package is
# what would have failed the PR that introduced those packages.
#
# Each floor is set a couple of points UNDER the value measured at the commit
# that introduced this file (the trailing comment on each line is that measured
# value), so the lane is green on day one and normal churn does not trip it.
# They are meant to RATCHET: when a package's real coverage rises, raise its
# floor to just under the new value. Never lower one to make CI green — that is
# the failure the floors exist to catch.
#
# `_total_` is the whole-service rollup, `_root_` the modules sitting directly
# in `src/shruti_chat/`, and `_default_` applies to any package not named
# here — so a NEW package cannot land at 0% unnoticed.
[tool.coverage_floors]
_total_ = 75.0
_default_ = 50.0
_root_ = 69.0
sanskrit = 98.0    # 100.0
domain = 93.0      # 94.9
research = 88.0    # 90.4
application = 86.0 # 88.1
agent = 81.0       # 83.0
api = 78.0         # 80.9
observability = 67.0 # 69.5
infra = 59.0       # 61.3
indexer = 48.0     # 50.3
db = 39.0          # 40.9
lecture_search = 36.0 # 38.8
