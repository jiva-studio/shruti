[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shruti-chat"
version = "0.1.0"
description = "Semantic chat over Shruti lecture transcripts"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Advaita Krishna Das", email = "advaita.krishna.das@gmail.com" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sse-starlette>=2.1",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "asyncpg>=0.30",
  "pgvector>=0.3.6",
  "litellm>=1.51",
  "openai>=1.50",                       # used for embeddings via OpenRouter
  "boto3>=1.35",
  "rapidfuzz>=3.10",
  "structlog>=24.4",
  "httpx>=0.27",
  "aiofiles>=24.1",
  "tenacity>=9.0",
  "reportlab>=4.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/shruti_chat"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
