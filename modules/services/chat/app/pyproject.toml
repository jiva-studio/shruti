[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shruti-chat"
version = "0.1.0"
description = "Semantic chat over Shruti lecture transcripts"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Advaita Krishna Das", email = "advaita.krishna.das@gmail.com" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sse-starlette>=2.1",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "asyncpg>=0.30",
  "pgvector>=0.3.6",
  "litellm>=1.51",
  "openai>=1.50",                       # used for embeddings via OpenRouter
  "boto3>=1.35",
  "rapidfuzz>=3.10",
  "structlog>=24.4",
  "httpx>=0.27",
  "aiofiles>=24.1",
  "tenacity>=9.0",
  "reportlab>=4.2",
  # Redis client for the KV cache (L2). The L1 in-proc tier works
  # without it; if redis_url is unset the service falls back to L1 only.
  "redis>=5.0",
  # LangGraph multi-agent orchestration. langchain-openai gives ChatOpenAI
  # which speaks OpenRouter natively via base_url override.
  "langgraph>=0.2.50",
  "langchain-core>=0.3",
  "langchain-openai>=0.2",
  # JWT verification for the Authorization: Bearer header. Public key
  # only — the auth service holds the private half. RS256 forced.
  "PyJWT[crypto]>=2.8",
  # LLM observability + hot-reload prompts. Self-hosted instance lives
  # at langfuse.obs.eu.shruti.akdasa.studio (see
  # docs/architecture/observability). Major version must match the
  # server (v3.x); the SDK is wire-compatible across patch releases.
  # When LANGFUSE_HOST is unset or the host is unreachable the
  # `prompt_with_fallback` helper falls back to the `.md` files under
  # `agent/prompts/` and the hardcoded `_ROUTER_SYSTEM_PROMPT` so the
  # service still serves traffic.
  "langfuse>=3.15.0,<4.0.0",
  "langchain>=0.3.0,<0.4.0",
  # Prometheus counters / gauges for ops dashboards. The chat service
  # does not (yet) expose a /metrics endpoint — counters land in the
  # default REGISTRY and are picked up by a future PR-5 scraper. Adding
  # the dep now avoids a second dependency bump when /metrics goes in.
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "fakeredis>=2.26",
]
# Optional tracing via LangSmith. Off unless LANGSMITH_API_KEY is set.
tracing = ["langsmith>=0.1"]
# Stage 2 (turn checkpointing) — pulled when we wire resumable SSE.
checkpoint = ["langgraph-checkpoint-sqlite>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/shruti_chat"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
