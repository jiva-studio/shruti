# Production stack on Hetzner VPS.
# Brings up: postgres (pgvector) + chat (FastAPI) + caddy (TLS termination via sslip.io).
#
# Usage (on the server, after rsync):
#   docker compose up -d --build
#
# Env file: ../.env (created by deploy.sh from the local template).

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: chat
    # HNSW is RAM-hungry: default shared_buffers=128 MB pushes the
    # index to disk and per-search latency balloons to 300-1000 ms.
    # Bumping to 2 GB pins the chunks-table HNSW index in memory on
    # an 8 GB VPS and drops ANN search to 30-150 ms p50.
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=5GB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - max_connections=50
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - jit=off
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF on so the (hot) router/embed_query/title caches survive
    # restarts and rebuilds; `everysec` is the cheap default and the
    # extra sub-second of write loss on crash doesn't matter for cache.
    # 1 GB cap with allkeys-lru: dominated by embed_query (~4 KB each
    # compressed) so ~250k entries fit, well past expected churn.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 1gb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  chat:
    image: lectorium-chat:prod
    restart: unless-stopped
    build:
      context: ../../..
      dockerfile: services/chat/Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://chat:${POSTGRES_PASSWORD}@postgres:5432/chat
      CATALOG_DIR: /var/lib/chat
      REDIS_URL: redis://redis:6379/0
    volumes:
      - chatdata:/var/lib/chat
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 40
      start_period: 60s

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"            # HTTP/3
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - chat

volumes:
  pgdata:
  chatdata:
  caddydata:
  caddyconfig:
  redisdata:
