# Production stack on Hetzner VPS.
# Brings up: postgres (pgvector) + chat (FastAPI) + caddy (TLS termination via sslip.io).
#
# Usage (on the server, after rsync):
#   docker compose up -d --build
#
# Env file: ../.env (created by deploy.sh from the local template).

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: chat
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 5s
      timeout: 3s
      retries: 30

  chat:
    image: shruti-chat:prod
    restart: unless-stopped
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://chat:${POSTGRES_PASSWORD}@postgres:5432/chat
      CATALOG_DIR: /var/lib/chat
    volumes:
      - chatdata:/var/lib/chat
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 40
      start_period: 60s

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"            # HTTP/3
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - chat

volumes:
  pgdata:
  chatdata:
  caddydata:
  caddyconfig:
