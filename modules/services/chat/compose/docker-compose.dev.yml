# Local development stack. Production uses Fly.io.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 5s
      timeout: 3s
      retries: 20

  chat:
    image: lectorium-chat:dev
    build:
      context: ../../..
      dockerfile: services/chat/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://chat:chat@postgres:5432/chat
      CATALOG_DIR: /var/lib/chat
    volumes:
      - chatdata:/var/lib/chat
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  chatdata:
