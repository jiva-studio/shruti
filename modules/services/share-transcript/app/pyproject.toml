[project]
name = "shruti-share-transcript"
version = "0.1.0"
description = "Shruti share-transcript — renders printable transcript PDFs on demand and caches them in the storage zone."
requires-python = ">=3.12"
authors = [{ name = "Advaita Krishna Das", email = "advaita.krishna.das@gmail.com" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "httpx>=0.27",
  "reportlab>=4.2",
  "litellm>=1.51",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"share_transcript.render" = ["fonts/*.ttf"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.uv]
required-version = "==0.11.29"
