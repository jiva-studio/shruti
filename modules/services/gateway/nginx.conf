# user  nginx;
worker_processes auto;

error_log /dev/stderr;
# error_log /workspaces/shruti/data/gateway/logs/error.log warn;

pid /workspaces/shruti/data/gateway/temp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  client_body_temp_path /workspaces/shruti/data/gateway/temp;
  proxy_temp_path /workspaces/shruti/data/gateway/temp;
  fastcgi_temp_path /workspaces/shruti/data/gateway/temp;
  uwsgi_temp_path /workspaces/shruti/data/gateway/temp;
  scgi_temp_path /workspaces/shruti/data/gateway/temp;

  charset utf-8;
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent"';

  # access_log /workspaces/shruti/data/gateway/logs/access.log;
  access_log /dev/stdout main;

  sendfile on;
  keepalive_timeout 65;

  include ./servers/shruti.dev/shruti.dev.conf;
  include ./servers/shruti.dev/api.shruti.dev.conf;
  include ./servers/shruti.dev/admin.shruti.dev.conf;
  include ./servers/shruti.dev/airflow.shruti.dev.conf;
  include ./servers/shruti.dev/couchdb.shruti.dev.conf;
  include ./servers/shruti.dev/mobile.shruti.dev.conf;
}