server {
  listen 443 ssl;
  server_name shruti.dev;

  ssl_certificate /workspaces/shruti/data/gateway/certs/shruti.dev/shruti.dev.crt;
  ssl_certificate_key /workspaces/shruti/data/gateway/certs/shruti.dev/shruti.dev.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers 'HIGH:!aNULL:!MD5';

  root /workspaces/shruti/modules/apps/landing;
  index index.html;

  location / {
    try_files $uri $uri/ =404;
  }
}