service: shruti-share-audio

frameworkVersion: "3"

provider:
  name: yandex-cloud
  runtime: python311
  httpApi:
    payload: "1.0"

package:
  patterns:
    - "!**"
    - handler.py
    - storage.py
    - event_adapter.py
    - requirements.txt
    - layers/ffmpeg/bin/ffmpeg

functions:
  cut:
    handler: handler.handler
    memorySize: 1024
    timeout: 600
    serviceAccount: ${env:YC_SERVICE_ACCOUNT_ID}
    environment:
      BUCKET: shruti-engine
      EXCERPTS_PREFIX: ${env:EXCERPTS_PREFIX, "public/shares/audio"}
      EXCERPTS_PUBLIC_BASE: https://cdn-ru.shruti.local
      FFMPEG_BIN: /function/code/layers/ffmpeg/bin/ffmpeg
      # YC Object Storage (S3-compatible) — own bucket, YC static keys.
      S3_ENDPOINT_URL: https://storage.yandexcloud.net
      AWS_REGION: ru-central1
      AWS_ACCESS_KEY_ID: ${env:YC_RUNTIME_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${env:YC_RUNTIME_SECRET_ACCESS_KEY}

plugins:
  - "@yandex-cloud/serverless-plugin"
