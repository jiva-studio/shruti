service: shruti-share-video

frameworkVersion: "3"

provider:
  name: aws
  runtime: nodejs20.x
  region: ${env:AWS_REGION, "us-east-1"}
  # Lambda has no separate CPU knob — vCPU count scales with memory.
  # 10240 MB ≈ 6 vCPUs (vs ~1.7 at 3008 MB). x264 -preset fast benefits ~2-3x
  # from the extra cores on a 1080x1920 reel; render is the dominant phase.
  memorySize: 10240
  timeout: 900
  architecture: x86_64
  httpApi:
    cors:
      allowedOrigins:
        - "*"
      allowedMethods:
        - POST
        - OPTIONS
      allowedHeaders:
        - Content-Type
      maxAge: 600
  environment:
    BUCKET: shruti-engine
    OUTPUT_PREFIX: ${env:OUTPUT_PREFIX, "public/share/video"}
    BACKGROUNDS_PREFIX: ${env:BACKGROUNDS_PREFIX, "private/share/video/backgrounds"}
    FFMPEG_BIN: /opt/bin/ffmpeg
    FFPROBE_BIN: /opt/bin/ffprobe
    TRANSCRIBER: whisper
    OPENAI_API_KEY: ${env:OPENAI_API_KEY}
    # AWS HTTP API caps integration timeout at 30s, but render takes 30-90s.
    # The HTTP-mode handler dispatches the work as an async self-invoke
    # (InvocationType=Event) and returns 202 immediately with the predicted
    # output URL; the client polls S3 until the file appears. Worker mode
    # is the same Lambda re-entered with __share_video_worker__: true.
    RENDER_DISPATCH: self-invoke
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:ListBucket
          Resource: arn:aws:s3:::shruti-engine
          Condition:
            StringLike:
              s3:prefix:
                - "private/share/video/backgrounds/*"
        - Effect: Allow
          Action:
            - s3:GetObject
          Resource:
            - arn:aws:s3:::shruti-engine/private/share/video/backgrounds/*
            - arn:aws:s3:::shruti-engine/public/tracks/*
            - arn:aws:s3:::shruti-engine/public/shares/*
        - Effect: Allow
          Action:
            - s3:HeadObject
            - s3:PutObject
            - s3:PutObjectAcl
          Resource: arn:aws:s3:::shruti-engine/public/share/video/*
        # Self-invoke for the async render dispatch (HTTP-mode → worker-mode).
        # Account ID resolved at deploy time via the AWS CLI's caller identity.
        - Effect: Allow
          Action:
            - lambda:InvokeFunction
          Resource:
            - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${sls:stage}-reels"

package:
  patterns:
    - "!**/*.md"
    - "!**/*.ts"
    - "!**/test/**"
    - "!**/tests/**"
    - "!**/__tests__/**"
    - "!.serverless/**"
    - "!.gitignore"
    - "!layers/**"
    - "!scripts/**"
    - "!serverless*.yml"
    - "!tsconfig.json"
    - "!package*.json"
    - "!input/**"
    - "!output/**"
    - "!node_modules/.cache/**"
    - "!node_modules/typescript/**"
    - "!node_modules/ts-node/**"
    - "!node_modules/@types/**"
    - "!node_modules/.bin/**"
    - "!node_modules/serverless/**"
    - "!node_modules/serverless-*/**"
    - "!node_modules/@yandex-cloud/**"
    - "!node_modules/@napi-rs/canvas-linux-x64-musl/**"

functions:
  reels:
    handler: dist/handler.handler
    ephemeralStorageSize: 4096
    layers:
      - { Ref: FfmpegLambdaLayer }
    events:
      - httpApi:
          method: POST
          path: /reels

layers:
  ffmpeg:
    name: shruti-share-video-ffmpeg
    path: layers/ffmpeg
    description: Static ffmpeg + ffprobe binaries at /opt/bin/
    compatibleRuntimes:
      - nodejs20.x
