<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="template.css">
</head>
<body>
  <div class="stage" id="stage">
    <h1 id="title"></h1>
    <div class="phone"><div class="screen"><img id="shot" alt=""></div></div>
  </div>
  <script>
    const p = new URLSearchParams(location.search);
    const device = p.get("device") || "phone";
    document.getElementById("stage").classList.add("device-" + device);
    document.getElementById("title").textContent = p.get("title") || "";
    document.getElementById("shot").src = p.get("shot") || "";
  </script>
</body>
</html>
