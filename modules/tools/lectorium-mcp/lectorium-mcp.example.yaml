# lectorium-mcp — example configuration.
#
# Copy to lectorium-mcp.yaml and adjust paths. The server reads
# ./lectorium-mcp.yaml from cwd by default; override with --config <path>.
# The home directory is intentionally NOT searched — config + secrets
# belong to the project tree (see README "Configuration" for details).
#
# Daemon mode is the only mode. CLI flags (overridable per-launch):
#   -addr 127.0.0.1:8081           # MCP HTTP listen address
#   -workers 4                     # file-level worker pool size
#   -transcribe-concurrency 2      # concurrent transcribe calls (M-box cap)
# See `make up/down/restart/status/logs` for lifecycle.
#
# Environment variable substitution: any ${VAR} is replaced from os.Getenv at
# load time (empty if unset). Use ~ to refer to your home dir.

# ──────────────────────────────────────────────────────────────────────────
# Required: paths
# ──────────────────────────────────────────────────────────────────────────

# Source mp3 lake. The server scans this tree for *.mp3 — any directory layout
# under here is fine; track ids are minted from the absolute path on first
# ingest and persisted in artifacts/lake/index.db.
#
# When pointed at the dedup pipeline output (resources/lake-in/dedup.py), use
# the `outbox/sorted/` path — filenames there match the canonical naming
# convention and the metadata extractor parses them deterministically without
# calling the LLM. The selector resolver automatically skips the sibling
# `outbox/duplicates/` tree, so you can safely point `in:` at the parent
# `outbox/` directory if you prefer.
in:  /home/akd/lake/incoming

# Output tree. Mirrors the public S3 bucket byte-for-byte. Two top-level dirs:
#   public/    — what the mobile app reads
#   artifacts/ — internal-only (raw transcripts, source mp3, lake index, catalog DB)
# `aws s3 sync out/ s3://akds-lectorium/` publishes everything.
out: /home/akd/lake/processed

# ──────────────────────────────────────────────────────────────────────────
# Optional defaults
# ──────────────────────────────────────────────────────────────────────────

# Override the lake registry DB location. Default: <out>/artifacts/lake/index.db.
# Recommended to leave unset so it stays inside the publishable artifacts tree.
# db: ""

# Override the run registry DB location (async runs from pipeline.run /
# catalog.publish; survives daemon restarts, non-terminal rows reconciled
# to state=failed, error="daemon restart" on boot). Default:
# <out>/artifacts/lake/runs.db.
# runs_db: ""

# Default ISO-639 code used by transcript_create / metadata_extract / commit
# when the caller omits `language`. Most lectures are Russian.
default_language: ru

# ──────────────────────────────────────────────────────────────────────────
# CDN — used by catalog_refresh (anonymous HTTPS GET)
# ──────────────────────────────────────────────────────────────────────────
cdn:
  # Where to GET public/config.json and public/db/lectorium.{ver}.db from.
  # Defaults to AWS; switch to Yandex if you want.
  read_base_url: https://akds-lectorium.s3.us-east-1.amazonaws.com
  # Alt: https://akds-lectorium.storage.yandexcloud.net

# ──────────────────────────────────────────────────────────────────────────
# S3 — used by catalog_publish (write)
# ──────────────────────────────────────────────────────────────────────────
# Credentials may be left empty: the AWS SDK falls back to its default chain
# (env / shared config / SSO / IMDS), which is the right path for `aws sso login`
# workflows. Yandex requires explicit creds (no chain).
s3:
  aws:
    bucket:            ${S3_AWS_BUCKET}                       # e.g. akds-lectorium
    region:            ${S3_AWS_REGION}                       # e.g. us-east-1
    access_key_id:     ${S3_AWS_ACCESS_KEY_ID}
    secret_access_key: ${S3_AWS_SECRET_ACCESS_KEY}
  yandex:
    bucket:            ${S3_YANDEX_BUCKET}                    # leave unset to skip mirror
    region:            ${S3_YANDEX_REGION}                    # default: ru-central1
    endpoint:          ${S3_YANDEX_ENDPOINT}                  # default: https://storage.yandexcloud.net
    access_key_id:     ${S3_YANDEX_ACCESS_KEY_ID}
    secret_access_key: ${S3_YANDEX_SECRET_ACCESS_KEY}
    force_path_style:  true                                   # required for Yandex Object Storage
  # Bunny.net Edge Storage mirror (NOT S3 — plain HTTP API, AccessKey header).
  # Enabled when `zone` is set. access_key is the storage-zone password.
  bunny:
    zone:              ${S3_BUNNY_ZONE}                       # leave unset to skip; e.g. akds-lectorium-eu
    endpoint:          ${S3_BUNNY_ENDPOINT}                   # default: https://storage.bunnycdn.com
    access_key:        ${S3_BUNNY_ACCESS_KEY}                 # storage-zone password

# ──────────────────────────────────────────────────────────────────────────
# ffmpeg / ffprobe — audio_normalize + ffprobe-based audio.Probe
# ──────────────────────────────────────────────────────────────────────────
ffmpeg:
  # Path to ffmpeg binary. ffprobe is auto-discovered in the same directory.
  # Re-encode is fixed at 128 kbps CBR LAME, channels preserved, no loudness
  # processing (raw passthrough of dynamics — avoids amplifying tape hiss /
  # room noise on archival recordings).
  bin: ffmpeg

# ──────────────────────────────────────────────────────────────────────────
# Denoiser — track.audio.denoise (produces clean.mp3 + track_audio kind=clean)
# ──────────────────────────────────────────────────────────────────────────
denoiser:
  # Interpreter that has the denoise deps (pyrnnoise, pydub, soundfile, numpy,
  # scipy). A venv python is recommended. Default: python3.
  python_bin: python3
  # Path to the audio-denoiser script (single-file --in/--out mode).
  script: ../audio-denoiser/denoise_mp3.py

# ──────────────────────────────────────────────────────────────────────────
# Transcribe — transcript_create
# ──────────────────────────────────────────────────────────────────────────
# Multiple providers can coexist; `default` selects the one used when
# transcript_create is called without an explicit `provider`. Each entry
# is a discriminated union — `kind` picks the adapter, remaining fields are
# kind-specific.
#
# Output is parsed into transcript.Raw (sorted, deduped, overlap-trimmed,
# linear Idx, with avg word-confidence per segment) and atomically written
# to: out/artifacts/tracks/{id}/transcripts/{lang}/raw.json
transcribe:
  default: transcriber-service
  providers:
    # LAN-local Apple-Silicon transcriber (Parakeet-TDT-0.6b on ANE via
    # FluidAudio). Currently the only supported transcribe backend.
    transcriber-service:
      kind:     transcriber-service
      endpoint: http://192.168.0.17:8080
    # Future providers go here, e.g.:
    # openai:
    #   kind:     openai
    #   model:    whisper-1
    #   api_key:  ${OPENAI_API_KEY}
    #   endpoint: ""

# ──────────────────────────────────────────────────────────────────────────
# Review (LLM proofreading) — transcript_review
# ──────────────────────────────────────────────────────────────────────────
# Every chunk is sent as [{idx, text}, ...]; the response must return the
# same idx set; we re-attach Start/End from the original raw output. On
# idx-set mismatch the chunk is retried up to `retries` times, then falls
# back to the original text and the affected idx are recorded in
# artifacts/.../review.json.
#
# All providers go through the same OpenAI-compatible adapter — point
# `endpoint` at OpenRouter (recommended), native OpenAI, or a local
# OpenAI-compatible server (Ollama, vLLM). Set OPENROUTER_API_KEY in .env.
review:
  # Per-language attempt CHAIN. Each entry is one attempt:
  #   length 1 = single-pass review
  #   length 2 = hybrid (first cheap, second premium on low-conf islands)
  # The use case tries entries in order; an attempt that fails the audit
  # gates falls through to the next, and the final-attempt failure leaves
  # the chunk in degraded mode (raw text). Use "*" as a corpus-wide
  # fallback when a language isn't listed. transcript_review /
  # pipeline_run accept `models=` / `review_models=` to override per-call
  # (no chain — those are ad-hoc one-shots).
  default:
    # Each attempt is one chain: [baseline, premium1, premium2, ...].
    # baseline runs on every chunk; premiums form a per-island fallback
    # (each next premium tried only on islands the previous one rejected).
    # 1-element = single pass.
    en:
      - models: [gemini-3.1-flash-lite, gemini-3-flash-preview, gemini-3.1-pro-preview]
        premium_min_chars: 20
      - models: [gemini-3-flash-preview]    # solo fallback if hybrid attempt failed
      - models: [anthropic/claude-haiku-4.5]
    ru:
      - models: [gemini-3.1-flash-lite, gemini-3-flash-preview, gemini-3.1-pro-preview]
        premium_min_chars: 20
      - models: [gemini-3-flash-preview]    # solo fallback if hybrid attempt failed
      - models: [anthropic/claude-haiku-4.5]

  chunk_size: 50            # raw segments per LLM call (~5–8 min audio)
  overlap: 4                # segments duplicated between adjacent chunks
  retries: 1                # 1 retry catches transient hiccups (occasional flake); 2+ keeps spending money on deterministic failures since same input → same broken output.
  concurrency: 3            # per-track parallel chunks; multiplied by worker pool size

  # Global cap on simultaneous LLM calls across the worker pool. Prevents
  # 429s when batch runs push hundreds of chunks back-to-back.
  max_concurrent_llm: 6

  # Hybrid-mode knobs (active when models has 2 elements).
  hybrid:
    threshold: 0.70         # segments below this confidence are "low-conf"
    expand: 2               # extra segments of context around each island
    premium_min_chars: 20   # skip premium when an island's low-conf segments
                            # sum to < N characters — pro can't fix "..." or
                            # "Да." and we'd waste $0.02-0.03 per call. 0=disabled.

  # Optional: deterministic sentence splitter (razdel subprocess).
  # When script_path is set, the use case computes sentence boundaries
  # from the corrected text instead of trusting the LLM's own grouping.
  # Razdel handles Russian abbreviations, initials, decimals, and
  # quoted Sanskrit verses correctly. Requires `pip install razdel` on
  # the python interpreter.
  sentencer:
    python_bin:  python3
    script_path: /path/to/lectorium-mcp/scripts/sentencesplit/razdel.py

  # Each entry registers one OpenAI-compatible upstream. Aliases (the map
  # keys) are what shows up in chunk_NNNN.json::models[].name and what you
  # pass to transcript_review models=…
  providers:
    gemini-3-flash-preview:
      endpoint:   https://openrouter.ai/api/v1
      api_key:    ${OPENROUTER_API_KEY}
      model:      google/gemini-3-flash-preview
      max_tokens: 4096
      reasoning:  off       # off = send reasoning.max_tokens=0; on = upstream default

    gemini-3.1-flash-lite:
      endpoint:   https://openrouter.ai/api/v1
      api_key:    ${OPENROUTER_API_KEY}
      model:      google/gemini-3.1-flash-lite
      max_tokens: 4096
      reasoning:  off

    gemini-3.1-pro-preview:
      endpoint:   https://openrouter.ai/api/v1
      api_key:    ${OPENROUTER_API_KEY}
      model:      google/gemini-3.1-pro-preview
      max_tokens: 8192
      # reasoning accepts: "" (upstream default), off, on, low, medium,
      # high, or a numeric token cap like 500. Pro reasoning often
      # dominates cost (50-90% of completion tokens) — capping pays off.
      reasoning:  500

    # Local Ollama example (uncomment + adjust):
    # llama-3.3-8b:
    #   endpoint:   http://localhost:11434/v1
    #   api_key:    ollama
    #   model:      llama3.3:8b-instruct-q4_K_M
    #   max_tokens: 4096

# ──────────────────────────────────────────────────────────────────────────
# Resolver (LLM dictionary mapping) — *_find tools, metadata_extract chain
# ──────────────────────────────────────────────────────────────────────────
# Maps raw author/location/source strings parsed from filenames to catalog
# IDs. exact-match wins first (free); otherwise the LLM is consulted with a
# top-N candidate list. Results are cached in artifacts/lake/index.db so the
# same string isn't re-resolved over and over.
#
# Haiku 4.5 is the default — short candidate list, simple match decision.
# Same OpenAI-compatible adapter as review.
resolver:
  default: claude-haiku-4-5
  candidates_top_n: 30      # how many candidates from the dict get sent to the LLM
  providers:
    claude-haiku-4-5:
      endpoint:   https://openrouter.ai/api/v1
      api_key:    ${OPENROUTER_API_KEY}
      model:      anthropic/claude-haiku-4.5
      max_tokens: 1024

# ──────────────────────────────────────────────────────────────────────────
# Metadata extractor — metadata_extract
# ──────────────────────────────────────────────────────────────────────────
# Sonnet 4.6 — needs nuance for date parsing, references and language hints.
# Same OpenAI-compatible adapter as review/resolver.
metadata:
  endpoint:   https://openrouter.ai/api/v1
  api_key:    ${OPENROUTER_API_KEY}
  model:      anthropic/claude-sonnet-4.6
  max_tokens: 1024

# Outline + description generation (track.transcript.outline / pipeline.run
# op=outline). The whole reviewed transcript goes to the model in one pass:
# a granular topic pass + collapse to <=8 chapters, plus a short description.
# Same OpenAI-compatible adapter as review/metadata. Leave api_key empty to
# disable the feature. Gemini flash balances cost and quality across the
# 2-3 calls per lecture; bump to a pro model if outline quality needs it.
outline:
  endpoint:   https://openrouter.ai/api/v1
  api_key:    ${OPENROUTER_API_KEY}
  model:      google/gemini-3-flash-preview
  max_tokens: 2048
  reasoning:  off
