- canonical: { ru: "Маяпур",                   en: "Māyāpur" }
  category: place
  # 6-letter toponym — trigram overlap collapses on single-char whisper
  # mis-hears (Майяпур / Майапур / Майпур all score 0.500 vs canonical
  # «Маяпур», below default threshold 0.55). Aliases widen the index
