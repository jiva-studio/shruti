# Vaishnava terminology glossary — canonical forms for the review pipeline.
#
# Each entry has:
#   canonical:    map of ISO-639 lang → canonical form
#   category:     book | name | place | concept | mantra | role
#   hint:         optional one-liner shown to the LLM when this term is matched
#
# The fuzzy-matcher (internal/infra/glossary) builds char-trigram indices from
# the canonical forms and matches them against whisper-mangled chunk text. We
# never list "variants" here — different declensions, hyphenations, и whisper
# noise are caught by the trigram overlap, not by enumeration.

# ────────────── BOOKS ──────────────
