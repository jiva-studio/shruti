# What the Go modules are checked for, beyond gofmt and go vet.
#
# Most rules are the ordinary ones: an error dropped, a body left open, a
# context that did not survive the call. forbidigo and depguard are
# architecture rules: the domain does not know what time it is, the core does
# not panic or write to a stream of its own, and the inner layers do not
# import the outer ones or a storage/transport driver.
#
# Run from a module's own directory.

version: "2"

# Every build tag a file in the tree is guarded by, so no file escapes the
# linters by its constraint. scripts/check-go-build-tags.sh fails when a tag
# appears that is not listed here.
run:
  build-tags:
    - smoke

# A report that stops at three of a kind is a report that hides the fourth.
issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: none
  enable:
    - errcheck
    - nilerr
    - forbidigo
    - bodyclose
    - sqlclosecheck
    - rowserrcheck
    - contextcheck
    - noctx
    - exhaustive
    - usetesting
    - gocritic
    - nolintlint
    - staticcheck
    - unused
    - revive
    - depguard

  settings:
    depguard:
      # Each layer is an allow list (strict mode): an import not named under
      # `allow` is refused, so a new internal package re-exporting a driver
      # cannot carry it in. `deny` gives the refusals a reason and is what the
      # allowlist below matches on. Entries are import-path prefixes; a
      # trailing `$` makes one exact. Each layered module's own path is spelled
      # out. Tests are exempt: they wire real adapters on purpose.
      rules:
        domain:
          list-mode: strict
          files:
            - "**/internal/domain/**"
            - "!$test"
          allow:
            - bytes
            - cmp
            - context
            - crypto/sha256
            - embed
            - encoding/base64
            - encoding/hex
            - encoding/json
            - errors
            - fmt
            - hash
            - io
            - iter
            - maps
            - math$
            - math/bits
            - net/url
            - path$
            - regexp
            - slices
            - sort
            - strconv
            - strings
            - time
            - unicode
            - github.com/jiva-studio/shruti/discovery/internal/domain
            - github.com/jiva-studio/shruti/ingest/internal/domain
            - github.com/jiva-studio/shruti/orchestrator/internal/domain
            - github.com/jiva-studio/shruti/publish/internal/domain
            - github.com/jiva-studio/shruti-storage-sync/internal/domain
            - github.com/jiva-studio/shruti/modules/tools/shruti-mcp/internal/domain
            - github.com/jiva-studio/shruti/pipeline/transcript
          deny:
            - pkg: github.com/jiva-studio/shruti/discovery/internal/application
              desc: domain must not import application
            - pkg: github.com/jiva-studio/shruti/discovery/internal/infra
              desc: domain must not import infra
            - pkg: github.com/jiva-studio/shruti/discovery/internal/store
              desc: domain must not import store
            - pkg: github.com/jiva-studio/shruti/discovery/internal/pgvector
              desc: domain must not import pgvector
            - pkg: github.com/jiva-studio/shruti/discovery/internal/handler
              desc: domain must not import handler
            - pkg: github.com/jiva-studio/shruti/discovery/internal/wire
              desc: domain must not import wire
            - pkg: github.com/jiva-studio/shruti/ingest/internal/application
              desc: domain must not import application
            - pkg: github.com/jiva-studio/shruti/ingest/internal/infra
              desc: domain must not import infra
            - pkg: github.com/jiva-studio/shruti/ingest/internal/handler
              desc: domain must not import handler
            - pkg: github.com/jiva-studio/shruti/ingest/internal/wire
              desc: domain must not import wire
            - pkg: github.com/jiva-studio/shruti/orchestrator/internal/application
              desc: domain must not import application
            - pkg: github.com/jiva-studio/shruti/orchestrator/internal/infra
              desc: domain must not import infra
            - pkg: github.com/jiva-studio/shruti/orchestrator/internal/store
              desc: domain must not import store
            - pkg: github.com/jiva-studio/shruti/orchestrator/internal/handler
              desc: domain must not import handler
            - pkg: github.com/jiva-studio/shruti/orchestrator/internal/wire
              desc: domain must not import wire
            - pkg: github.com/jiva-studio/shruti-storage-sync/internal/application
              desc: domain must not import application
            - pkg: github.com/jiva-studio/shruti-storage-sync/internal/infra
              desc: domain must not import infra
            - pkg: github.com/jiva-studio/shruti-storage-sync/internal/handler
              desc: domain must not import handler
            - pkg: github.com/jiva-studio/shruti-storage-sync/internal/wire
              desc: domain must not import wire
            - pkg: github.com/jiva-studio/shruti/modules/tools/shruti-mcp/internal/application
              desc: domain must not import application
            - pkg: github.com/jiva-studio/shruti/modules/tools/shruti-mcp/internal/infra
              desc: domain must not import infra
            - pkg: github.com/jiva-studio/shruti/modules/tools/shruti-mcp/internal/mcp
              desc: domain must not import the MCP handlers
            - pkg: github.com/jiva-studio/shruti/modules/tools/shruti-mcp/internal/worker
              desc: domain must not import worker
            - pkg: github.com/jackc/pgx
              desc: domain must not know the database driver
            - pkg: github.com/redis
              desc: domain must not know the redis client
            - pkg: database/sql
              desc: domain must not know the database
            - pkg: net/http
              desc: domain must not know the transport
        ports:
          list-mode: strict
          files:
            - "**/internal/ports/**"
            - "!$test"
          allow:
            - bytes
            - cmp
            - context
            - crypto/sha256
            - embed
            - encoding/base64
            - encoding/hex
            - encoding/json
            - errors
            - fmt
            - hash
            - io
            - iter
            - maps
            - math$
            - math/bits
            - net/url
            - path$
            - regexp
            - slices
            - sort
            - strconv
            - strings
            - time
            - unicode
            - github.com/jiva-studio/shruti/discovery/internal/domain
            - github.com/jiva-studio/shruti/discovery/internal/ports
            - github.com/jiva-studio/shruti/ingest/internal/domain
            - github.com/jiva-studio/shruti/ingest/internal/ports
            - github.com/jiva-studio/shruti/orchestrator/internal/domain
            - github.com/jiva-studio/shruti/orchestrator/internal/ports
            - github.com/jiva-studio/shruti/publish/internal/domain
            - github.com/jiva-studio/shruti/publish/internal/ports
            - github.com/jiva-studio/shruti-storage-sync/internal/domain
            - github.com/jiva-studio/shruti-storage-sync/internal/ports
            - github.com/jiva-studio/shruti/modules/tools/shruti-mcp/internal/domain
            - github.com/jiva-studio/shruti/modules/tools/shruti-mcp/internal/ports
            - github.com/jiva-studio/shruti/pipeline/transcript
          deny:
            - pkg: github.com/jiva-studio/shruti/ingest/internal/application
              desc: ports must not import application
            - pkg: github.com/jiva-studio/shruti/ingest/internal/infra
              desc: ports must not import infra
            - pkg: github.com/jiva-studio/shruti/ingest/internal/handler
              desc: ports must not import handler
            - pkg: github.com/jiva-studio/shruti/ingest/internal/wire
              desc: ports must not import wire
            - pkg: github.com/jiva-studio/shruti/orchestrator/internal/application
              desc: ports must not import application
            - pkg: github.com/jiva-studio/shruti/orchestrator/internal/infra
              desc: ports must not import infra
            - pkg: github.com/jiva-studio/shruti/orchestrator/internal/store
              desc: ports must not import store
            - pkg: github.com/jiva-studio/shruti/orchestrator/internal/handler
              desc: ports must not import handler
            - pkg: github.com/jiva-studio/shruti/orchestrator/internal/wire
              desc: ports must not import wire
            - pkg: github.com/jiva-studio/shruti-storage-sync/internal/application
              desc: ports must not import application
            - pkg: github.com/jiva-studio/shruti-storage-sync/internal/infra
              desc: ports must not import infra
            - pkg: github.com/jiva-studio/shruti-storage-sync/internal/handler
              desc: ports must not import handler
            - pkg: github.com/jiva-studio/shruti-storage-sync/internal/wire
              desc: ports must not import wire
            - pkg: github.com/jiva-studio/shruti/modules/tools/shruti-mcp/internal/application
              desc: ports must not import application
            - pkg: github.com/jiva-studio/shruti/modules/tools/shruti-mcp/internal/infra
              desc: ports must not import infra
            - pkg: github.com/jiva-studio/shruti/modules/tools/shruti-mcp/internal/mcp
              desc: ports must not import the MCP handlers
            - pkg: github.com/jiva-studio/shruti/modules/tools/shruti-mcp/internal/worker
              desc: ports must not import worker
            - pkg: github.com/jackc/pgx
              desc: ports must not know the database driver
            - pkg: github.com/redis
              desc: ports must not know the redis client
            - pkg: database/sql
              desc: ports must not know the database
            - pkg: net/http
              desc: ports must not know the transport
        application:
          list-mode: strict
          files:
            - "**/internal/application/**"
            - "!$test"
          allow:
            - bytes
            - cmp
            - context
            - crypto/sha256
            - embed
            - encoding/base64
            - encoding/hex
            - encoding/json
            - encoding/xml
            - errors
            - fmt
            - hash
            - io
            - iter
            - log/slog
            - maps
            - math$
            - math/bits
            - math/rand
            - mime
            - net/url
            - os$
            - path$
            - path/filepath
            - regexp
            - runtime/debug
            - slices
            - sort
            - strconv
            - strings
            - sync
            - time
            - unicode
            - github.com/jiva-studio/shruti/discovery/internal/application
            - github.com/jiva-studio/shruti/discovery/internal/domain
            - github.com/jiva-studio/shruti/discovery/internal/ports
            - github.com/jiva-studio/shruti/ingest/internal/application
            - github.com/jiva-studio/shruti/ingest/internal/domain
            - github.com/jiva-studio/shruti/ingest/internal/ports
            - github.com/jiva-studio/shruti/orchestrator/internal/application
            - github.com/jiva-studio/shruti/orchestrator/internal/domain
            - github.com/jiva-studio/shruti/orchestrator/internal/ports
            - github.com/jiva-studio/shruti/publish/internal/application
            - github.com/jiva-studio/shruti/publish/internal/domain
            - github.com/jiva-studio/shruti/publish/internal/ports
            - github.com/jiva-studio/shruti-storage-sync/internal/application
            - github.com/jiva-studio/shruti-storage-sync/internal/domain
            - github.com/jiva-studio/shruti-storage-sync/internal/ports
            - github.com/jiva-studio/shruti/modules/tools/shruti-mcp/internal/application
            - github.com/jiva-studio/shruti/modules/tools/shruti-mcp/internal/domain
            - github.com/jiva-studio/shruti/modules/tools/shruti-mcp/internal/ports
            - github.com/jiva-studio/shruti/discovery/internal/clock
            - github.com/jiva-studio/shruti/discovery/internal/extract
            - github.com/jiva-studio/shruti/discovery/internal/logging
            - github.com/jiva-studio/shruti/discovery/internal/metrics
            - github.com/jiva-studio/shruti/publish/internal/pending
            - github.com/jiva-studio/shruti/pipeline
            - github.com/JohannesKaufmann/html-to-markdown/v2
            - github.com/dop251/goja
            - github.com/google/uuid
            - golang.org/x/net/html
            - golang.org/x/sync/errgroup
            - gopkg.in/yaml.v3
          deny:
            - pkg: github.com/jiva-studio/shruti/discovery/internal/infra
              desc: application must not import infra adapters
            - pkg: github.com/jiva-studio/shruti/discovery/internal/store
              desc: application must not import store
            - pkg: github.com/jiva-studio/shruti/discovery/internal/pgvector
              desc: application must not import pgvector
            - pkg: github.com/jiva-studio/shruti/discovery/internal/handler
              desc: application must not import handler
            - pkg: github.com/jiva-studio/shruti/discovery/internal/wire
              desc: application must not import wire
            - pkg: github.com/jiva-studio/shruti/ingest/internal/infra
              desc: application must not import infra adapters
            - pkg: github.com/jiva-studio/shruti/ingest/internal/handler
              desc: application must not import handler
            - pkg: github.com/jiva-studio/shruti/ingest/internal/wire
              desc: application must not import wire
            - pkg: github.com/jiva-studio/shruti/orchestrator/internal/infra
              desc: application must not import infra adapters
            - pkg: github.com/jiva-studio/shruti/orchestrator/internal/store
              desc: application must not import store
            - pkg: github.com/jiva-studio/shruti/orchestrator/internal/handler
              desc: application must not import handler
            - pkg: github.com/jiva-studio/shruti/orchestrator/internal/wire
              desc: application must not import wire
            - pkg: github.com/jiva-studio/shruti/publish/internal/infra
              desc: application must not import infra adapters
            - pkg: github.com/jiva-studio/shruti/publish/internal/store
              desc: application must not import store
            - pkg: github.com/jiva-studio/shruti/publish/internal/handler
              desc: application must not import handler
            - pkg: github.com/jiva-studio/shruti/publish/internal/wire
              desc: application must not import wire
            - pkg: github.com/jiva-studio/shruti-storage-sync/internal/infra
              desc: application must not import infra adapters
            - pkg: github.com/jiva-studio/shruti-storage-sync/internal/handler
              desc: application must not import handler
            - pkg: github.com/jiva-studio/shruti-storage-sync/internal/wire
              desc: application must not import wire
            - pkg: github.com/jiva-studio/shruti/modules/tools/shruti-mcp/internal/infra
              desc: application must not import infra adapters
            - pkg: github.com/jiva-studio/shruti/modules/tools/shruti-mcp/internal/mcp
              desc: application must not import the MCP handlers
            - pkg: github.com/jiva-studio/shruti/modules/tools/shruti-mcp/internal/worker
              desc: application must not import worker
            - pkg: github.com/jackc/pgx
              desc: application must not know the database driver — take a port
            - pkg: github.com/redis
              desc: application must not know the redis client — take a port
            - pkg: database/sql
              desc: application must not know the database — take a port
            - pkg: github.com/mattn/go-sqlite3
              desc: application must not know the database — take a port
            - pkg: net/http
              desc: application must not know the transport — take a port
        pipeline:
          files:
            - "**/libs/pipeline/**"
            - "!$test"
          deny:
            - pkg: github.com/jackc/pgx
              desc: the pipeline library does not touch a database
            - pkg: github.com/redis
              desc: the pipeline library does not touch redis
            - pkg: database/sql
              desc: the pipeline library does not touch a database
        pipeline-ports:
          list-mode: strict
          files:
            - "**/libs/pipeline/ports/**"
            - "!$test"
          allow:
            - bytes
            - cmp
            - context
            - crypto/sha256
            - embed
            - encoding/base64
            - encoding/hex
            - encoding/json
            - errors
            - fmt
            - hash
            - io
            - iter
            - maps
            - math$
            - math/bits
            - net/url
            - path$
            - regexp
            - slices
            - sort
            - strconv
            - strings
            - time
            - unicode
            - github.com/jiva-studio/shruti/pipeline/ports
            - github.com/jiva-studio/shruti/pipeline/transcript
          deny:
            - pkg: github.com/jiva-studio/shruti/pipeline/openaicompat
              desc: ports must not import an adapter
            - pkg: github.com/jiva-studio/shruti/pipeline/transcriber
              desc: ports must not import an adapter
            - pkg: github.com/jiva-studio/shruti/pipeline/review
              desc: ports must not import an adapter
            - pkg: github.com/jiva-studio/shruti/pipeline/translate
              desc: ports must not import an adapter
            - pkg: github.com/jiva-studio/shruti/pipeline/outline
              desc: ports must not import an adapter
            - pkg: github.com/jiva-studio/shruti/pipeline/glossary
              desc: ports must not import an adapter
            - pkg: github.com/jiva-studio/shruti/pipeline/metadata
              desc: ports must not import an adapter
            - pkg: net/http
              desc: ports must not know the transport

    errcheck:
      # A type assertion that fails is a panic, and the core does not panic.
      check-type-assertions: true
      # `_ = f()` and `v, _ := f()` drop an error as surely as a bare call.
      check-blank: true
      # Rolling back a transaction that already committed is how the pattern
      # is written; the error it returns says only that. A failed write to a
      # response whose status is already sent has nobody left to tell.
      exclude-functions:
        - (*database/sql.Tx).Rollback
        - (github.com/jackc/pgx/v5.Tx).Rollback
        - (net/http.ResponseWriter).Write

    gocritic:
      # argOrder reads `strings.Contains(SomeInstruction, word)` as reversed
      # because the needle is the shorter name, and is wrong every time here.
      disabled-checks:
        - argOrder

    exhaustive:
      # A switch that names a default has answered for the cases it did not
      # write down.
      default-signifies-exhaustive: true
      # Borrowed enums nobody switches over whole.
      ignore-enum-types: ^(golang\.org/x/net/html/atom\.Atom|gopkg\.in/yaml\.v3\.Kind|time\.Weekday)$

    forbidigo:
      # Match against the resolved type, so a local named `time` or a variable
      # named `panic` is not mistaken for the thing being forbidden.
      analyze-types: true
      forbid:
        - pattern: ^time\.Now$
          pkg: ^time$
          msg: the domain does not know what time it is — take a clock port
        - pattern: ^time\.Since$
          pkg: ^time$
          msg: the domain does not know what time it is — take a clock port
        - pattern: ^time\.Until$
          pkg: ^time$
          msg: the domain does not know what time it is — take a clock port
        # A seeded *rand.Rand is passed in; the global source is not.
        - pattern: ^rand\.(Int\w*|Uint\w*|Float\w*|N|Perm|Shuffle|Read|ExpFloat64|NormFloat64|Seed)$
          pkg: ^math/rand(/v2)?$
          msg: the domain draws no randomness of its own — take a seeded source
        - pattern: ^panic$
          msg: what a call could not answer is that call's error
        - pattern: ^fmt\.Print.*$
          pkg: ^fmt$
          msg: the core writes to no stream of its own — log through the logger

    usetesting:
      # A test takes its context and its directory from testing.
      context-background: true
      os-temp-dir: true

    nolintlint:
      # A directive names the one linter it answers, and says why.
      require-specific: true
      require-explanation: true

    staticcheck:
      # SA checks are defects, ST checks the language's conventions. QF checks
      # offer rewrites of code that is already right. ST1020-ST1022 ask that a
      # comment open with the name of the one thing it is about; a comment here
      # may stand over a group of declarations.
      checks:
        - all
        - -QF*
        - -ST1020
        - -ST1021
        - -ST1022

    revive:
      # `exported` is left out: a comment that restates the name is narration.
      rules:
        - name: redefines-builtin-id
        # A handler, a callback and a method carrying a context meet a
        # signature somebody else settled; those parameter names may go unread.
        - name: unused-parameter
          arguments:
            - allowRegex: '^(_|ctx|t|w|r)$'
        - name: empty-block
        - name: increment-decrement
        # `unexported-return` is not here: an adapter hands back its own
        # concrete type and the composition root binds it to a port.
        - name: receiver-naming
        - name: blank-imports

  exclusions:
    generated: lax
    # Report every rule that matched nothing. The config is shared by every
    # module, so scripts/check-go-lint-exclusions.sh fails only on a rule no
    # module uses.
    warn-unused: true
    # golangci-lint's own list for errors nobody can act on — a Close on the
    # way out, a Flush, a print to a stream.
    presets:
      - std-error-handling
    rules:
      # The clock and randomness rules apply to the layers that must be
      # deterministic.
      - path-except: (^|/)internal/(domain|application)/
        text: (the domain does not know what time it is|the domain draws no randomness)
        linters: [forbidigo]

      # A test builds the world it needs, names its own clock, and may fail by
      # panicking.
      - path: (_test\.go|(^|/)internal/testsupport/)
        linters: [forbidigo, errcheck, noctx, contextcheck, bodyclose, exhaustive]

      # A command's output is text, and a process that cannot start says so
      # before there is a logger to say it through.
      - path: (^|/)cmd/
        text: writes to no stream of its own
        linters: [forbidigo]

      # depguard allowlist: layer violations that exist today. It may only
      # shrink; each entry is a refactor still owed.
      # search runs its SQL directly against pgx and the store row types
      - path: (^|/)services/discovery/internal/application/search/search\.go$
        text: (database driver|import store|import pgvector)
        linters: [depguard]
      # the crawler drives the store package directly instead of a port
      - path: (^|/)services/discovery/internal/application/crawl/(background|crawl|queue)\.go$
        text: must not import store
        linters: [depguard]
      # the indexer writes through the store package directly instead of a port
      - path: (^|/)services/discovery/internal/application/index/index\.go$
        text: must not import store
        linters: [depguard]
      # promote and consume use the store package directly instead of a port
      - path: (^|/)services/publish-service/internal/application/(promote/promote|ingest/consume)\.go$
        text: must not import store
        linters: [depguard]
      # runingest downloads a source file with net/http instead of a fetch port
      - path: (^|/)services/ingest/internal/application/runingest/runingest\.go$
        text: must not know the transport
        linters: [depguard]
      # author portraits are downloaded and resized in the use case itself
      - path: (^|/)tools/shruti-mcp/internal/application/catalog/authorprofile/usecase\.go$
        text: (must not know the transport|must not import infra)
        linters: [depguard]
      # cover generation calls infra/imageutil directly instead of a port
      - path: (^|/)tools/shruti-mcp/internal/application/catalog/covergen/usecase\.go$
        text: must not import infra
        linters: [depguard]
      # extractmeta reads artifacts through infra/artifact/fs instead of a port
      - path: (^|/)tools/shruti-mcp/internal/application/extractmeta/usecase\.go$
        text: must not import infra
        linters: [depguard]
      # publish inspects and checkpoints the SQLite catalog with database/sql directly
      - path: (^|/)tools/shruti-mcp/internal/application/catalog/publish/(assets|checkpoint)\.go$
        text: must not know the database
        linters: [depguard]

      # errcheck check-blank allowlist: each entry is one line that still
      # drops an error, matched by its exact source. It may only shrink; a
      # new `_ =` anywhere is refused, and an entry whose line is gone fails
      # scripts/check-go-lint-exclusions.sh.
      - path: (^|/)libs/pipeline/metadata/openaicompat/extractor\.go$
        source: '^\s*codesJSON, _ := json\.Marshal\(sourceCodes\)\s*$'
        linters: [errcheck]
      - path: (^|/)libs/pipeline/openaicompat/client\.go$
        source: '^\s*f, _ := t\.Float64\(\)\s*$'
        linters: [errcheck]
      - path: (^|/)libs/pipeline/openaicompat/client\.go$
        source: '^\s*respBytes, _ = io\.ReadAll\(resp\.Body\)\s*$'
        linters: [errcheck]
      - path: (^|/)libs/pipeline/review/openaicompat/reviewer\.go$
        source: '^\s*chunkJSON, _ := json\.Marshal\(req\.Segments\)\s*$'
        linters: [errcheck]
      - path: (^|/)libs/pipeline/review/openaicompat/reviewer\.go$
        source: '^\s*prevJSON, _ = json\.Marshal\(req\.PrevTail\)\s*$'
        linters: [errcheck]
      - path: (^|/)libs/pipeline/transcriber/deepgram/deepgram\.go$
        source: '^\s*_, _ = msg\.ReadFrom\(resp\.Body\)\s*$'
        linters: [errcheck]
      - path: (^|/)services/analytics/internal/handler/router\.go$
        source: '^\s*_ = json\.NewEncoder\(w\)\.Encode\(v\)\s*$'
        linters: [errcheck]
      - path: (^|/)services/auth/internal/jwt/jwt\.go$
