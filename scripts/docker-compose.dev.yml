name: shruti

services:

  dev:
    image: mcr.microsoft.com/devcontainers/base:noble
    command: sleep 365d
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../:/workspaces/shruti
      
  # -------------------------------------------------------------------------- #
  #                                  Services                                  #
  # -------------------------------------------------------------------------- #

  postgres:
    environment:
      POSTGRES_USER: shruti
      POSTGRES_PASSWORD: shruti
      POSTGRES_DB: shruti

  airflow-init:
    environment:
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: shruti
      _AIRFLOW_WWW_USER_PASSWORD: shruti
