name: shruti

# -------------------------------------------------------------------------- #
#                                  Services                                  #
# -------------------------------------------------------------------------- #

services:
  api:
    image: ghcr.io/jiva-studio/shruti-api:staging
    volumes:
      - ../data/keys/jwt/:/etc/shruti/keys/
 
  landing:
    image: ghcr.io/jiva-studio/shruti-landing:staging
    volumes:
      - ../data/landing/res:/usr/share/nginx/html/res

  admin:
    image: ghcr.io/jiva-studio/shruti-admin:staging

  airflow-webserver:
    image: ghcr.io/jiva-studio/shruti-airflow:staging

  airflow-scheduler:
    image: ghcr.io/jiva-studio/shruti-airflow:staging

  airflow-worker:
    image: ghcr.io/jiva-studio/shruti-airflow:staging

  airflow-triggerer:
    image: ghcr.io/jiva-studio/shruti-airflow:staging

  airflow-init:
    image: ghcr.io/jiva-studio/shruti-airflow:staging

  couchdb:
    image: ghcr.io/jiva-studio/shruti-couchdb:staging

  couchdb-init:
    image: ghcr.io/jiva-studio/shruti-couchdb-init:staging

  gateway:
    image: ghcr.io/jiva-studio/shruti-gateway:staging
    volumes:
      - ../data/gateway/certs:/workspaces/shruti/data/gateway/certs
    environment:
      - CONFIG_TYPE=release

    