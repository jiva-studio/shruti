# Base stack for lectorium services — postgres, redis, migrator, chat, auth.
# Caddy + Watchtower live in docker-compose.prod.yml; host port mappings and
# local builds live in docker-compose.dev.yml. Never run this base file
# alone — always pair it with a prod or dev overlay (see infra/README.md).
#
# Convention: every value coming from a .env file is namespaced LECTORIUM_*
# at the file level; this compose translates each into the variable name
# the underlying image expects (POSTGRES_PASSWORD, DOMAIN, DATABASE_URL…)
# inside the container. The `:?` suffix on POSTGRES_PASSWORD means the
# stack refuses to start if it's missing — no insecure defaults sneak in.

name: lectorium

# Shared log driver config — caps json-file rotation at 10MB × 5 files per
# container so the host's /var/lib/docker doesn't grow unbounded between
# deploys. Applied to every long-running service via the `<<: *default-logging`
# YAML anchor below. Postgres/Redis emit much less than apps, so it's still
# fine for them.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Hardening baseline applied to app containers (chat, auth, share-*). These
# don't need privilege escalation or any capabilities — the binaries bind on
# >1024 ports, talk DB+S3+HTTP, do filesystem I/O on their own volumes.
# Postgres/Redis/Caddy are deliberately NOT under this anchor because they
# may need specific caps (e.g. caddy needs NET_BIND_SERVICE for :443).
x-app-hardening: &app-hardening
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    logging: *default-logging
    # Docker's default /dev/shm of 64 MB is too small for pgvector's
    # parallel HNSW index build — building chunks_hnsw on the live ~460k
    # vector corpus needs ~500 MB peak shared memory across the coordinator
    # + worker processes. 2 GB gives generous headroom; only allocated
    # on demand, so quiescent postgres uses ~0 of it.
    shm_size: 2gb
    environment:
      POSTGRES_USER: lectorium
      POSTGRES_PASSWORD: ${LECTORIUM_POSTGRES_PASSWORD:?LECTORIUM_POSTGRES_PASSWORD must be set in .env (deploy.sh generates it; for dev use infra/app/scripts/gen-dev-env.sh)}
      POSTGRES_DB: lectorium
    # HNSW is RAM-hungry: default shared_buffers=128 MB pushes the index to
    # disk and ANN p50 balloons to 300-1000 ms. 2 GB pins the chunks-table
    # HNSW index in memory on 8 GB VPS and drops ANN to 30-150 ms p50.
    # (Stage 2 perf, PR #560.)
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=5GB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      # Headroom: chat's asyncpg pool tops out at 25, auth/pgx + share-
      # video pools are ~10 each, plus the migrator + monitoring +
      # operator psql sessions. 50 leaves no slack when a vendor hang
      # holds connections inside a transaction; 200 is safe at 8 GB
      # RAM with shared_buffers=2GB.
      - max_connections=200
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - jit=off
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [lectorium]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lectorium -d lectorium"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Single source of truth for all SQL migrations across services.
  # Runs once on every `up`, applies forward-only migrations from
  # infra/app/db/migrations/, exits 0. Service containers `depends_on` this
  # with `service_completed_successfully` so they never start against
  # an unmigrated DB. On a dirty state from a prior failed apply, the
  # exit code is non-zero — `docker compose logs migrator` shows where.
  # Recovery: `docker compose run --rm migrator force <N>` after fixup.
  migrator:
    # Migrations are baked into the image (see infra/app/db/Dockerfile),
    # so there is no bind-mount here. CI rebuilds and pushes a new tag
    # whenever infra/app/db/migrations/** or the Dockerfile changes.
    # Watchtower re-runs this stopped container when a new image lands
    # (needs --include-stopped + --revive-stopped on Watchtower itself).
    image: ${LECTORIUM_REGISTRY:-ghcr.io/akdasa-studios}/lectorium-migrator:${LECTORIUM_MIGRATOR_TAG:-latest}
    restart: "no"
    logging: *default-logging
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    command:
      - -path=/migrations
      - -database=postgres://lectorium:${LECTORIUM_POSTGRES_PASSWORD:?}@postgres:5432/lectorium?sslmode=disable
      - up
    networks: [lectorium]
    depends_on:
      postgres: { condition: service_healthy }

  # L2 cache for chat (router / title / embed_query / topic).
  # AOF on so hot caches survive restarts; 1 GB cap with allkeys-lru fits
  # ~250k embed_query entries.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 1gb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redisdata:/data
    networks: [lectorium]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  chat:
    # Production: image comes from ghcr.io built by services-ghcr.yml.
    # Dev override (docker-compose.dev.yml) replaces this with a build:
    # block + pull_policy: never so local hacking doesn't try to pull.
    image: ${LECTORIUM_REGISTRY:-ghcr.io/akdasa-studios}/lectorium-chat:${LECTORIUM_CHAT_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    <<: *app-hardening
    labels:
      # Opt-in to Watchtower. Watchtower itself runs without the label so
      # it doesn't try to update its own container.
      com.centurylinklabs.watchtower.enable: "true"
    env_file:
      # Default resolves to <project-root>/.env relative to this compose file:
      # /opt/lectorium/infra/app/compose/../../../.env = /opt/lectorium/.env in prod.
      # Dev gen-dev-env.sh overrides to ../.env.dev (= infra/app/.env.dev).
      - ${LECTORIUM_ENV_FILE:-../../../.env}
    environment:
      DATABASE_URL: postgresql://lectorium:${LECTORIUM_POSTGRES_PASSWORD:?}@postgres:5432/lectorium
      CATALOG_DIR: /var/lib/chat
      REDIS_URL: redis://redis:6379/0
      JWT_PUBLIC_KEY_PATH: /secrets/public.pem
      # LECTORIUM_ENV comes from /opt/lectorium/.env on the VPS (set to
      # "prod" there); local dev gets the "dev" default. SERVICE_VERSION
      # mirrors the running image tag so Datadog can correlate logs to
      # a specific ghcr build.
      ENV: ${LECTORIUM_ENV:-dev}
      SERVICE_VERSION: ${LECTORIUM_CHAT_TAG:-latest}
    volumes:
      - chatdata:/var/lib/chat
      - ${LECTORIUM_JWT_KEYS_DIR:-/opt/lectorium/jwt}:/secrets:ro
    networks: [lectorium]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrator: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 40
      start_period: 60s

  auth:
    image: ${LECTORIUM_REGISTRY:-ghcr.io/akdasa-studios}/lectorium-auth:${LECTORIUM_AUTH_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    <<: *app-hardening
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    env_file:
      - ${LECTORIUM_ENV_FILE:-../../../.env}
    environment:
      DATABASE_URL: postgresql://lectorium:${LECTORIUM_POSTGRES_PASSWORD:?}@postgres:5432/lectorium
      JWT_PRIVATE_KEY_PATH: /secrets/private.pem
      JWT_PUBLIC_KEY_PATH: /secrets/public.pem
      JWT_KID: v1
      GOOGLE_CLIENT_IDS: ${LECTORIUM_GOOGLE_CLIENT_IDS:-}
      APPLE_BUNDLE_IDS: ${LECTORIUM_APPLE_BUNDLE_IDS:-studio.jiva.shruti}
      PORT: "8081"
      # Datadog log enrichment — service/env/version make it into every
      # slog line via internal/logging/logging.go.
      ENV: ${LECTORIUM_ENV:-dev}
      SERVICE_VERSION: ${LECTORIUM_AUTH_TAG:-latest}
    volumes:
      - ${LECTORIUM_JWT_KEYS_DIR:-/opt/lectorium/jwt}:/secrets:ro
    networks: [lectorium]
    depends_on:
      postgres: { condition: service_healthy }
      migrator: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "/auth", "healthz"]
      interval: 15s
      timeout: 3s
      retries: 40
      start_period: 10s

  # cleanup-worker: consumes domain events from app.outbox (LISTEN/NOTIFY
  # + periodic sweep) and runs the cross-service side effects nobody else
  # owns. Today: purge Langfuse traces on user.deleted. Single Go binary,
  # no inbound traffic beyond /healthz on 8090 (kept off the well-known
  # service ports). See modules/services/cleanup-worker/README.md.
  cleanup-worker:
    image: ${LECTORIUM_REGISTRY:-ghcr.io/akdasa-studios}/lectorium-cleanup-worker:${LECTORIUM_CLEANUP_WORKER_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    <<: *app-hardening
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    env_file:
      - ${LECTORIUM_ENV_FILE:-../../../.env}
    environment:
      DATABASE_URL: postgresql://lectorium:${LECTORIUM_POSTGRES_PASSWORD:?}@postgres:5432/lectorium
      # LANGFUSE_HOST / PUBLIC_KEY / SECRET_KEY come from env_file (.env), same as chat.
      CLEANUP_SWEEP_INTERVAL: ${LECTORIUM_CLEANUP_SWEEP_INTERVAL:-5m}
      PORT: "8090"
      ENV: ${LECTORIUM_ENV:-dev}
      SERVICE_VERSION: ${LECTORIUM_CLEANUP_WORKER_TAG:-latest}
    networks: [lectorium]
    depends_on:
      postgres: { condition: service_healthy }
      migrator: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "/cleanup-worker", "healthz"]
      interval: 15s
      timeout: 3s
      retries: 40
      start_period: 10s

  # share-audio: synchronous MP3 cut + S3 upload. No DB, no queue.
  # 4 uvicorn workers per container, Caddy edge rate-limit caps spikes.
  share-audio:
    image: ${LECTORIUM_REGISTRY:-ghcr.io/akdasa-studios}/lectorium-share-audio:${LECTORIUM_SHARE_AUDIO_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    <<: *app-hardening
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    env_file:
      - ${LECTORIUM_ENV_FILE:-../../../.env}
    environment:
      # storage.py reads BUCKET (legacy name); compose translates from
      # the LECTORIUM_* namespace.
      BUCKET: ${LECTORIUM_S3_BUCKET:?LECTORIUM_S3_BUCKET must be set}
      EXCERPTS_PREFIX: ${LECTORIUM_S3_EXCERPTS_PREFIX:-public/shares/audio}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      ENV: ${LECTORIUM_ENV:-dev}
      SERVICE_VERSION: ${LECTORIUM_SHARE_AUDIO_TAG:-latest}
    networks: [lectorium]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/healthz"]
      interval: 15s
      timeout: 3s
      retries: 20
      start_period: 5s

  # share-video: long-running renders pulled from public.tasks queue
  # (postgres FOR UPDATE SKIP LOCKED). One render at a time per container
  # (ffmpeg at 720p already pulls ~1.75 vCPU). JWT middleware + per-user
  # daily quotas land in P6.5.
  share-video:
    image: ${LECTORIUM_REGISTRY:-ghcr.io/akdasa-studios}/lectorium-share-video:${LECTORIUM_SHARE_VIDEO_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    <<: *app-hardening
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    env_file:
      - ${LECTORIUM_ENV_FILE:-../../../.env}
    environment:
      DATABASE_URL: postgresql://lectorium:${LECTORIUM_POSTGRES_PASSWORD:?}@postgres:5432/lectorium
      LECTORIUM_S3_BUCKET: ${LECTORIUM_S3_BUCKET:?}
      LECTORIUM_S3_BACKGROUNDS_PREFIX: ${LECTORIUM_S3_BACKGROUNDS_PREFIX:-private/share/video/backgrounds}
      LECTORIUM_S3_VIDEO_PREFIX: ${LECTORIUM_S3_VIDEO_PREFIX:-public/share/video}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      OPENAI_API_KEY: ${LECTORIUM_OPENAI_API_KEY:-}
      TRANSCRIBER: ${LECTORIUM_TRANSCRIBER:-whisper}
      # Anchor for JWT verification (added in P6.5). Mount the same
      # /opt/lectorium/jwt directory auth uses; only public.pem is read.
      JWT_PUBLIC_KEY_PATH: /secrets/public.pem
      SHARE_VIDEO_ANON_PER_DAY: ${LECTORIUM_SHARE_VIDEO_ANON_PER_DAY:-3}
      SHARE_VIDEO_SIGNED_IN_PER_DAY: ${LECTORIUM_SHARE_VIDEO_SIGNED_IN_PER_DAY:-20}
      ENV: ${LECTORIUM_ENV:-dev}
      SERVICE_VERSION: ${LECTORIUM_SHARE_VIDEO_TAG:-latest}
    volumes:
      - ${LECTORIUM_JWT_KEYS_DIR:-/opt/lectorium/jwt}:/secrets:ro
      - share_video_scratch:/tmp/render
    networks: [lectorium]
    depends_on:
      postgres: { condition: service_healthy }
      migrator: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/healthz"]
      interval: 15s
      timeout: 3s
      retries: 40
      start_period: 30s

networks:
  lectorium:

volumes:
  pgdata:
  chatdata:
  redisdata:
  share_video_scratch:
