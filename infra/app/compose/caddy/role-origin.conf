# Caddy role snippet — origin (global) host.
#
# Invoked by the main Caddyfile via `import role-{$SHRUTI_REGION_ROLE}`.
# Runs on the global VPS that hosts auth, chat, and cleanup-worker
# locally. /share/* is handled in the main Caddyfile (terminates locally
# on every host); this snippet adds /auth/* + the chat surface.
#
# Trust model for X-Shruti-Region:
#   - The chat handle deliberately does NOT strip the header. Trust is
#     enforced at the chat-service Python middleware (_region.py), which
#     accepts the header only when the request peer IP (after the trusted
#     ProxyHeadersMiddleware rewrite) is loopback / RFC1918 / a configured
#     REGION_HEADER_TRUSTED_SOURCES CIDR (the RU proxy's public egress IP).
#     If the snippet stripped the header here, the legitimate RU-proxy
#     injection would be erased before chat ever sees it.
#   - /auth/* and /webhooks/revenuecat keep the strip — auth does not
#     consume the header today and removing it on those paths costs
#     nothing while keeping the surface narrow.

(role-origin) {
    # ── /auth/* — auth service ─────────────────────────────────
    handle /auth/* {
        request_header -X-Shruti-Region
        reverse_proxy auth:8081
    }

    # ── /webhooks/revenuecat — RC webhook → auth service ───────
    # Carries its own Bearer secret (from the RC dashboard), not a
    # user JWT. Sits outside /auth/* on purpose so the user-token
    # middleware in the auth service doesn't try to validate it.
    # Always lands on origin (RC is configured to call the global host).
    handle /webhooks/revenuecat {
        request_header -X-Shruti-Region
        reverse_proxy auth:8081
    }

    # ── chat surface ───────────────────────────────────────────
    # Explicit allowlist of chat-service paths (no catch-all). Matches
    # the upstream Caddyfile's role-proxy reverse_proxy set 1:1 so
    # behaviour is symmetric.
    # /chat is SSE — flush_interval -1 sends chunks as they arrive.
    # X-Shruti-Region passes through untouched — trust gate lives in
    # the chat service's _region.py (see top-of-file note).
    @chat path /chat /chat/* /title /questions /healthz /readyz
    handle @chat {
        request_body {
            max_size 1MB
        }
        reverse_proxy chat:8080 {
            flush_interval -1
            transport http {
                read_buffer 8192
            }
        }
    }
}
