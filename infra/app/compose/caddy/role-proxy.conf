# Caddy role snippet — proxy (RU) host.
#
# Invoked by the main Caddyfile via `import role-{$LECTORIUM_REGION_ROLE}`.
# Runs on the RU VPS, which terminates only /share/* locally (handled
# in the main Caddyfile) and forwards every chat/auth-bearing path to
# the global host. {$LECTORIUM_GLOBAL_HOST} is the public origin URL
# (e.g. "lectorium.example.com") set per-host in .env.
#
# The X-Lectorium-Region: ru header tags egress so the global backend
# can attribute usage / apply regional policy. role-origin.conf strips
# this header from any direct client request, so only this proxy can
# legitimately set it.

(role-proxy) {
    @forward path /auth/* /billing/* /profile/* /chat /chat/* /title /questions /healthz /readyz
    handle @forward {
        reverse_proxy https://{$LECTORIUM_GLOBAL_HOST} {
            flush_interval -1
            header_up X-Lectorium-Region "ru"
            header_up X-Forwarded-Host {host}
            header_up Host {$LECTORIUM_GLOBAL_HOST}
            transport http {
                read_buffer 8192
            }
        }
    }
}
