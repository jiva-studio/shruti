# Caddy role snippet — proxy (RU) host.
#
# Invoked by the main Caddyfile via `import role-{$SHRUTI_REGION_ROLE}`.
# Runs on the RU VPS, which terminates only /share/* locally (handled
# in the main Caddyfile) and forwards every chat/auth-bearing path to
# the global host. {$SHRUTI_GLOBAL_HOST} is the public origin URL
# (e.g. "shruti.example.com") set per-host in .env.
#
# The X-Shruti-Region: ru header tags egress so the global backend
# can attribute usage / apply regional policy. role-origin.conf strips
# this header from any direct client request, so only this proxy can
# legitimately set it.

(role-proxy) {
    @forward path /auth/* /billing/* /chat /chat/* /title /questions /healthz /readyz
    handle @forward {
        reverse_proxy https://{$SHRUTI_GLOBAL_HOST} {
            flush_interval -1
            header_up X-Shruti-Region "ru"
            header_up X-Forwarded-Host {host}
            header_up Host {$SHRUTI_GLOBAL_HOST}
            transport http {
                read_buffer 8192
            }
        }
    }
}
