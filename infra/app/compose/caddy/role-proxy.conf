# Caddy role snippet — proxy (RU) host.
#
# Invoked by the main Caddyfile via `import role-{$SHRUTI_REGION_ROLE}`.
# Runs on the RU VPS, which terminates only /share/* locally (handled
# in the main Caddyfile) and forwards every chat/auth-bearing path to
# the global host. {$SHRUTI_GLOBAL_HOST} is the public origin URL
# (e.g. "shruti.example.com") set per-host in .env.
#
# Egress carries no region tag. The X-Shruti-Region: ru header this
# used to inject had exactly one consumer — the chat service's PII gate
# — and that gate is gone (#728).

(role-proxy) {
    # Health must describe THIS box. Forwarding it upstream made the RU
    # edge report the global host's health, so a dead RU edge answered
    # 200 for as long as global was up — which is exactly the failure
    # monitoring exists to see. The body names the role so a probe can
    # tell which box answered.
    @health path /healthz /readyz
    handle @health {
        respond "ok proxy" 200
    }

    @forward path /auth/* /billing/* /profile/* /orchestrator/* /analytics/* /discovery/search /chat /chat/* /title /questions
    handle @forward {
        reverse_proxy https://{$SHRUTI_GLOBAL_HOST} {
            flush_interval -1
            header_up X-Forwarded-Host {host}
            header_up Host {$SHRUTI_GLOBAL_HOST}
            transport http {
                read_buffer 8192
            }
        }
    }
}
