# Caddy role snippet — edge host.
#
# Invoked by the main Caddyfile through (site-edge). The edge is stateless:
# it runs Caddy alone and forwards every request.
#
#   /public/*       → the CDN pull zone, {$SHRUTI_EDGE_CDN_UPSTREAM}
#                     (scheme and host only, e.g. https://cdn.example.com)
#   everything else → origin, https://{$SHRUTI_GLOBAL_HOST}, /share/* and
#                     /webhooks/* included; origin's route table decides
#                     what exists, so a route added there needs no change here
#
# Nothing is rate-limited here. Origin keys its limits on {client_ip} and
# trusts the edge's address (SHRUTI_TRUSTED_EDGE_CIDRS on origin), so it
# already counts per real client; the edge itself trusts no proxy, so the
# X-Forwarded-For it sends is always the connecting address, never one a
# client supplied.

# Upstream connections are pooled and long-lived, HTTP/2 where the upstream
# offers it, so traffic rides a few warm TLS connections. Bodies are flushed as they arrive, so a stalled
# upstream shows as a stalled response. reverse_proxy drops the upstream's
# Alt-Svc itself; with HTTP/3 off here, no response advertises it.
(edge-upstream) {
    flush_interval -1
    transport http {
        versions 1.1 2
        dial_timeout 5s
        keepalive 5m
        keepalive_idle_conns 256
        keepalive_idle_conns_per_host 64
    }
}

# Origin sees the client only through X-Forwarded-For, which the edge sets
# from the connecting address. The other client-address headers are dropped
# so nothing a client sends can pose as that address to any origin service.
(edge-to-origin) {
    import edge-upstream
    header_up Host {$SHRUTI_GLOBAL_HOST}
    header_up X-Forwarded-Host {host}
    header_up -X-Real-IP
    header_up -Forwarded
    header_up -True-Client-IP
    header_up -CF-Connecting-IP
    header_up -X-Client-IP
    header_up -Client-IP
    header_up -X-Cluster-Client-IP
    header_up -Fastly-Client-IP
    header_up -X-Original-Forwarded-For
}

# Public objects need no credentials; a user's token, cookies and a
# client-supplied address are not sent to the CDN.
(edge-to-cdn) {
    import edge-upstream
    header_up Host {http.reverse_proxy.upstream.host}
    header_up -Authorization
    header_up -Cookie
    header_up -X-Real-IP
}

(role-edge) {
    route {
        # Health of THIS box, answered without touching an upstream.
        @health path /healthz /readyz
        handle @health {
            respond "ok edge" 200
        }

        handle /healthz/api {
            rewrite * /healthz
            reverse_proxy https://{$SHRUTI_GLOBAL_HOST} {
                import edge-to-origin
            }
        }

        # The probe object is larger than 64 KB and streamed whole, so a
        # connection that stalls after its first few KB fails the probe by
        # timeout, not only one that refuses outright.
        handle /healthz/cdn {
            rewrite * {$SHRUTI_EDGE_CDN_PROBE_PATH}
            reverse_proxy {$SHRUTI_EDGE_CDN_UPSTREAM} {
                import edge-to-cdn
            }
        }

        handle /public/* {
            reverse_proxy {$SHRUTI_EDGE_CDN_UPSTREAM} {
                import edge-to-cdn
            }
        }

        handle {
            reverse_proxy https://{$SHRUTI_GLOBAL_HOST} {
                import edge-to-origin
            }
        }
    }

    import api-errors
}
