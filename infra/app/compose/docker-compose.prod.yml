# Production overlay over docker-compose.yml. Adds:
#   - Caddy (TLS termination, path routing)
#   - Watchtower (auto-pull updated ghcr images on opt-in containers)
#   - docker-socket-proxy (mediates Watchtower's docker.sock access)
#
# deploy.sh combines this overlay with the base file; this overlay is
# never run alone.

services:
  caddy:
    # Caddy runs on both roles. role-origin.conf vs role-proxy.conf is
    # selected at runtime via LECTORIUM_REGION_ROLE (set per host in .env).
    profiles: [origin, proxy]
    # Custom build with the rate-limit plugin and the Caddyfile baked in.
    # Built by services-ghcr.yml from infra/app/compose/caddy/Dockerfile;
    # the Caddyfile travels inside the image, so a CORS / rate-limit /
    # route change reaches prod the same way any code change does:
    # CI rebuilds the image, Watchtower pulls it, container restarts
    # with the new file. No out-of-band rsync. See issue #577.
    image: ${LECTORIUM_REGISTRY:-ghcr.io/jiva-studio}/lectorium-caddy:${LECTORIUM_CADDY_TAG:-latest}
    restart: unless-stopped
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    labels:
      # Watchtower picks this container up on the next 60s poll and
      # restarts it when a new image is published to ghcr.
      com.centurylinklabs.watchtower.enable: "true"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    # Pin upstream DNS to public resolvers. Required on the RU VPS where
    # the host's resolver is a Russian recursor that intermittently fails
    # on LE/ACME hostnames — caddy then can't fetch certs and falls back
    # to self-signed. Harmless on EU: caddy uses 8.8.8.8 for *external*
    # lookups; service-name resolution inside the lectorium network still
    # goes through Docker's embedded resolver at 127.0.0.11.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      DOMAIN: ${LECTORIUM_DOMAIN:?}
      ACME_EMAIL: ${LECTORIUM_ACME_EMAIL:?}
      # Caddyfile reads these to pick role + (proxy only) upstream host.
      # Default origin so existing single-host installs keep working.
      LECTORIUM_REGION_ROLE: ${LECTORIUM_REGION_ROLE:-origin}
      # On origin: stays a placeholder — Caddy still parses role-proxy.conf
      # (both snippet defs are global-imported) so the env var must
      # substitute to *something* syntactically valid as a host. The
      # snippet is never INVOKED on origin so the value is meaningless.
      # On proxy: real global host name (lectorium.example.com), set
      # by the operator in /opt/lectorium/.env.
      LECTORIUM_GLOBAL_HOST: ${LECTORIUM_GLOBAL_HOST:-global.invalid}
      # Whose X-Forwarded-For Caddy may believe. Every rate-limit zone
      # keys on {client_ip}; without this Caddy falls back to {remote_ip}
      # and the origin sees all RU-forwarded traffic as one client, so a
      # single RU user can exhaust a zone for every RU user.
      #
      # Same CIDR the chat service trusts for the XFF rewrite, so "our own
      # edge" has one definition. The `:-` default matters: the var is
      # present-but-empty on dev / single-region hosts, and an empty
      # argument to `trusted_proxies static` is a parse error that would
      # stop Caddy from starting at all. Loopback trusts nothing real,
      # which is the correct behaviour when there is no edge.
      #
      # LECTORIUM_REGION_HEADER_TRUSTED_SOURCES is the retired spelling,
      # kept as a fallback so a host whose /opt/lectorium/.env still
      # carries the old name keeps working. Drop the fallback once every
      # host sets LECTORIUM_TRUSTED_EDGE_CIDRS.
      LECTORIUM_TRUSTED_PROXIES: ${LECTORIUM_TRUSTED_EDGE_CIDRS:-${LECTORIUM_REGION_HEADER_TRUSTED_SOURCES:-127.0.0.1/32}}
      # Public hostname for the static website (Caddy serves /srv/web here
      # and auto-issues Let's Encrypt). Set on origin (an <ip>.sslip.io for
      # first tests, the real domain later). Defaults to an internal-only
      # ":8088" so hosts that don't serve the site (RU proxy) parse the
      # web block without attempting ACME for a real name.
      LECTORIUM_WEB_DOMAIN: ${LECTORIUM_WEB_DOMAIN:-:8088}
      # Public hostname for the corpus-mcp MCP endpoint (own subdomain,
      # serves /mcp at root; Caddy auto-issues Let's Encrypt). Set on origin
      # (e.g. mcp.shruti.app). Defaults to an internal-only ":8089"
      # so hosts that don't serve it (RU proxy) parse the block without
      # attempting ACME for a real name — same pattern as the web domain.
      LECTORIUM_MCP_DOMAIN: ${LECTORIUM_MCP_DOMAIN:-:8089}
    volumes:
      - caddydata:/data
      - caddyconfig:/config
      # Prebuilt static site, rsync'd to the host. read-only; Caddy only
      # serves it. Missing on proxy hosts → Docker creates an empty dir,
      # the web block 404s harmlessly on its internal :8088.
      - ${LECTORIUM_WEB_DIR:-/opt/lectorium/web}:/srv/web:ro
    networks: [lectorium]
    # required: false lets caddy start on proxy hosts where chat/auth
    # are profile-excluded (the proxy reverse-proxies them to global).
    # share-audio + share-video + share-transcript are present on both roles so
    # stay strict.
    depends_on:
      chat:         { condition: service_healthy, required: false }
      auth:         { condition: service_healthy, required: false }
      share-audio:  { condition: service_healthy }
      share-video:  { condition: service_healthy }
      share-transcript:    { condition: service_healthy }

  # Tightens Watchtower's access to the docker daemon. Without this proxy
  # Watchtower would mount /var/run/docker.sock directly and have root
  # over the host (it could spawn arbitrary containers, mount host paths
  # — full container escape on compromise). The proxy whitelist below
  # restricts the API to exactly the verbs Watchtower needs: list
  # containers/images, pull, restart. Everything else returns 403.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]  # haproxy inside the proxy needs these
    environment:
      CONTAINERS: 1      # GET /containers/json
      IMAGES: 1          # GET /images/* (pull check)
      POST: 1            # POST /containers/<id>/restart, /images/create
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [watchtower-internal]

  # --rolling-restart is intentionally omitted: caddy hard-depends_on auth/chat/share-*
  # via condition: service_healthy, which the rolling strategy refuses to break.
  # Default stop-then-start strategy gives ~10s per-service downtime per upgrade — acceptable.
  watchtower:
    image: nickfedor/watchtower:1.17.1   # actively maintained fork of containrrr
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # NO Watchtower-enable label — we don't want it to update itself.
    environment:
      # Talk to docker via the proxy, not raw socket.
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      # Reads ghcr.io credentials from /config/config.json (mounted below).
      # Docker convention: DOCKER_CONFIG points at a DIRECTORY containing
      # config.json, not the file itself.
      DOCKER_CONFIG: /config
    volumes:
      # Mount the project's docker config so Watchtower inherits the
      # ghcr.io login. /opt/lectorium/config/config.json is created
      # once by the operator via `docker --config /opt/lectorium/config
      # login ghcr.io -u <user> --password-stdin <PAT>` — see infra/README.md.
      # Read-only; Watchtower never writes back.
      - ${LECTORIUM_CONFIG_DIR:-/opt/lectorium/config}/config.json:/config/config.json:ro
    command:
      - --label-enable          # only touch containers with the watchtower.enable label
      - --interval=60           # poll ghcr every 60s
      - --cleanup               # remove old images after successful update
      - --include-stopped       # also scan exited containers (needed for the one-shot migrator)
      - --include-restarting    # crashlooping containers too — without this a bad release
                                # deadlocks: container restarts forever on the broken image
                                # while Watchtower skips it because it's "Restarting", so
                                # the fix image never gets pulled. Witnessed 2026-05-25 with
                                # share-video #620; needed manual `docker stop` to break out.
      - --revive-stopped        # docker-start the migrator after pulling a fresh image
    networks: [watchtower-internal, lectorium]
    depends_on:
      docker-socket-proxy: { condition: service_started }

networks:
  watchtower-internal:
    # Isolated network so the proxy isn't reachable from chat/auth.
    # Watchtower bridges both networks.

volumes:
  caddydata:
  caddyconfig:
