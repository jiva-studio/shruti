# Local-dev overlay over docker-compose.yml.
#
# Restores `build:` blocks for chat/auth (base config pulls from ghcr.io
# in prod) and pins images to local tags with `pull_policy: never` so a
# missing-from-disk image fails fast instead of trying to pull
# `ghcr.io/akdasa-studios/lectorium-chat:latest` from the public
# registry every time you boot.
#
# Set these in your shell or via infra/app/.env.dev:
#   LECTORIUM_ENV_FILE=../.env.dev
#   LECTORIUM_JWT_KEYS_DIR=../../../../.config/lectorium/jwt
#   COMPOSE_PROFILES=origin   # required since the base compose is now
#                             # profile-tagged for origin/proxy roles
#
# Host ports live in lectorium's reserved 11xxx band (per the workspace
# port convention — one thousands-block per project; lectorium = 11000-11999,
# see dotfiles personal/projects/akdasa-studios/lectorium.nix) so a sibling
# project's local stack can't collide. Container ports are unchanged; only
# the host side is remapped, overridable via the LECTORIUM_*_PORT vars:
#   chat 11080  auth 11081  postgres 11082  redis 11083
# (11000 = docs, 11001 = app dev server, 111xx = worktree dev servers.)
#
# Usage:
#   docker compose -f infra/app/compose/docker-compose.yml \
#                  -f infra/app/compose/docker-compose.dev.yml \
#                  --env-file infra/app/.env.dev \
#                  up --build

# 1Password-sourced secrets. Injected at `make stack-up` time by `op run`
# (--env-file=secrets.op.tpl) into the compose process env, then passed through
# to the containers via the merge below — so they never land in .env.dev on
# disk. `${VAR:-}` resolves empty when op isn't used; since gen-dev-env.sh no
# longer writes these vars, that's a clean "no key" rather than a stale value.
x-op-secrets: &op-secrets
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  LANGFUSE_HOST: ${LANGFUSE_HOST:-}
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
  LECTORIUM_RC_REST_API_KEY: ${LECTORIUM_RC_REST_API_KEY:-}
  LECTORIUM_RC_WEBHOOK_SECRET: ${LECTORIUM_RC_WEBHOOK_SECRET:-}
  VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
  LECTORIUM_OPENAI_API_KEY: ${LECTORIUM_OPENAI_API_KEY:-}

services:
  postgres:
    ports:
      - "${LECTORIUM_PG_PORT:-11082}:5432"

  redis:
    ports:
      - "${LECTORIUM_REDIS_PORT:-11083}:6379"

  # Migrator image is private on GHCR; local dev builds it from
  # source so nobody needs a registry token to bring the stack up.
  migrator:
    image: lectorium-migrator:dev
    pull_policy: never
    build:
      context: ../db
      dockerfile: Dockerfile

  chat:
    image: lectorium-chat:dev
    pull_policy: never
    build:
      # Context = modules/ so Dockerfile can COPY both services/chat/ and docs/help/.
      context: ../../../modules
      dockerfile: services/chat/Dockerfile
    ports:
      - "${LECTORIUM_CHAT_PORT:-11080}:8080"
    environment:
      <<: *op-secrets
    volumes:
      # Mount tests/ read-only so `docker compose exec chat python -m
      # tests.evals.run_chunk_tools_eval` works against the running
      # stack. Prod image deliberately omits tests/; this is dev-only.
      # rw so eval can write results.jsonl + filter tmp files back to the host.
      - ../../../modules/services/chat/app/tests:/app/tests

  auth:
    image: lectorium-auth:dev
    pull_policy: never
    build:
      context: ../../../modules
      dockerfile: services/auth/Dockerfile
    ports:
      - "${LECTORIUM_AUTH_PORT:-11081}:8081"
    environment:
      <<: *op-secrets

  cleanup-worker:
    image: lectorium-cleanup-worker:dev
    pull_policy: never
    build:
      context: ../../../modules
      dockerfile: services/cleanup-worker/Dockerfile
    environment:
      <<: *op-secrets
    # No host port mapping: cleanup-worker has no API surface beyond
    # /healthz, and the in-container HEALTHCHECK dogfoods the binary.

  # share-audio / share-video are in the `origin` profile, so a full `up`
  # would otherwise PULL their private ghcr images. Restore `build:` (same
  # modules/ context as chat/auth) so they compile from source locally — no
  # registry token. `make stack-up` builds + runs them; they need
  # LECTORIUM_S3_BUCKET + AWS creds (the latter from op) to do real work.
  share-audio:
    image: lectorium-share-audio:dev
    pull_policy: never
    build:
      context: ../../../modules
      dockerfile: services/share-audio/Dockerfile
    ports:
      - "${LECTORIUM_SHARE_AUDIO_PORT:-11084}:8082"
    environment:
      <<: *op-secrets

  share-video:
    image: lectorium-share-video:dev
    pull_policy: never
    build:
      context: ../../../modules
      dockerfile: services/share-video/Dockerfile
    environment:
      <<: *op-secrets
