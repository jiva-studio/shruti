# Local-dev overlay over docker-compose.yml.
#
# Restores `build:` blocks for chat/auth (base config pulls from ghcr.io
# in prod) and pins images to local tags with `pull_policy: never` so a
# missing-from-disk image fails fast instead of trying to pull
# `ghcr.io/akdasa-studios/shruti-chat:latest` from the public
# registry every time you boot.
#
# Set these in your shell or via infra/app/.env.dev:
#   SHRUTI_ENV_FILE=../.env.dev
#   SHRUTI_JWT_KEYS_DIR=../../../../.config/shruti/jwt
#
# Usage:
#   docker compose -f infra/app/compose/docker-compose.yml \
#                  -f infra/app/compose/docker-compose.dev.yml \
#                  --env-file infra/app/.env.dev \
#                  up --build

services:
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  # Migrator image is private on GHCR; local dev builds it from
  # source so nobody needs a registry token to bring the stack up.
  migrator:
    image: shruti-migrator:dev
    pull_policy: never
    build:
      context: ../db
      dockerfile: Dockerfile

  chat:
    image: shruti-chat:dev
    pull_policy: never
    build:
      # Context = modules/ so Dockerfile can COPY both services/chat/ and docs/help/.
      context: ../../../modules
      dockerfile: services/chat/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      # Mount tests/ read-only so `docker compose exec chat python -m
      # tests.evals.run_chunk_tools_eval` works against the running
      # stack. Prod image deliberately omits tests/; this is dev-only.
      # rw so eval can write results.jsonl + filter tmp files back to the host.
      - ../../../modules/services/chat/app/tests:/app/tests

  auth:
    image: shruti-auth:dev
    pull_policy: never
    build:
      context: ../../../modules
      dockerfile: services/auth/Dockerfile
    ports:
      # Host port shifted to 18081 — local dev shares the box with
      # shruti-mcp on 8081.
      - "18081:8081"

  cleanup-worker:
    image: shruti-cleanup-worker:dev
    pull_policy: never
    build:
      context: ../../../modules
      dockerfile: services/cleanup-worker/Dockerfile
    # No host port mapping: cleanup-worker has no API surface beyond
    # /healthz, and the in-container HEALTHCHECK dogfoods the binary.
