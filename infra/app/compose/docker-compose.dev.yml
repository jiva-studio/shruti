# Local-dev overlay over docker-compose.yml.
#
# Restores `build:` blocks for chat/auth (base config pulls from ghcr.io
# in prod) and pins images to local tags with `pull_policy: never` so a
# missing-from-disk image fails fast instead of trying to pull
# `ghcr.io/jiva-studio/shruti-chat:latest` from the public
# registry every time you boot.
#
# Set these in your shell or via infra/app/.env.dev:
#   SHRUTI_ENV_FILE=../.env.dev
#   SHRUTI_JWT_KEYS_DIR=../../../../.config/shruti/jwt
#   COMPOSE_PROFILES=origin   # required since the base compose is now
#                             # profile-tagged for origin/proxy roles
#
# Host ports live in shruti's reserved 11xxx band (per the workspace
# port convention — one thousands-block per project; shruti = 11000-11999,
# see dotfiles personal/projects/jiva-studio/shruti.nix) so a sibling
# project's local stack can't collide. Container ports are unchanged; only
# the host side is remapped, overridable via the SHRUTI_*_PORT vars:
#   chat 11080  auth 11081  postgres 11082  redis 11083
# (11000 = docs, 11001 = app dev server, 111xx = worktree dev servers.)
#
# Usage:
#   docker compose -f infra/app/compose/docker-compose.yml \
#                  -f infra/app/compose/docker-compose.dev.yml \
#                  --env-file infra/app/.env.dev \
#                  up --build

services:
  postgres:
    ports:
      - "${SHRUTI_PG_PORT:-11082}:5432"

  redis:
    ports:
      - "${SHRUTI_REDIS_PORT:-11083}:6379"

  # Migrator image is private on GHCR; local dev builds it from
  # source so nobody needs a registry token to bring the stack up.
  migrator:
    image: shruti-migrator:dev
    pull_policy: never
    build:
      context: ../db
      dockerfile: Dockerfile

  chat:
    image: shruti-chat:dev
    pull_policy: never
    build:
      # Context = modules/ so Dockerfile can COPY both services/chat/ and docs/help/.
      context: ../../../modules
      dockerfile: services/chat/Dockerfile
    ports:
      - "${SHRUTI_CHAT_PORT:-11080}:8080"
    volumes:
      # Mount tests/ read-only so `docker compose exec chat python -m
      # tests.evals.run_chunk_tools_eval` works against the running
      # stack. Prod image deliberately omits tests/; this is dev-only.
      # rw so eval can write results.jsonl + filter tmp files back to the host.
      - ../../../modules/services/chat/app/tests:/app/tests

  auth:
    image: shruti-auth:dev
    pull_policy: never
    build:
      context: ../../../modules
      dockerfile: services/auth/Dockerfile
    ports:
      - "${SHRUTI_AUTH_PORT:-11081}:8081"

  cleanup-worker:
    image: shruti-cleanup-worker:dev
    pull_policy: never
    build:
      context: ../../../modules
      dockerfile: services/cleanup-worker/Dockerfile
    # No host port mapping: cleanup-worker has no API surface beyond
    # /healthz, and the in-container HEALTHCHECK dogfoods the binary.

  # share-audio / share-video are in the `origin` profile, so a full
  # `up` would otherwise try to PULL their private ghcr images. Restore
  # `build:` (same modules/ context as chat/auth) so they compile from
  # source locally — no registry token needed. The default `make stack-up`
  # leaves them out (the mobile dev region keeps share-* on prod and the
  # share-video build is heavy); `make stack-up-all` builds + runs them.
  # They need SHRUTI_S3_BUCKET (+ AWS creds) in .env.dev to do real work.
  share-audio:
    image: shruti-share-audio:dev
    pull_policy: never
    build:
      context: ../../../modules
      dockerfile: services/share-audio/Dockerfile
    ports:
      - "${SHRUTI_SHARE_AUDIO_PORT:-11084}:8082"

  share-video:
    image: shruti-share-video:dev
    pull_policy: never
    build:
      context: ../../../modules
      dockerfile: services/share-video/Dockerfile

  share-transcript:
    image: shruti-share-transcript:dev
    pull_policy: never
    build:
      context: ../../../modules
      dockerfile: services/share-transcript/Dockerfile
    ports:
      - "${SHRUTI_SHARE_TRANSCRIPT_PORT:-11085}:8084"

  # analytics is in the `origin` profile, so a full `up` would otherwise try
  # to PULL its private ghcr image. Build from source (same modules/ context)
  # and expose the host port for local report probing.
  analytics:
    image: shruti-analytics:dev
    pull_policy: never
    build:
      context: ../../../modules
      dockerfile: services/analytics/Dockerfile
    ports:
      - "${SHRUTI_ANALYTICS_PORT:-11086}:8086"
