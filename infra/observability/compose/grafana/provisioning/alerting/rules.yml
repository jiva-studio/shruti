- orgId: 1
  name: chat
  folder: Shruti-Alerts
  interval: 1m
  rules:
  # The canary for this whole group. Every other rule here reads a chat metric,
  # so all of them go quiet together when the scrape breaks — and quiet is
  # indistinguishable from healthy unless something watches the scrape itself.
  #
  # `up` is 0 when metrics-proxy answers but chat does not (502), and the series
  # vanishes altogether if the job is dropped from prometheus.yml or Prometheus
  # never loads it — hence noDataState/execErrState Alerting rather than the
  # file's usual OK. This rule is the one that must never fail silently.
  #
  # The generic `exporter_down` rule does not cover this: its expression
  # (`sum by(job) (up == 0) > 0`) can only ever produce a value >= 1, which its
  # `lt 1` threshold never matches. Do not rely on it here.
  - uid: chat_metrics_target_down
    title: chat_metrics_target_down
    condition: B
    for: 5m
    labels:
      severity: P2
      service: chat
    annotations:
      summary: Chat metrics scrape is down — every other chat alert is blind
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: up{job="chat-prod-eu"}
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
    noDataState: Alerting
    execErrState: Alerting
  # Threshold is 80% of the admission cap, which lives in the service, not here:
  # `max_in_flight_turns` in
  # modules/services/chat/app/src/shruti_chat/config.py (default 24, override
  # SHRUTI_CHAT_MAX_IN_FLIGHT_TURNS). Past the cap, new turns are rejected at
  # admission rather than queued, so the useful page is the approach, not the
  # breach. Grafana provisioning is static YAML with no arithmetic and chat
  # exports no gauge for the cap, so 19 cannot be derived here — if the setting
  # is ever changed, this number and the summary below must move with it.
  - uid: chat_turns_in_flight_high
    title: chat_turns_in_flight_high
    condition: B
    for: 5m
    labels:
      severity: P2
      service: chat
    annotations:
      summary: Chat turns in flight >19 of the 24-turn admission cap for 5m
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: max(shruti_chat_turns_in_flight)
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 19
    # NoData, not OK: this gauge is set at import time and is therefore present
    # on every scrape of a live chat. Its absence means the scrape is broken,
    # not that the service is idle, and must not render as green.
    noDataState: NoData
    execErrState: OK
  # Counted because both failure modes are invisible in the service's own error
  # rate: non-Pro requests fail closed with 503, Pro brownouts through
  # unlimited.
  #
  # `increase(...) > 3` rather than `rate(...) > 0`: a counter is monotonic, so
  # one isolated blip keeps `rate` above zero for the whole 5m window and would
  # satisfy `for: 5m` on its own — a guaranteed page for a single retryable
  # error. Three in five minutes is still comfortably below any real outage,
  # which produces them continuously.
  - uid: chat_rate_limit_store_unavailable
    title: chat_rate_limit_store_unavailable
    condition: B
    for: 5m
    labels:
      severity: P2
      service: chat
    annotations:
      summary: Chat rate-limit store unavailable (>3 failures/5m) — non-Pro requests failing closed
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: sum(increase(shruti_chat_rate_limit_redis_unavailable_total[5m]))
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 3
    # NoData, not OK: the counter is registered at import time, so a live chat
    # always exports it and `increase` resolves to 0 rather than nothing.
    noDataState: NoData
    execErrState: OK
  # Waiters is the gauge that separates "healthily busy" from "requests are
  # queueing"; pool size alone cannot.
  - uid: chat_db_pool_waiters
    title: chat_db_pool_waiters
    condition: B
    for: 5m
    labels:
      severity: P2
      service: chat
    annotations:
      summary: Chat coroutines queueing for a DB connection (pool exhausted)
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: max(shruti_chat_db_pool_waiters)
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    # NoData, not OK: the pool is created in the lifespan handler before the
    # app serves a request, so this series is present on every scrape of a live
    # chat. It drops out only if asyncpg's private queue internals move under
    # an upgrade (metrics.py reads `pool._queue._getters`) — which is itself
    # worth surfacing, because the alert is dead until someone fixes it.
    noDataState: NoData
    execErrState: OK
- orgId: 1
  name: generic
  folder: Shruti-Alerts
  interval: 1m
  rules:
  - uid: exporter_down
    title: exporter_down
    condition: B
    for: 5m
    labels:
      severity: P2
    annotations:
      summary: exporter target {{ .Labels.job }} on {{ .Labels.instance }} down
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 300
        to: 0
      model:
        refId: A
        expr: sum by(job) (up == 0) > 0
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
    noDataState: OK
    execErrState: OK
  # Every certificate we operate, once each: origin's (blackbox-edge) and
  # each regional edge's, whichever of its checks saw it. The reference job
  # sees origin's certificate again and is left out; the storage mirror is
  # served under its provider's certificate, which we cannot renew.
  - uid: tls_cert_expiring_soon
    title: tls_cert_expiring_soon
    condition: B
    for: 1h
    labels:
      severity: P2
    annotations:
      summary: TLS cert for {{ if $labels.edge }}edge {{ $labels.edge }}{{ else }}{{ $labels.job }}{{ end }} expires in <7 days
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 3600
        to: 0
      model:
        refId: A
        expr: min by (job, edge) (probe_ssl_earliest_cert_expiry{job!~"blackbox-mirror|blackbox-reference"}) - time()
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 604800
    noDataState: OK
    execErrState: OK
  - uid: langfuse_worker_queue_lag
    title: langfuse_worker_queue_lag
    condition: B
    for: 10m
    labels:
      severity: P2
      service: langfuse
    annotations:
      summary: langfuse worker queue depth >1000 for 10m
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: redis_db_keys{db="db0",instance=~".*langfuse.*"}
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 1000
    noDataState: OK
    execErrState: OK
- orgId: 1
  name: library-ingest
  folder: Shruti-Alerts
  interval: 1m
  rules:
  # The headline signal. Every other failure mode in this pipeline eventually
  # shows up here, because a job that is not progressing is exactly what the
  # user experiences as a spinner that never resolves. Healthy steady-state is
  # near zero regardless of volume: a normal ingest settles in minutes.
  - uid: ingest_jobs_stalled
    title: ingest_jobs_stalled
    condition: B
    for: 10m
    labels:
      severity: P1
      service: orchestrator
    annotations:
      summary: oldest unfinished ingest job is {{ $values.A }}s old
      description: |
        orchestrator.jobs has a job stuck in queued/running for over 30 minutes.
        A healthy ingest settles in minutes, so this means work is being accepted
        but not completed. Nothing crashes in this failure mode — containers stay
        green and healthz returns 200 — which is why this alert exists.

        Most likely causes, cheapest first:
          1. The ingest worker is not consuming. Check it is up and reading:
             ssh prod-eu 'docker logs --tail=200 shruti-ingest-1'
             Expect ingest_started / ingest_fetched lines. Total silence means it
             is not receiving work — check the outbox alert below.
          2. A dependency is down and every attempt is burning its retry budget.
             Look for ingest_failed at level=error, and read the `error` field:
             it is prefixed with the pipeline stage (fetch:/transcribe:/put ...).
          3. Deepgram credentials missing or rejected — this is the single most
             common cause after a fresh deploy. SHRUTI_DEEPGRAM_API_KEY must be
             set in /opt/shruti/.env.

        Inspect directly:
          docker exec -i shruti-orchestrator-postgres-1 \
            psql -U orchestrator -d orchestrator -c \
            "SELECT id, state, attempts, error, created_at FROM orchestrator.jobs \
              WHERE state IN ('queued','running') ORDER BY created_at LIMIT 20;"
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: max(shruti_orchestrator_oldest_unfinished_job_seconds)
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 1800
    noDataState: OK
    execErrState: OK
  # The relay draining orchestrator.outbox is a single goroutine. If it dies the
  # process stays up and healthy while both the ingest dispatch and the whole
  # track.events lifecycle stop — the most silent failure in the system.
  - uid: ingest_outbox_backlog
    title: ingest_outbox_backlog
    condition: B
    for: 5m
    labels:
      severity: P1
      service: orchestrator
    annotations:
      summary: orchestrator outbox has {{ $values.A }} row(s) overdue
      description: |
        orchestrator.outbox rows past their available_at and still unpublished.
        The retry backoff is already accounted for, so these are genuinely due.
        Healthy steady-state is 0 — the relay drains continuously.

        Runbook:
          1. ssh prod-eu 'docker logs --tail=200 shruti-orchestrator-1'
             — look for outbox_drain_failed.
          2. Verify the broker is reachable: the relay publishes to redis-streams,
             not the app redis. Check that container is healthy.
          3. Restarting the orchestrator is safe — the outbox is transactional and
             publishing is idempotent downstream (event ids are derived from the
             job id, so redelivery re-emits the same id).
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: max(shruti_orchestrator_outbox_backlog)
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: OK
  # A trickle of dead-letters is normal — users paste dead and private links. A
  # spike is not: it means a dependency broke and every ingest is burning its
  # full attempt budget before giving up. Threshold is deliberately above the
  # organic rate so bad links alone never page anyone.
  - uid: ingest_dead_letter_spike
    title: ingest_dead_letter_spike
    condition: B
    for: 10m
    labels:
      severity: P2
      service: orchestrator
    annotations:
      summary: '{{ $values.A }} ingest jobs dead-lettered in the last 15m'
      description: |
        Jobs reaching state=failed after exhausting their attempts. Some of this
        is organic (dead/private source URLs); a sustained spike means a
        dependency is failing for everyone.

        Distinguish the two from the logs — job_dead_lettered carries an
        `exhausted` field: true means the retry budget ran out (our dependency is
        sick), false means the source was never ingestable (the user's link).
          ssh prod-eu 'docker logs --tail=500 shruti-orchestrator-1 \
            | grep job_dead_lettered'
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 900
        to: 0
      model:
        refId: A
        expr: max(shruti_orchestrator_failed_jobs_recent)
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 10
    noDataState: OK
    execErrState: OK
  # storage-sync's /readyz turns 503 once no pass — regular or deep — has
  # completed cleanly for three SYNC_INTERVALs. A pass fails when the walk or
  # the mirror listing fails (the mirror stops advancing), or when any object
  # fails its copy or checksum read. Failed objects are retried on every
  # following pass, so a transient failure clears on the next pass and only a
  # failure that persists for three intervals gets here. That is paged on
  # purpose: the object it names is missing or outdated on the mirror, which
  # is the divergence the mirror exists to prevent. A process wedged inside a
  # pass stops recording successes and goes stale too.
  - uid: storage_sync_mirror_stale
    title: storage_sync_mirror_stale
    condition: B
    for: 15m
    labels:
      severity: P2
      service: storage-sync
    annotations:
      summary: storage-sync mirror is stale (readyz failing)
      description: |
        No storage-sync pass has completed cleanly for three SYNC_INTERVALs.
        Either the mirror is not advancing at all, or some objects fail on
        every pass and stay missing or outdated on the mirror. Readers served
        from the mirror see tracks the app reports as ready whose audio is
        missing.

        Runbook:
          1. Read the detail on origin — the body carries last_error and
             last_success_age_seconds:
               docker exec shruti-storage-sync-1 wget -qO- localhost:8089/readyz
          2. docker logs --tail=500 shruti-storage-sync-1
             — sync_pass_failed with `err` starting "walk:" or "list mirror:"
             means the mirror is not advancing; "N objects failed" with a
             steady `retrying` count means the same keys fail every pass, and
             the transfer_failed / mirror_state_failed lines before it name
             them.
          3. Most common: rotated credentials on either store (403 on list or
             put). Both need an .env update, NOT a restart — restarting will
             not fix a credential fault.
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 900
        to: 0
      model:
        refId: A
        expr: min(probe_success{job="blackbox-prod-eu",instance="http://storage-sync:8089/readyz"})
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
    noDataState: OK
    execErrState: OK
  # The mirror's public catalog manifest, fetched from the observability host.
  # Without it the mirror cannot serve as the read-only fallback even when its
  # objects are current. Optional: no SHRUTI_MIRROR_CONFIG_URL, no series.
  - uid: mirror_config_unreachable
    title: mirror_config_unreachable
    condition: B
    for: 10m
    labels:
      severity: P2
      service: storage-sync
    annotations:
      summary: storage mirror catalog manifest unreachable ({{ $labels.instance }})
      description: |
        The mirror's public config.json has not been fetchable as a JSON object
        for 10 minutes. Check the mirror bucket's public read access and that
        storage-sync still mirrors public/config.json (see
        storage_sync_mirror_stale).
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 300
        to: 0
      model:
        refId: A
        expr: min(probe_success{job="blackbox-mirror"})
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
    noDataState: OK
    execErrState: OK
- orgId: 1
  name: edge-nodes
  folder: Shruti-Alerts
  interval: 1m
  rules:
  # Regional edges, probed from the observability host every minute. /healthz
  # is the edge itself; /healthz/api and /healthz/cdn are answered through the
  # edge's own upstream connections, so they fail when that leg fails.
  #
  # Every rule reads a success ratio over the last 5 minutes, not the last
  # probe: a check failing two probes in three, or every other probe, holds
  # the ratio under 0.75 and pages, while one failed probe does not.
  # Leg rules only evaluate for an edge whose /healthz ratio is at least 0.5:
  # a hard-down or mostly-down edge pages once, as edge_node_down, while an
  # edge that is up most of the time still has its legs checked.
  #
  # Suppression uses the blackbox-reference probe, which origin's Caddy
  # answers without any app. The reference failing together with every
  # edge's /healthz is an outage of this host's own network: every edge rule
  # holds off and probe_reference_failing pages. The reference failing alone
  # means origin is unreachable: only the API legs hold off, since they fail
  # because origin does, and a dead edge still pages. No edges configured
  # means no series, which is not an outage; probe_scrape_failing watches the
  # probe path itself.
  - uid: edge_node_down
    title: edge_node_down
    condition: B
    for: 2m
    labels:
      severity: P1
      service: edge
    annotations:
      summary: edge {{ $labels.edge }} /healthz failing ({{ $values.A }} of probes passed over 5m)
      description: |
        The edge's own health endpoint, answered by Caddy without touching an
        upstream, is failing or flapping. The host, its Caddy container, its
        certificate or its network path is down; the region it serves has no
        reliable entry point.
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 300
        to: 0
      model:
        refId: A
        expr: min by (edge) (avg_over_time(probe_success{job="blackbox-edge-nodes",check="healthz"}[5m])) unless on () ((max(avg_over_time(probe_success{job="blackbox-reference"}[5m])) < 0.75) and on () (max(min by (edge) (avg_over_time(probe_success{job="blackbox-edge-nodes",check="healthz"}[5m]))) < 0.75))
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 0.75
    noDataState: OK
    execErrState: OK
  - uid: edge_node_api_leg_failing
    title: edge_node_api_leg_failing
    condition: B
    for: 3m
    labels:
      severity: P1
      service: edge
    annotations:
      summary: edge {{ $labels.edge }} cannot reliably reach origin (/healthz/api {{ $values.A }} passed over 5m)
      description: |
        The edge is up but origin's /healthz does not reliably come back
        through it. If edge_unhealthy is firing too, origin itself is down;
        otherwise the edge-to-origin leg is broken (origin unreachable from the
        edge's network, upstream TLS, or origin refusing the edge).
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 300
        to: 0
      model:
        refId: A
        expr: min by (edge) (avg_over_time(probe_success{job="blackbox-edge-nodes",check="api"}[5m])) and on (edge) (min by (edge) (avg_over_time(probe_success{job="blackbox-edge-nodes",check="healthz"}[5m])) >= 0.5) unless on () (max(avg_over_time(probe_success{job="blackbox-reference"}[5m])) < 0.75)
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 0.75
    noDataState: OK
    execErrState: OK
  # A probe that succeeds with a body under 64 KiB counts as failed: the probe
  # object is larger than that, so a short body is a truncated or substituted
  # response.
  - uid: edge_node_cdn_leg_failing
    title: edge_node_cdn_leg_failing
    condition: B
    for: 3m
    labels:
      severity: P1
      service: edge
    annotations:
      summary: edge {{ $labels.edge }} cannot reliably fetch from the CDN (/healthz/cdn {{ $values.A }} passed over 5m)
      description: |
        The edge is up but the CDN probe object does not reliably come back
        through it in full within the probe budget: an error status, a stalled
        transfer, or a body under 64 KiB. Audio and covers in the region fail
        the same way.
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 300
        to: 0
      model:
        refId: A
        expr: min by (edge) (avg_over_time(((probe_success{job="blackbox-edge-nodes",check="cdn"} * (probe_http_uncompressed_body_length{job="blackbox-edge-nodes",check="cdn"} >= bool 65536)) or probe_success{job="blackbox-edge-nodes",check="cdn"})[5m:1m])) and on (edge) (min by (edge) (avg_over_time(probe_success{job="blackbox-edge-nodes",check="healthz"}[5m])) >= 0.5) unless on () ((max(avg_over_time(probe_success{job="blackbox-reference"}[5m])) < 0.75) and on () (max(min by (edge) (avg_over_time(probe_success{job="blackbox-edge-nodes",check="healthz"}[5m]))) < 0.75))
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 0.75
    noDataState: OK
    execErrState: OK
  - uid: edge_node_cdn_leg_slow
    title: edge_node_cdn_leg_slow
    condition: B
    for: 10m
    labels:
      severity: P2
      service: edge
    annotations:
      summary: edge {{ $labels.edge }} CDN leg slow (avg {{ $values.A }}s over 10m)
      description: |
        Fetching the CDN probe object through the edge has averaged over 4s for
        10 minutes, against a 10s probe budget. Playback in the region is
        degraded before it fails.
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: max by (edge) (avg_over_time(probe_duration_seconds{job="blackbox-edge-nodes",check="cdn"}[10m])) and on (edge) (min by (edge) (avg_over_time(probe_success{job="blackbox-edge-nodes",check="healthz"}[5m])) >= 0.5) unless on () ((max(avg_over_time(probe_success{job="blackbox-reference"}[5m])) < 0.75) and on () (max(min by (edge) (avg_over_time(probe_success{job="blackbox-edge-nodes",check="healthz"}[5m]))) < 0.75))
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 4
    noDataState: OK
    execErrState: OK
  # The reference is a preflight to origin's public /healthz that origin's
  # Caddy answers itself, fetched by the same blackbox. It failing means this
  # host cannot reach origin's Caddy: origin's host or Caddy is down, or this
  # host's own network is.
  - uid: probe_reference_failing
    title: probe_reference_failing
    condition: B
    for: 3m
    labels:
      severity: P2
    annotations:
      summary: observability host cannot reach origin's Caddy
      description: |
        The blackbox on the observability host gets no answer from origin's
        Caddy (a preflight to /healthz, answered without any app). While this
        fires, edge API-leg alerts hold off, because they fail whenever origin
        does.

        If every edge is failing its /healthz from here too, the fault is this
        host's own network: all edge alerts hold off and the edges are
        unwatched until it recovers. Otherwise origin's host or Caddy is down
        or unreachable; edge_unhealthy, probed from origin's side, says which.
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 300
        to: 0
      model:
        refId: A
        expr: max(avg_over_time(probe_success{job="blackbox-reference"}[5m]))
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 0.75
    noDataState: OK
    execErrState: OK
  # Canary for the probe path: every rule above reads a probe result, and all
  # of them go quiet when the observability host's blackbox stops answering.
  - uid: probe_scrape_failing
    title: probe_scrape_failing
    condition: B
    for: 5m
    labels:
      severity: P2
    annotations:
      summary: probe job {{ $labels.job }} is not being scraped — edge and mirror alerts are blind
      description: |
        Prometheus cannot scrape the blackbox exporter on the observability
        host for this job, so the edge and mirror probe results are missing.
          docker compose ps blackbox-exporter
          docker compose logs --tail=100 blackbox-exporter
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 300
        to: 0
      model:
        refId: A
        expr: min by (job) (up{job=~"blackbox-edge-nodes|blackbox-mirror|blackbox-reference"})
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
    noDataState: OK
    execErrState: OK
