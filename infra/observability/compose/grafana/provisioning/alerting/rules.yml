    labels:
      severity: P2
      service: langfuse
    annotations:
      summary: langfuse /api/public/health failing
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: probe_success{instance=~".*langfuse.*health.*"}
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
