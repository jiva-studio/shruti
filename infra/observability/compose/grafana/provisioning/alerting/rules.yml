apiVersion: 1
groups:
- orgId: 1
  name: infra
  folder: Shruti-Alerts
  interval: 1m
  rules:
  - uid: host_disk_warning
    title: host_disk_warning
    condition: B
    for: 10m
    labels:
      severity: P2
    annotations:
      summary: Disk free <15% on {{ .Labels.host }} {{ .Labels.mountpoint }}
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: min by (host,mountpoint) (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"})
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 0.15
    noDataState: OK
    execErrState: OK
  - uid: host_disk_critical
    title: host_disk_critical
    condition: B
    for: 2m
    labels:
      severity: P1
    annotations:
      summary: Disk free <5% on {{ .Labels.host }} {{ .Labels.mountpoint }}
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: min by (host,mountpoint) (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"})
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 0.05
    noDataState: OK
    execErrState: OK
  - uid: host_memory_high
    title: host_memory_high
    condition: B
    for: 10m
    labels:
      severity: P2
    annotations:
      summary: Available memory <10% on {{ .Labels.host }}
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: avg by (host) (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 0.1
    noDataState: OK
    execErrState: OK
  - uid: host_offline
    title: host_offline
    condition: B
    for: 2m
    labels:
      severity: P1
    annotations:
      summary: 'node_exporter target down: {{ .Labels.instance }}'
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 300
        to: 0
      model:
        refId: A
        expr: sum by(job) (up{job=~"node-.*"}) < count by(job) (up{job=~"node-.*"})
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
    noDataState: OK
    execErrState: OK
- orgId: 1
  name: container
  folder: Shruti-Alerts
  interval: 1m
  rules:
  - uid: container_restart_loop
    title: container_restart_loop
    condition: B
    for: 5m
    labels:
      severity: P1
    annotations:
      summary: Container {{ .Labels.name }} restarted >3 times in 5m
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 300
        to: 0
      model:
        refId: A
        expr: increase(container_last_seen{name!=""}[5m]) and increase(container_start_time_seconds{name!=""}[5m]) > 3
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 3
    noDataState: OK
    execErrState: OK
  - uid: container_oom_killed
    title: container_oom_killed
    condition: B
    for: 1m
    labels:
      severity: P1
    annotations:
      summary: Container {{ .Labels.name }} OOM-killed
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 300
        to: 0
      model:
        refId: A
        expr: sum by(name) (rate(container_oom_events_total[5m])) > 0
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: OK
