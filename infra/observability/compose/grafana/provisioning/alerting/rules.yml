apiVersion: 1
groups:
- orgId: 1
  name: infra
  folder: Shruti-Alerts
  interval: 1m
  rules:
  - uid: host_disk_warning
    title: host_disk_warning
    condition: B
    for: 10m
    labels:
      severity: P2
    annotations:
      summary: Disk free <15% on {{ .Labels.host }} {{ .Labels.mountpoint }}
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: min by (host,mountpoint) (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"})
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 0.15
    noDataState: OK
    execErrState: OK
  - uid: host_disk_critical
    title: host_disk_critical
    condition: B
    for: 2m
    labels:
      severity: P1
    annotations:
      summary: Disk free <5% on {{ .Labels.host }} {{ .Labels.mountpoint }}
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: min by (host,mountpoint) (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"})
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 0.05
    noDataState: OK
    execErrState: OK
  - uid: host_memory_high
    title: host_memory_high
    condition: B
    for: 10m
    labels:
      severity: P2
    annotations:
      summary: Available memory <10% on {{ .Labels.host }}
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: avg by (host) (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 0.1
    noDataState: OK
    execErrState: OK
  - uid: host_offline
    title: host_offline
    condition: B
    for: 2m
    labels:
      severity: P1
    annotations:
      summary: 'node_exporter target down: {{ .Labels.instance }}'
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 300
        to: 0
      model:
        refId: A
        expr: sum by(job) (up{job=~"node-.*"}) < count by(job) (up{job=~"node-.*"})
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
    noDataState: OK
    execErrState: OK
- orgId: 1
  name: container
  folder: Shruti-Alerts
  interval: 1m
  rules:
  - uid: container_restart_loop
    title: container_restart_loop
    condition: B
    for: 5m
    labels:
      severity: P1
    annotations:
      summary: Container {{ .Labels.image }} restarted >3 times in 5m
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 300
        to: 0
      model:
        refId: A
        expr: changes(container_start_time_seconds{name!=""}[5m]) > 3
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 3
    # Keep OK on NoData and let the dedicated cadvisor_metrics_missing watchdog
    # (below) be the single P2 signal for missing data, instead of paging P1
    # forever if the metrics pipeline ever breaks.
    noDataState: OK
    execErrState: OK
  - uid: container_oom_killed
    title: container_oom_killed
    condition: B
    for: 1m
    labels:
      severity: P1
    annotations:
      summary: Container {{ .Labels.image }} OOM-killed
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 300
        to: 0
      model:
        refId: A
        expr: sum by(name, image) (rate(container_oom_events_total[5m])) > 0
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    # OK on NoData for the same reason as container_restart_loop above — the
    # cadvisor_metrics_missing watchdog owns the missing-data signal.
    noDataState: OK
    execErrState: OK
  # Watchdog: catches a degraded/broken cAdvisor directly. On cgroup v2 a
  # private cgroupns makes it emit only container_last_seen{id="/"} (no name=
  # series), silently blinding the two rules above. Fires when there are zero
  # per-container series at all.
  #
  # NB: do not use absent(container_last_seen{name!=""}) here. When the series
  # do exist absent() returns an empty vector, which Grafana's unified alerting
  # reads as No Data — and with noDataState:Alerting that would make this
  # watchdog page continuously on a healthy host (grafana_state_reason=NoData,
  # Value:[no value]). Instead count the series and coalesce to 0 with
  # `or vector(0)`, so refId A always yields a number: >0 healthy, 0 when the
  # metrics are genuinely gone (or the scrape target is down). NoData is
  # reserved for the datasource itself being unreachable — execErrState catches
  # that, noDataState stays OK so a transient eval gap doesn't page.
  - uid: cadvisor_metrics_missing
    title: cadvisor_metrics_missing
    condition: B
    for: 10m
    labels:
      severity: P2
    annotations:
      summary: cAdvisor per-container metrics missing — blind to container restarts/OOM
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 300
        to: 0
      model:
        refId: A
        expr: count(container_last_seen{name!=""}) or vector(0)
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
    noDataState: OK
    execErrState: Alerting
- orgId: 1
  name: app-health
  folder: Shruti-Alerts
  interval: 30s
  rules:
  # Probes the public origin through caddy (https/443). The chat/auth/share
  # probes below hit service ports directly and stay green when only the
  # reverse proxy is down — this is the rule that catches that outage. Scoped
  # to its job: regional edges' /healthz probes share the URL shape and page
  # through the edge-nodes group instead.
  - uid: edge_unhealthy
    title: edge_unhealthy
    condition: B
    for: 1m
    labels:
      severity: P1
    annotations:
      summary: Public edge https /healthz failing — caddy / 443 / public backend down
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 300
        to: 0
      model:
        refId: A
        expr: probe_success{job="blackbox-edge",instance=~"https://.*/healthz"}
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
    noDataState: Alerting
    execErrState: Alerting
  - uid: chat_unhealthy
    title: chat_unhealthy
    condition: B
    for: 2m
    labels:
      severity: P1
      service: chat
    annotations:
      summary: chat /healthz failing
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 300
        to: 0
      model:
        refId: A
        expr: probe_success{instance=~".*:8080/healthz"}
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
    noDataState: Alerting
    execErrState: Alerting
  - uid: auth_unhealthy
    title: auth_unhealthy
    condition: B
    for: 2m
    labels:
      severity: P1
      service: auth
    annotations:
      summary: auth /healthz failing
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 300
        to: 0
      model:
        refId: A
        expr: probe_success{instance=~".*:8081/auth/healthz"}
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
    noDataState: Alerting
    execErrState: Alerting
  - uid: share_audio_unhealthy
    title: share_audio_unhealthy
    condition: B
    for: 2m
    labels:
      severity: P2
      service: share-audio
    annotations:
      summary: share-audio /healthz failing
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 300
        to: 0
      model:
        refId: A
        expr: probe_success{instance=~".*:8082/healthz"}
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
    noDataState: OK
    execErrState: OK
  - uid: share_video_unhealthy
    title: share_video_unhealthy
    condition: B
    for: 2m
    labels:
      severity: P2
      service: share-video
    annotations:
      summary: share-video /healthz failing
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 300
        to: 0
      model:
        refId: A
        expr: probe_success{instance=~".*:8083/healthz"}
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
    noDataState: OK
    execErrState: OK
  - uid: langfuse_unhealthy
    title: langfuse_unhealthy
    condition: B
    for: 5m
    labels:
      severity: P2
      service: langfuse
    annotations:
      summary: langfuse /api/public/health failing
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: probe_success{instance=~".*langfuse.*health.*"}
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
    noDataState: OK
    execErrState: OK
- orgId: 1
  name: postgres
  folder: Shruti-Alerts
  interval: 1m
  rules:
  - uid: pg_connections_high
    title: pg_connections_high
    condition: B
    for: 10m
    labels:
      severity: P2
      service: postgres
    annotations:
      summary: Postgres connections >80% of max
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: sum(pg_stat_activity_count) by (instance) / max(pg_settings_max_connections) by (instance)
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0.8
    noDataState: OK
    execErrState: OK
  - uid: pg_long_running_query
    title: pg_long_running_query
    condition: B
    for: 5m
    labels:
      severity: P3
      service: postgres
    annotations:
      summary: Postgres transaction running >10 minutes
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: max(pg_stat_activity_max_tx_duration) by (instance)
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 600
    noDataState: OK
    execErrState: OK
  - uid: pg_deadlocks
    title: pg_deadlocks
    condition: B
    for: 5m
    labels:
      severity: P2
      service: postgres
    annotations:
      summary: Postgres deadlock rate elevated
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: rate(pg_stat_database_deadlocks[5m])
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0.1
    noDataState: OK
    execErrState: OK
  - uid: pg_up_down
    title: pg_up_down
    condition: B
    for: 5m
    labels:
      severity: P2
      service: postgres
    annotations:
      summary: postgres-exporter pg_up == 0
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: pg_up
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
    noDataState: OK
    execErrState: OK
