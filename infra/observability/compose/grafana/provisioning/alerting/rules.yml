- orgId: 1
  name: postgres
  folder: Shruti-Alerts
  interval: 1m
  rules:
  - uid: pg_connections_high
    title: pg_connections_high
    condition: B
    for: 10m
    labels:
      severity: P2
      service: postgres
    annotations:
      summary: Postgres connections >80% of max
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: sum(pg_stat_activity_count) by (instance) / max(pg_settings_max_connections) by (instance)
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0.8
    noDataState: OK
    execErrState: OK
  - uid: pg_long_running_query
    title: pg_long_running_query
    condition: B
    for: 5m
    labels:
      severity: P3
      service: postgres
    annotations:
      summary: Postgres transaction running >10 minutes
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: max(pg_stat_activity_max_tx_duration) by (instance)
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 600
    noDataState: OK
    execErrState: OK
  - uid: pg_deadlocks
    title: pg_deadlocks
    condition: B
    for: 5m
    labels:
      severity: P2
      service: postgres
    annotations:
      summary: Postgres deadlock rate elevated
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: rate(pg_stat_database_deadlocks[5m])
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0.1
    noDataState: OK
    execErrState: OK
  - uid: pg_up_down
    title: pg_up_down
    condition: B
    for: 5m
    labels:
      severity: P2
      service: postgres
    annotations:
      summary: postgres-exporter pg_up == 0
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: pg_up
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
    noDataState: OK
    execErrState: OK
