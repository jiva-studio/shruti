- orgId: 1
  name: redis
  folder: Shruti-Alerts
  interval: 1m
  rules:
  - uid: redis_memory_high
    title: redis_memory_high
    condition: B
    for: 10m
    labels:
      severity: P2
      service: redis
    annotations:
      summary: Redis used / max >90%
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: redis_memory_used_bytes / on(instance) redis_memory_max_bytes
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0.9
    noDataState: OK
    execErrState: OK
  - uid: redis_evictions
    title: redis_evictions
    condition: B
    for: 5m
    labels:
      severity: P3
      service: redis
    annotations:
      summary: Redis evicting keys
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: rate(redis_evicted_keys_total[5m])
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 1
    noDataState: OK
    execErrState: OK
- orgId: 1
  name: logs
  folder: Shruti-Alerts
  interval: 1m
  rules:
  - uid: error_rate_spike
    title: error_rate_spike
    condition: B
    for: 5m
    labels:
      severity: P2
    annotations:
      summary: Error log rate spike vs 1h baseline
    data:
    - refId: A
      datasourceUid: loki
      relativeTimeRange:
        from: 300
        to: 0
      model:
        refId: A
        expr: sum(rate({level="error"}[5m])) > 3 * sum(rate({level="error"}[1h] offset 1h))
        queryType: instant
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 3
    noDataState: OK
    execErrState: OK
  - uid: log_silence_chat
    title: log_silence_chat
    condition: B
    for: 10m
    labels:
      severity: P1
      service: chat
    annotations:
      summary: chat container produced 0 log lines for 10m
    data:
    - refId: A
      datasourceUid: loki
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: sum(rate({service="chat"}[10m]))
        queryType: instant
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 0.001
    noDataState: OK
    execErrState: OK
  - uid: langfuse_5xx
    title: langfuse_5xx
    condition: B
    for: 5m
    labels:
      severity: P2
      service: langfuse
    annotations:
      summary: langfuse container error log rate elevated
    data:
    - refId: A
      datasourceUid: loki
      relativeTimeRange:
        from: 300
        to: 0
      model:
        refId: A
        expr: sum(rate({container=~"langfuse.*", level="error"}[5m]))
        queryType: instant
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0.5
    noDataState: OK
    execErrState: OK
- orgId: 1
  name: llm
  folder: Shruti-Alerts
  interval: 5m
  rules:
  - uid: llm_cost_per_hour_high
    title: llm_cost_per_hour_high
    condition: B
    for: 15m
    labels:
      severity: P3
      service: chat
    annotations:
      summary: LLM spend >$5/hour over last 15m
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 900
        to: 0
      model:
        refId: A
        expr: langfuse_cost_per_hour
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 5
    noDataState: OK
    execErrState: OK
  - uid: llm_p95_latency_high
    title: llm_p95_latency_high
    condition: B
    for: 15m
    labels:
      severity: P3
      service: chat
    annotations:
      summary: LLM p95 latency >10s for 15m
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 900
        to: 0
      model:
        refId: A
        expr: langfuse_p95_latency
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 10
    noDataState: OK
    execErrState: OK
- orgId: 1
  name: generic
  folder: Shruti-Alerts
  interval: 1m
  rules:
  - uid: exporter_down
    title: exporter_down
    condition: B
    for: 5m
    labels:
      severity: P2
    annotations:
      summary: exporter target {{ .Labels.job }} on {{ .Labels.instance }} down
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 300
        to: 0
      model:
        refId: A
        expr: sum by(job) (up == 0) > 0
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
    noDataState: OK
    execErrState: OK
  - uid: tls_cert_expiring_soon
    title: tls_cert_expiring_soon
    condition: B
    for: 1h
    labels:
      severity: P2
    annotations:
      summary: TLS cert for {{ .Labels.instance }} expires in <7 days
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 3600
        to: 0
      model:
        refId: A
        expr: probe_ssl_earliest_cert_expiry - time()
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 604800
    noDataState: OK
    execErrState: OK
  - uid: langfuse_worker_queue_lag
    title: langfuse_worker_queue_lag
    condition: B
    for: 10m
    labels:
      severity: P2
      service: langfuse
    annotations:
      summary: langfuse worker queue depth >1000 for 10m
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: redis_db_keys{db="db0",instance=~".*langfuse.*"}
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 1000
    noDataState: OK
    execErrState: OK
