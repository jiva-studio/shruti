- orgId: 1
  name: generic
  folder: Shruti-Alerts
  interval: 1m
  rules:
  - uid: exporter_down
    title: exporter_down
    condition: B
    for: 5m
    labels:
      severity: P2
    annotations:
      summary: exporter target {{ .Labels.job }} on {{ .Labels.instance }} down
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 300
        to: 0
      model:
        refId: A
        expr: sum by(job) (up == 0) > 0
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
    noDataState: OK
    execErrState: OK
  - uid: tls_cert_expiring_soon
    title: tls_cert_expiring_soon
    condition: B
    for: 1h
    labels:
      severity: P2
    annotations:
      summary: TLS cert for {{ .Labels.instance }} expires in <7 days
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 3600
        to: 0
      model:
        refId: A
        expr: probe_ssl_earliest_cert_expiry - time()
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 604800
    noDataState: OK
    execErrState: OK
  - uid: langfuse_worker_queue_lag
    title: langfuse_worker_queue_lag
    condition: B
    for: 10m
    labels:
      severity: P2
      service: langfuse
    annotations:
      summary: langfuse worker queue depth >1000 for 10m
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: redis_db_keys{db="db0",instance=~".*langfuse.*"}
        instant: true
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 1000
    noDataState: OK
    execErrState: OK
