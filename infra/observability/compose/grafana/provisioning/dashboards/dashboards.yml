# infra/observability/compose/grafana/provisioning/dashboards/dashboards.yml
#
# Provider config — loads any *.json under ./json/ into the "Shruti"
# folder. We bundle three community dashboards (Node Exporter Full 1860,
# Docker cAdvisor 14282, PostgreSQL 9628) plus any future custom JSON.

apiVersion: 1

providers:
  - name: shruti
    orgId: 1
    folder: Shruti
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json
      foldersFromFilesStructure: false
