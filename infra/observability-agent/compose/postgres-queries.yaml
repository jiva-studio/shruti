# Custom queries for postgres-exporter (PG_EXPORTER_EXTEND_QUERY_PATH).
#
# Standard pg_exporter ships the usual stuff (pg_stat_database, connections,
# wal, replication). Below we add Lectorium-specific business metrics on top.
#
# Each top-level key is the metric namespace; postgres-exporter prepends
# the metric name with the key + the per-column `metrics[*].usage`.
#
# Naming convention: `lectorium_<thing>_<unit>` — keeps our metrics
# grouped together in PromQL autocomplete.

# Share-video render queue depth. The Go worker pulls from public.tasks
# with `FOR UPDATE SKIP LOCKED`; pending = waiting work. Grafana alert
# fires when this stays >50 for >10min.
lectorium_share_video_queue_depth:
  query: |
    SELECT count(*)::bigint AS depth
      FROM public.tasks
     WHERE status = 'pending'
  master: true
  metrics:
    - depth:
        usage: GAUGE
        description: "Number of share-video render tasks waiting to be picked up"

# Age (in seconds) of the OLDEST pending task. Better SLO signal than raw
# depth — small queue with one ancient stuck task is worse than 50 fresh
# tasks. Alert: >300s.
lectorium_share_video_oldest_pending_seconds:
  query: |
    SELECT COALESCE(
      EXTRACT(EPOCH FROM (NOW() - MIN(created_at)))::bigint,
      0
    ) AS age_seconds
      FROM public.tasks
     WHERE status = 'pending'
  master: true
  metrics:
    - age_seconds:
        usage: GAUGE
        description: "Age (seconds) of the oldest share-video task still pending"

# Tasks by state — useful for dashboards (`pending`, `running`, `done`,
# `failed`). Cardinality bounded by enum.
lectorium_share_video_tasks_by_state:
  query: |
    SELECT status, count(*)::bigint AS count
      FROM public.tasks
     GROUP BY status
  master: true
  metrics:
    - status:
        usage: LABEL
        description: "Task status"
    - count:
        usage: GAUGE
        description: "Number of share-video tasks in each state"

# ── Subscription / RevenueCat ─────────────────────────────────────────
# Three metrics covering the three things that can rot silently:
#   - tier_count:     product signal — free/pro split. Drives the
#                     conversion dashboard.
#   - webhook_stuck:  operational signal — RC webhooks that hit our
#                     handler but never reached processed_at past RC's
#                     retry budget (~80 min). Phase-8 reconciler should
#                     keep this near 0 within 6h of any stall.
#   - tier_stale:     operational signal — users with rc_app_user_id set
#                     but tier_updated_at older than 24h (or NULL).
#                     Indicates the reconciler is falling behind or RC
#                     /v1/subscribers is unreachable.

# Per-tier user counts. Free vs pro is the headline funnel metric.
lectorium_subscription_tier_count:
  query: |
    SELECT tier, count(*)::bigint AS count
      FROM auth.users
     GROUP BY tier
  master: true
  metrics:
    - tier:
        usage: LABEL
        description: "Subscription tier — free | pro"
    - count:
        usage: GAUGE
        description: "Number of auth.users rows in each tier"

# Webhooks RC has delivered but our handler never marked processed.
# >15 min old means RC has likely given up retrying (5 retries / 80 min).
# Without the Phase-8 reconciler this would grow unbounded; with it,
# steady-state should be 0.
lectorium_rc_webhook_unprocessed_count:
  query: |
    SELECT count(*)::bigint AS count
      FROM auth.rc_webhook_events
     WHERE processed_at IS NULL
       AND received_at < now() - interval '15 min'
  master: true
  metrics:
    - count:
        usage: GAUGE
        description: "RC webhook events past their RC retry budget (>15 min) and still unprocessed"

# Users whose subscription state is older than the reconciliation
# threshold. Phase-8 reconciler should never let this grow past one or
# two sweep windows (12-18h). Steady-state spike means the cron isn't
# running or RC API is consistently failing.
lectorium_subscription_tier_stale_count:
  query: |
    SELECT count(*)::bigint AS count
      FROM auth.users
     WHERE rc_app_user_id IS NOT NULL
       AND (tier_updated_at IS NULL
            OR tier_updated_at < now() - interval '24 hours')
  master: true
  metrics:
    - count:
        usage: GAUGE
        description: "Users with rc_app_user_id set but tier_updated_at >24h old or NULL"

# Cleanup-worker outbox backlog. The Go worker LISTENs on the `outbox`
# channel + sweeps every CLEANUP_SWEEP_INTERVAL (default 5m) and stamps
# `processed_at` once side-effects (Langfuse purge, etc.) succeed. Anything
# still NULL after an hour means the worker is wedged or its downstream
# (Langfuse) is unreachable — silent data-deletion debt piling up. Grafana
# alert fires when this >0 for >5m.
lectorium_outbox_unprocessed_count:
  query: |
    SELECT count(*)::bigint AS count
      FROM app.outbox
     WHERE processed_at IS NULL
       AND occurred_at < now() - interval '1 hour'
  master: true
  metrics:
    - count:
        usage: GAUGE
        description: "Outbox rows pending processing for >1 hour"
